<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Πλημμυρική έκταση και υποδομές: πιθανή έκθεση, όχι βεβαιωμένη ζημιά"><rect width="1200" height="650" fill="#F5F9FB"/><style>text{font-family:"Noto Sans Display","DejaVu Sans",Arial,sans-serif;} .heading{font-size:32px;font-weight:700;fill:#123044;} .sub{font-size:20px;fill:#536F80;} .label{font-size:22px;font-weight:700;fill:#123044;} .body{font-size:17px;fill:#355469;} .small{font-size:15px;fill:#526878;}</style><text x="58" y="64" class="heading">Από τον χάρτη πλημμύρας στην πιθανή έκθεση</text><text x="58" y="103" class="sub">Μια επικάλυψη δεδομένων αναδεικνύει υποδομές για έλεγχο.</text><rect x="56" y="136" width="695" height="455" rx="18" fill="#FFFFFF" stroke="#CBDAE2" stroke-width="2"/><rect x="86" y="164" width="637" height="398" rx="12" fill="#F4F6EF"/><path d="M114 206 L693 491" fill="none" stroke="#D5CBB8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 541 L638 181" fill="none" stroke="#D5CBB8" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 206 L693 491" fill="none" stroke="#FBFAF5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="15,12"/><path d="M180 541 L638 181" fill="none" stroke="#FBFAF5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="15,12"/><path d="M365 168 Q445 197 440 248 Q489 287 467 337 Q545 394 534 451 Q560 507 626 555 L346 555 Q353 502 310 455 Q332 393 286 362 Q343 299 322 265 Q349 214 365 168 Z" fill="#B4DAEE" stroke="#5AABD6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="172" y="264" width="54" height="41" rx="5" fill="#647B8A" stroke="#ffffff" stroke-width="2"/><rect x="180" y="273" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="203" y="273" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="252" y="192" width="54" height="41" rx="5" fill="#647B8A" stroke="#ffffff" stroke-width="2"/><rect x="260" y="201" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="283" y="201" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="558" y="218" width="54" height="41" rx="5" fill="#647B8A" stroke="#ffffff" stroke-width="2"/><rect x="566" y="227" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="589" y="227" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="607" y="360" width="54" height="41" rx="5" fill="#647B8A" stroke="#ffffff" stroke-width="2"/><rect x="615" y="369" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="638" y="369" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="274" y="475" width="54" height="41" rx="5" fill="#647B8A" stroke="#ffffff" stroke-width="2"/><rect x="282" y="484" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="305" y="484" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="468" y="425" width="54" height="41" rx="5" fill="#C97632" stroke="#ffffff" stroke-width="2"/><rect x="476" y="434" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="499" y="434" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="377" y="309" width="54" height="41" rx="5" fill="#C97632" stroke="#ffffff" stroke-width="2"/><rect x="385" y="318" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="408" y="318" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="585" y="504" width="54" height="41" rx="5" fill="#647B8A" stroke="#ffffff" stroke-width="2"/><rect x="593" y="513" width="12" height="10" rx="1" fill="#F1F7F8"/><rect x="616" y="513" width="12" height="10" rx="1" fill="#F1F7F8"/><text x="110" y="550" class="small">Σχηματικός χάρτης</text><rect x="782" y="143" width="374" height="136" rx="14" fill="#FFFFFF" stroke="#CBDAE2" stroke-width="2"/><text x="803" y="188" class="label" font-size="20">1. Έκταση πλημμύρας</text><text x="803" y="220" class="body" font-size="17">Πού παρατηρείται το φαινόμενο;</text><rect x="782" y="298" width="374" height="136" rx="14" fill="#FFFFFF" stroke="#CBDAE2" stroke-width="2"/><text x="803" y="345" class="label" font-size="20">2. Θέση υποδομών</text><text x="803" y="380" class="body" font-size="17">Τι ενδέχεται να εκτίθεται;</text><rect x="782" y="454" width="374" height="136" rx="14" fill="#FFF5E7" stroke="#E8BE7A" stroke-width="2"/><text x="803" y="502" class="label" font-size="20">3. Χρειάζεται έλεγχος</text><text x="803" y="537" class="body" font-size="17">Έκθεση ≠ τεκμηριωμένη ζημιά</text><text x="60" y="635" class="small">Δεν απεικονίζονται πραγματικές πλημμύρες, κτίρια ή εκτιμήσεις ζημιών.</text></svg>