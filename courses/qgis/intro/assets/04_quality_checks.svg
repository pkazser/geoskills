<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Έξι έλεγχοι πριν από την ανάλυση">
<rect width="1200" height="640" fill="#FFFFFF"/>
<text x="54" y="65" font-family="Noto Sans Display, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#173247">Έξι έλεγχοι πριν από την ανάλυση</text>
<line x1="54" y1="91" x2="1146" y2="91" stroke="#d7e5ed" stroke-width="2"/>
<rect x="55" y="130" width="531" height="127" rx="16" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<rect x="71" y="147" width="76" height="91" rx="13" fill="#e0f1f0" stroke="#e0f1f0" stroke-width="1"/>
<text x="109" y="202" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#067982" text-anchor="middle">01</text>
<text x="167" y="180" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#173247" text-anchor="start">Πληρότητα</text>
<text x="167" y="218" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b6475" text-anchor="start">Λείπουν σχολεία ή δρόμοι;</text>
<rect x="611" y="130" width="531" height="127" rx="16" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<rect x="627" y="147" width="76" height="91" rx="13" fill="#e0f1f0" stroke="#e0f1f0" stroke-width="1"/>
<text x="665" y="202" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#067982" text-anchor="middle">02</text>
<text x="723" y="180" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#173247" text-anchor="start">Μοναδικότητα</text>
<text x="723" y="218" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b6475" text-anchor="start">Υπάρχουν διπλότυπα;</text>
<rect x="55" y="277" width="531" height="127" rx="16" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<rect x="71" y="294" width="76" height="91" rx="13" fill="#e0f1f0" stroke="#e0f1f0" stroke-width="1"/>
<text x="109" y="349" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#067982" text-anchor="middle">03</text>
<text x="167" y="327" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#173247" text-anchor="start">Γεωμετρία</text>
<text x="167" y="365" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b6475" text-anchor="start">Οι θέσεις είναι σωστές;</text>
<rect x="611" y="277" width="531" height="127" rx="16" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<rect x="627" y="294" width="76" height="91" rx="13" fill="#e0f1f0" stroke="#e0f1f0" stroke-width="1"/>
<text x="665" y="349" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#067982" text-anchor="middle">04</text>
<text x="723" y="327" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#173247" text-anchor="start">CRS</text>
<text x="723" y="365" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b6475" text-anchor="start">Ξέρουμε το σύστημα αναφοράς;</text>
<rect x="55" y="424" width="531" height="127" rx="16" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<rect x="71" y="441" width="76" height="91" rx="13" fill="#e0f1f0" stroke="#e0f1f0" stroke-width="1"/>
<text x="109" y="496" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#067982" text-anchor="middle">05</text>
<text x="167" y="474" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#173247" text-anchor="start">Μονάδες</text>
<text x="167" y="512" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b6475" text-anchor="start">Το 300 σημαίνει μέτρα;</text>
<rect x="611" y="424" width="531" height="127" rx="16" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<rect x="627" y="441" width="76" height="91" rx="13" fill="#e0f1f0" stroke="#e0f1f0" stroke-width="1"/>
<text x="665" y="496" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#067982" text-anchor="middle">06</text>
<text x="723" y="474" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#173247" text-anchor="start">Προέλευση</text>
<text x="723" y="512" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b6475" text-anchor="start">Πηγή, ημερομηνία, άδεια;</text>
<text x="54" y="614" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b6475" text-anchor="start">Έλεγχος πριν την ανάλυση = λιγότερα λανθασμένα συμπεράσματα.</text>
</svg>