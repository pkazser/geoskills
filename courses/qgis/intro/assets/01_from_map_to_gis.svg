<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Θέση και γνωρίσματα οδηγούν σε χωρικό ερώτημα και τεκμηριωμένο αποτέλεσμα"><rect width="1200" height="430" fill="#f7fbfd"/><text x="600" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#153b4b">Από τη γεωγραφική πληροφορία στο τεκμηριωμένο αποτέλεσμα</text><rect x="38" y="97" width="238" height="157" rx="18" fill="#e8f2ff" stroke="#b8cbd3" stroke-width="2"/><text x="157" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153b4b">Θέση στον χώρο</text><text x="157" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#506575">Πού βρίσκονται;</text><rect x="346" y="97" width="238" height="157" rx="18" fill="#e6f6f2" stroke="#b8cbd3" stroke-width="2"/><text x="465" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153b4b">Χαρακτηριστικά</text><text x="465" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#506575">Τι γνωρίζουμε;</text><rect x="654" y="97" width="238" height="157" rx="18" fill="#fff3e1" stroke="#b8cbd3" stroke-width="2"/><text x="773" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153b4b">Χωρικό ερώτημα</text><text x="773" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#506575">Τι θέλουμε να μάθουμε;</text><rect x="962" y="97" width="238" height="157" rx="18" fill="#f1efff" stroke="#b8cbd3" stroke-width="2"/><text x="1081" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153b4b">Αποτέλεσμα</text><text x="1081" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#506575">Τι τεκμηριώνεται;</text><path d="M290 171 h 34 l -11 -9 m 11 9 l -11 9" fill="none" stroke="#4f859d" stroke-width="4" stroke-linecap="round"/><path d="M598 171 h 34 l -11 -9 m 11 9 l -11 9" fill="none" stroke="#4f859d" stroke-width="4" stroke-linecap="round"/><path d="M906 171 h 34 l -11 -9 m 11 9 l -11 9" fill="none" stroke="#4f859d" stroke-width="4" stroke-linecap="round"/><text x="600" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#153b4b">Παράδειγμα: θέση πάρκων + δημόσια πρόσβαση + δίκτυο πεζών</text><text x="600" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#176a7a">→ εξέταση εγγύτητας και πραγματικών διαδρομών, με σαφείς παραδοχές</text></svg>