   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="29.7" y="42.775612" transform="rotate(-0 29.7 42.775612)">Τι δικαιούμαστε να συμπεράνουμε;</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6f7b" x="29.7" y="62.789471" transform="rotate(-0 29.7 62.789471)">Προχωράμε από την περιγραφή στην απόφαση μόνο με επαρκή τεκμηρίωση.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="79.92" y="134.822783" transform="rotate(-0 79.92 134.822783)">1. Περιγραφή</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6f7b" x="244.53" y="134.975891" transform="rotate(-0 244.53 134.975891)">Η Β έχει εκτιμώμενη κάλυψη 34,6% στα 10 λεπτά.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="79.92" y="191.818413" transform="rotate(-0 79.92 191.818413)">2. Ερμηνεία με όρους</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6f7b" x="244.53" y="191.963786" transform="rotate(-0 244.53 191.963786)">Η Β αξίζει πρόσθετη διερεύνηση, αν οι πηγές επαληθευτούν.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="79.92" y="248.814042" transform="rotate(-0 79.92 248.814042)">3. Απόφαση χωροθέτησης</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6f7b" x="244.53" y="248.96715" transform="rotate(-0 244.53 248.96715)">Απαιτεί επιπλέον χωρικά, κοινωνικά και πολεοδομικά κριτήρια.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6f7b" x="74.34" y="310.912764" transform="rotate(-0 74.34 310.912764)">Η ύπαρξη αριθμών δεν αρκεί από μόνη της για να νομιμοποιήσει μια πολιτική απόφαση.</text>
   </g>
  </g>
