   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="29.7" y="42.775612" transform="rotate(-0 29.7 42.775612)">Ποια δεδομένα χρειαζόμαστε;</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6f7b" x="29.7" y="62.789471" transform="rotate(-0 29.7 62.789471)">Κάθε σύνολο προσθέτει διαφορετική πληροφορία στην ερώτηση.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="43.65" y="140.846711" transform="rotate(-0 43.65 140.846711)">Πάρκα</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(43.65 166.346438)">Πολύγωνα</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(43.65 178.941659)">Πού είναι και αν είναι δημόσια</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="263.502" y="140.406711" transform="rotate(-0 263.502 140.406711)">Είσοδοι</text>
   </g>
   <g id="text_6">
