   <g id="text_12">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(263.502 260.875775)">Γνωρίσματα / πλέγμα</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(263.502 273.470996)">Πόσοι εκτιμάται ότι εξυπηρετούνται</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="483.354" y="235.376048" transform="rotate(-0 483.354 235.376048)">Γειτονιές</text>
