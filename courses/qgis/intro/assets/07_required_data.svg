   <g id="text_8">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(483.354 166.346438)">Γραμμές</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(483.354 178.959331)">Πού επιτρέπεται να περπατήσουμε</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="43.65" y="235.376048" transform="rotate(-0 43.65 235.376048)">Κατοίκηση</text>
