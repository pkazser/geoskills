    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(263.502 178.941659)">Σε ποιο σημείο φτάνουμε</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="483.354" y="140.846711" transform="rotate(-0 483.354 140.846711)">Δίκτυο πεζών</text>
