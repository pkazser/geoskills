   <g id="text_10">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(43.65 260.875775)">Θέσεις ή ζώνες</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #5c6f7b" transform="translate(43.65 273.488668)">Από πού αρχίζει η διαδρομή</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d3646" x="263.502" y="235.376048" transform="rotate(-0 263.502 235.376048)">Πληθυσμός</text>
