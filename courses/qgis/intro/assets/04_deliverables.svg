<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 625" width="1200" height="625" role="img" aria-label="Τι παραδίδει μια τεκμηριωμένη εργασία;">
<rect width="1200" height="625" fill="#FFFFFF"/>
<text x="54" y="65" font-family="Noto Sans Display, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#173247">Τι παραδίδει μια τεκμηριωμένη εργασία;</text>
<line x1="54" y1="91" x2="1146" y2="91" stroke="#d7e5ed" stroke-width="2"/>
<rect x="57" y="147" width="349" height="159" rx="18" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<circle cx="96" cy="189" r="23" fill="#067982" stroke="#FFFFFF" stroke-width="3"/>
<text x="96" y="197" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="77" y="242" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#173247" text-anchor="start">Χάρτης</text>
<text x="77" y="275" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b6475" text-anchor="start">Θέσεις, κλίμακα, υπόμνημα</text>
<rect x="435" y="147" width="349" height="159" rx="18" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<circle cx="474" cy="189" r="23" fill="#067982" stroke="#FFFFFF" stroke-width="3"/>
<text x="474" y="197" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="455" y="242" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#173247" text-anchor="start">Πίνακας</text>
<text x="455" y="275" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b6475" text-anchor="start">Κωδικοί, αποστάσεις, επιλογή</text>
<rect x="813" y="147" width="349" height="159" rx="18" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<circle cx="852" cy="189" r="23" fill="#067982" stroke="#FFFFFF" stroke-width="3"/>
<text x="852" y="197" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="833" y="242" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#173247" text-anchor="start">Μέθοδος</text>
<text x="833" y="275" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b6475" text-anchor="start">Κανόνας, CRS, βήματα</text>
<rect x="246" y="346" width="349" height="159" rx="18" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<circle cx="285" cy="388" r="23" fill="#067982" stroke="#FFFFFF" stroke-width="3"/>
<text x="285" y="396" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="266" y="441" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#173247" text-anchor="start">Πηγές &amp; έλεγχοι</text>
<text x="266" y="474" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b6475" text-anchor="start">Ημερομηνίες, ποιότητα</text>
<rect x="624" y="346" width="349" height="159" rx="18" fill="#FFFFFF" stroke="#d7e5ed" stroke-width="2"/>
<circle cx="663" cy="388" r="23" fill="#067982" stroke="#FFFFFF" stroke-width="3"/>
<text x="663" y="396" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="644" y="441" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#173247" text-anchor="start">Περιορισμοί</text>
<text x="644" y="474" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b6475" text-anchor="start">Τι δεν αποδεικνύεται</text>
<text x="54" y="599" font-family="Noto Sans Display,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b6475" text-anchor="start">Ο χάρτης είναι μόνο ένα μέρος της τεχνικής παράδοσης.</text>
</svg>