<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-label="Ευθεία εγγύτητα και πεζή διαδρομή: δεν είναι το ίδιο"><rect width="1200" height="670" fill="#F5F9FB"/><style>text{font-family:"Noto Sans Display","DejaVu Sans",Arial,sans-serif;} .heading{font-size:32px;font-weight:700;fill:#123044;} .sub{font-size:20px;fill:#536F80;} .label{font-size:22px;font-weight:700;fill:#123044;} .body{font-size:17px;fill:#355469;} .small{font-size:15px;fill:#526878;}</style><text x="55" y="63" class="heading">Ίδια σημεία, διαφορετικό ερώτημα</text><text x="55" y="104" class="sub">Η πρόσβαση εξαρτάται από τη διαδρομή και τις εισόδους, όχι μόνο από την ευθεία.</text><rect x="55" y="140" width="535" height="455" rx="20" fill="#FFFFFF" stroke="#CBDAE2" stroke-width="2"/><text x="79" y="184" class="label" font-size="22">A. Ευθεία απόσταση</text><rect x="82" y="220" width="480" height="310" rx="12" fill="#F6F4EB"/><line x1="86" y1="310" x2="558" y2="310" stroke="#CAD0CC" stroke-width="8" stroke-linecap="round"/><line x1="86" y1="415" x2="558" y2="415" stroke="#CAD0CC" stroke-width="8" stroke-linecap="round"/><line x1="86" y1="490" x2="558" y2="490" stroke="#CAD0CC" stroke-width="8" stroke-linecap="round"/><line x1="156" y1="224" x2="156" y2="526" stroke="#CCD3D3" stroke-width="8" stroke-linecap="round"/><line x1="272" y1="224" x2="272" y2="526" stroke="#CCD3D3" stroke-width="8" stroke-linecap="round"/><line x1="460" y1="224" x2="460" y2="526" stroke="#CCD3D3" stroke-width="8" stroke-linecap="round"/><rect x="324" y="222" width="42" height="307" rx="6" fill="#79B9D8"/><rect x="314" y="300" width="61" height="20" rx="3" fill="#A69D85"/><line x1="314" y1="300" x2="375" y2="300" stroke="#746F61" stroke-width="2" stroke-linecap="round"/><rect x="430" y="395" width="114" height="92" rx="14" fill="#A7D7AA" stroke="#64A771" stroke-width="2"/><text x="487" y="444" class="small" font-size="15" fill="#123044" text-anchor="middle">ΠΑΡΚΟ</text><circle cx="439" cy="418" r="7" fill="#D59B29" stroke="#fff" stroke-width="3"/><rect x="133" y="412" width="37" height="35" rx="3" fill="#C97632"/><path d="M127 413 l24 -22 l25 22" fill="none" stroke="#123044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="430" r="6" fill="#FFFFFF"/><text x="115" y="476" class="small" font-size="16">Κατοικία</text><text x="446" y="514" class="small" font-size="15">Είσοδος</text><line x1="164" y1="426" x2="439" y2="418" stroke="#D94E54" stroke-width="5" stroke-linecap="round" stroke-dasharray="10,9"/><text x="82" y="563" class="body" font-size="17">Η ευθεία αγνοεί το εμπόδιο.</text><rect x="620" y="140" width="535" height="455" rx="20" fill="#FFFFFF" stroke="#CBDAE2" stroke-width="2"/><text x="644" y="184" class="label" font-size="22">Β. Διαθέσιμη πεζή διαδρομή</text><rect x="647" y="220" width="480" height="310" rx="12" fill="#F6F4EB"/><line x1="651" y1="310" x2="1123" y2="310" stroke="#CAD0CC" stroke-width="8" stroke-linecap="round"/><line x1="651" y1="415" x2="1123" y2="415" stroke="#CAD0CC" stroke-width="8" stroke-linecap="round"/><line x1="651" y1="490" x2="1123" y2="490" stroke="#CAD0CC" stroke-width="8" stroke-linecap="round"/><line x1="721" y1="224" x2="721" y2="526" stroke="#CCD3D3" stroke-width="8" stroke-linecap="round"/><line x1="837" y1="224" x2="837" y2="526" stroke="#CCD3D3" stroke-width="8" stroke-linecap="round"/><line x1="1025" y1="224" x2="1025" y2="526" stroke="#CCD3D3" stroke-width="8" stroke-linecap="round"/><rect x="889" y="222" width="42" height="307" rx="6" fill="#79B9D8"/><rect x="879" y="300" width="61" height="20" rx="3" fill="#A69D85"/><line x1="879" y1="300" x2="940" y2="300" stroke="#746F61" stroke-width="2" stroke-linecap="round"/><rect x="995" y="395" width="114" height="92" rx="14" fill="#A7D7AA" stroke="#64A771" stroke-width="2"/><text x="1052" y="444" class="small" font-size="15" fill="#123044" text-anchor="middle">ΠΑΡΚΟ</text><circle cx="1004" cy="418" r="7" fill="#D59B29" stroke="#fff" stroke-width="3"/><rect x="698" y="412" width="37" height="35" rx="3" fill="#C97632"/><path d="M692 413 l24 -22 l25 22" fill="none" stroke="#123044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="717" cy="430" r="6" fill="#FFFFFF"/><text x="680" y="476" class="small" font-size="16">Κατοικία</text><text x="1011" y="514" class="small" font-size="15">Είσοδος</text><path d="M735 426 L837 426 L837 310 L909 310 L1025 310 L1025 418 L1004 418" fill="none" stroke="#3A8E6D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="647" y="563" class="body" font-size="16">Χρειάζονται δίκτυο, γέφυρα και είσοδος.</text><text x="58" y="634" class="small">Υποθετικό διάγραμμα: καμία απόσταση ή χρονική διάρκεια δεν έχει υπολογιστεί.</text></svg>