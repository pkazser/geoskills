<text x="98" y="227" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">Υποθετικό σύνολο: «Σχολικές μονάδες Δήμου Δ»</text>
<rect x="77" y="254" width="1047" height="42" rx="7" fill="#e7f0f6" stroke="none" stroke-width="2"/>
<text x="96" y="279" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#087f86">Φορέας και μέθοδος</text>
<text x="440" y="279" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#13344a">Υπηρεσία Δ / μη επιβεβαιωμένη καταγραφή</text>
<text x="96" y="327" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#087f86">Παρατήρηση θέσεων</text>
<text x="440" y="327" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#13344a">2022 — απαιτείται επικαιροποίηση</text>
<rect x="77" y="350" width="1047" height="42" rx="7" fill="#e7f0f6" stroke="none" stroke-width="2"/>
<text x="96" y="375" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#087f86">Ενημέρωση αρχείου</text>
<text x="440" y="375" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#13344a">Οκτώβριος 2026 — μόνο πεδία</text>
<text x="96" y="423" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#087f86">Κάλυψη και ορισμός</text>
<text x="440" y="423" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#13344a">Δήμος Δ · δημόσιες σχολικές μονάδες</text>
