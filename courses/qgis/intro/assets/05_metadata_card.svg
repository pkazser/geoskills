<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Δελτίο μεταδεδομένων — τι χρειάζεται να ξέρω;">
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1200" height="14" rx="0" fill="#087f86" stroke="none" stroke-width="2"/>
<text x="48" y="78" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#13344a">Δελτίο μεταδεδομένων — τι χρειάζεται να ξέρω;</text>
<text x="48" y="116" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#456174">Υποθετικό σχολικό σύνολο: η ημερομηνία του αρχείου δεν είναι χρόνος μέτρησης</text>
<rect x="48" y="166" width="1104" height="424" rx="18" fill="#f4f8fb" stroke="#d3e1e9" stroke-width="2"/>
