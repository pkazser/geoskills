<text x="96" y="471" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#087f86">CRS / μονάδες</text>
<text x="440" y="471" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#13344a">π.χ. EPSG:2100 · μέτρα</text>
<text x="96" y="519" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#087f86">Όροι / περιορισμοί</text>
<text x="440" y="519" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#13344a">Έλεγχος άδειας και θέσης κάθε σημείου</text>
