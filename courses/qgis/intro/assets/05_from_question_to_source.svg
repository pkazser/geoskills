<text x="48" y="116" text-anchor="start" font-family="Noto Sans,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#456174">Η διαθεσιμότητα δεν ισοδυναμεί με καταλληλότητα</text>
