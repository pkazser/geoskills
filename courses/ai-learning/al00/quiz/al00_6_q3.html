<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL00.6 — Quiz 3</title><style>body{font:17px/1.55 system-ui,Arial,sans-serif;max-width:800px;margin:30px auto;padding:0 16px;color:#1b2733}fieldset{border:1px solid #c6d5df;border-radius:12px;margin:20px 0;padding:18px}legend{font-weight:700}label{display:block;padding:7px 0}button,a.back{display:inline-block;border:0;border-radius:8px;background:#204e70;color:white;padding:10px 17px;margin:6px 7px 6px 0;cursor:pointer;text-decoration:none;font:inherit}button.secondary{background:#e8edf2;color:#243d52}.feedback{padding:10px;border-radius:8px;background:#eef4f8}.correct{border-left:5px solid #23724e}.wrong{border-left:5px solid #b46b2e}#score{font-weight:700}a:focus,button:focus,input:focus{outline:3px solid #ffbb55}</style></head><body><main><h1>AL00.6 — Quiz 3</h1><p>Διάλεξε μία απάντηση ανά ερώτηση. Μετά την υποβολή θα εμφανιστούν το αποτέλεσμα και οι εξηγήσεις.</p><form id="quiz"></form><button id="grade" type="button">Έλεγχος απαντήσεων</button><button id="reset" type="button" class="secondary">Νέα προσπάθεια</button><p id="score" aria-live="polite"></p><a id="return-to-course" class="back" href="#">Επιστροφή στο μάθημα</a></main><script>
const questions=[{"q": "Τι ελέγχουμε πρώτο σε μια μεγάλη απάντηση;", "a": ["Τους συγκεκριμένους ισχυρισμούς", "Το μήκος", "Τη γραμματοσειρά"], "correct": 0, "why": "Διασπάμε σε ελέγξιμες προτάσεις."}, {"q": "Μέσος όρος των 60,70,75,85;", "a": ["80", "72,5", "75"], "correct": 1, "why": "290/4 = 72,5."}, {"q": "Η αύξηση είναι σταθερά +10;", "a": ["Ναι", "Όχι", "Δεν υπάρχουν βαθμοί"], "correct": 1, "why": "Οι διαφορές είναι +10, +5, +10."}, {"q": "Τέσσερις τιμές αποδεικνύουν αιτιότητα;", "a": ["Ναι", "Όχι", "Μόνο αν το γράψει chatbot"], "correct": 1, "why": "Χρειάζεται κατάλληλος σχεδιασμός."}, {"q": "Για βιβλιογραφική πηγή ελέγχουμε:", "a": ["Μόνο τον τίτλο", "Ύπαρξη και στήριξη του ισχυρισμού", "Μόνο έτος"], "correct": 1, "why": "Διπλός έλεγχος."}, {"q": "Πώς χειριζόμαστε μη επαληθευμένο ισχυρισμό;", "a": ["Τον χρησιμοποιούμε ως γεγονός", "Τον χαρακτηρίζουμε μη ελεγμένο ή τον αφαιρούμε", "Αλλάζουμε ύφος"], "correct": 1, "why": "Δεν παρουσιάζουμε εικασία ως γεγονός."}, {"q": "Πότε αυξάνουμε τον έλεγχο;", "a": ["Όταν επηρεάζεται υγεία/ασφάλεια/δικαιώματα", "Μόνο σε μεγάλα κείμενα", "Ποτέ"], "correct": 0, "why": "Ο έλεγχος είναι ανάλογος του κινδύνου."}, {"q": "Η επιβεβαίωση από το ίδιο chatbot αρκεί;", "a": ["Ναι", "Όχι, χρειάζεται ανεξάρτητο τεκμήριο", "Αρκεί αν είναι βέβαιο"], "correct": 1, "why": "Η αυτοκριτική μπορεί να βοηθά, όχι να υποκαθιστά τον έλεγχο."}];const form=document.getElementById('quiz');const score=document.getElementById('score');
function draw(){form.innerHTML='';score.textContent='';questions.forEach((q,i)=>{const f=document.createElement('fieldset');const l=document.createElement('legend');l.textContent=`${i+1}. ${q.q}`;f.appendChild(l);q.a.forEach((opt,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name=`q${i}`;input.value=j;label.append(input,document.createTextNode(' '+opt));f.appendChild(label)});const fb=document.createElement('div');fb.className='feedback';fb.hidden=true;fb.id=`fb${i}`;fb.setAttribute('aria-live','polite');f.appendChild(fb);form.appendChild(f)})}
document.getElementById('grade').addEventListener('click',()=>{let correct=0;let answered=0;questions.forEach((q,i)=>{const f=document.getElementById(`fb${i}`);const pick=form.querySelector(`input[name="q${i}"]:checked`);f.hidden=false;const ok=!!pick&&Number(pick.value)===q.correct;if(pick)answered++;if(ok)correct++;f.className='feedback '+(ok?'correct':'wrong');f.textContent=(ok?'Σωστά. ':'Χρειάζεται επανεξέταση. ')+q.why;});score.textContent=`Αποτέλεσμα: ${correct}/${questions.length}. Απαντήθηκαν: ${answered}/${questions.length}.`;});
document.getElementById('reset').addEventListener('click',()=>{draw();window.scrollTo({top:0,behavior:'smooth'})});
const link=document.getElementById('return-to-course'),path=/^\/(?:geoskills\/)?courses\/ai-learning\/al00\/ai-errors\/?$/,safe=v=>{try{const u=new URL(v,location.href);if(u.protocol===location.protocol&&u.hostname===location.hostname&&!u.username&&!u.password&&path.test(u.pathname))return u.href}catch(_){}return null},fallback=location.pathname.startsWith('/geoskills/')?'/geoskills/courses/ai-learning/al00/ai-errors/':'/courses/ai-learning/al00/ai-errors/',ret=safe(new URLSearchParams(location.search).get('return'))||safe(document.referrer);link.href=ret||new URL(fallback,location.origin).href;link.addEventListener('click',e=>{if(!ret&&history.length>1){e.preventDefault();history.back()}});
draw();
</script></body></html>
