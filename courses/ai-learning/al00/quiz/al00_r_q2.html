<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL00-R — Quiz 2</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:1.5rem auto;padding:0 1rem;line-height:1.55;color:#172e3b}fieldset{margin:1rem 0;border:1px solid #b5cbd2;border-radius:9px;padding:1rem}legend{font-weight:650}label{display:block;padding:.3rem;cursor:pointer}button,.back{display:inline-block;background:#165a68;color:white;border:0;border-radius:7px;padding:.7rem 1rem;margin:.3rem;cursor:pointer;text-decoration:none}#result{font-weight:650;margin:1rem 0}.feedback{margin-top:.5rem;color:#315464}.note{background:#edf4f6;padding:1rem;border-radius:8px}</style></head><body><h1>AL00-R — Quiz 2</h1><p class="note">Συμπληρωματική αυτοαξιολόγηση. Δεν υποκαθιστά τις τέσσερις ανεξάρτητες αποστολές. Τα παραδείγματα είναι συνθετικά.</p><main id="items"></main><button id="grade">Έλεγχος απαντήσεων</button><button id="retry" type="button">Νέα προσπάθεια</button><p id="result" role="status" aria-live="polite"></p><a class="back" id="back" href="https://pkazser.github.io/geoskills/courses/ai-learning/al00/review/">Επιστροφή στο GeoSkills</a><script>const questions=[{"q": "Ποιο αίτημα υποστηρίζει την προσωπική μάθηση;", "options": ["Δώσε μόνο μία υπόδειξη και περίμενε την προσπάθειά μου.", "Δώσε έτοιμη λύση χωρίς εξήγηση.", "Κάνε την άσκηση αντί για μένα."], "correct": 0, "explain": "Η διαδοχική υπόδειξη αφήνει χώρο για ανεξάρτητη σκέψη."}, {"q": "Τι ποσοστό είναι 18 από 45;", "options": ["18%", "40%", "45%"], "correct": 1, "explain": "18/45 = 0,4 = 40%."}, {"q": "Πώς αντιμετωπίζουμε ταυτοποιήσιμες συνεντεύξεις τρίτων;", "options": ["Τις ανεβάζουμε αυτούσιες χωρίς άδεια.", "Τις χρησιμοποιούμε ελεύθερα αν αφαιρέσουμε μόνο τα ονόματα.", "Δεν τις εισάγουμε σε εξωτερικό εργαλείο χωρίς κατάλληλη άδεια και προστασία· αναζητούμε ασφαλή εναλλακτική."], "correct": 2, "explain": "Η ταυτότητα μπορεί να αποκαλύπτεται ακόμη και χωρίς ονόματα."}, {"q": "Τι αποδεικνύει ένα σκορ 8/8 στον μικρό επανέλεγχο;", "options": ["Πλήρη επαγγελματική επάρκεια.", "Επαρκείς απαντήσεις στα συγκεκριμένα σενάρια, όχι γενική πιστοποίηση.", "Ότι δεν χρειάζεται ποτέ άλλος έλεγχος."], "correct": 1, "explain": "Μια σύντομη δοκιμή έχει περιορισμένη δυνατότητα γενίκευσης."}];
const root=document.getElementById('items');
function render(){root.replaceChildren();questions.forEach((it,i)=>{const fs=document.createElement('fieldset');const lg=document.createElement('legend');lg.textContent=(i+1)+'. '+it.q;fs.append(lg);it.options.forEach((s,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.append(input,document.createTextNode(' '+s));fs.append(label)});const fb=document.createElement('p');fb.id='fb'+i;fb.className='feedback';fs.append(fb);root.append(fs)});document.getElementById('result').textContent=''}
document.getElementById('grade').addEventListener('click',()=>{let score=0;questions.forEach((q,i)=>{const choice=document.querySelector('input[name="q'+i+'"]:checked');const ok=choice&&Number(choice.value)===q.correct;if(ok)score++;document.getElementById('fb'+i).textContent=(!choice?'Δεν επιλέχθηκε απάντηση. ':ok?'Σωστή επιλογή. ':'Χρειάζεται επανέλεγχος. ')+q.explain});document.getElementById('result').textContent='Αποτέλεσμα: '+score+'/'+questions.length+'. Διάβασε την ανατροφοδότηση και εξήγησε τη λογική σου.'});document.getElementById('retry').addEventListener('click',render);
// The actual AL00-R slug MUST be verified by Codex. Never invent a lesson return URL.
const publicReturn='https://pkazser.github.io/geoskills/courses/ai-learning/al00/review/';const localReturn=()=>location.protocol+'//'+location.hostname+':3000/courses/ai-learning/al00/review/';const allowed=(value)=>{try{const u=new URL(value);const localPath=u.pathname==='/courses/ai-learning/al00/review/';const publicPath=u.pathname==='/geoskills/courses/ai-learning/al00/review/';const localHost=(u.hostname==='localhost'||u.hostname==='127.0.0.1')&&(u.port==='3000'||u.port==='');const publicHost=u.hostname==='pkazser.github.io';return (localHost&&localPath)||(publicHost&&publicPath)?u.href:null}catch(e){return null}};const fallback=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?localReturn():publicReturn;const params=new URLSearchParams(location.search);const candidate=allowed(params.get('return'))||allowed(document.referrer);document.getElementById('back').href=candidate||fallback;
render();</script></body></html>
