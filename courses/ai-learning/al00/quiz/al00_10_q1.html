<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL00.10 — Αυτοαξιολόγηση 1</title><style>body{font-family:system-ui,sans-serif;line-height:1.5;max-width:850px;margin:0 auto;padding:1.2rem;color:#1b3449}fieldset{margin:1rem 0;padding:1rem;border:1px solid #abbfd1;border-radius:.7rem}legend{font-weight:700}label{display:block;padding:.4rem 0}button,a{display:inline-block;padding:.7rem .9rem;margin:.3rem;border:1px solid #285a80;border-radius:.5rem;background:#eff6fb;color:#173956;cursor:pointer}.fb{margin-top:.5rem}#score{font-weight:700}</style></head><body><h1>AL00.10 — Αυτοαξιολόγηση 1</h1><p>Απάντησε και έπειτα έλεγξε τις εξηγήσεις. Δοκίμασε ξανά όποτε θέλεις.</p><form id="qform"></form><button type="button" id="grade">Έλεγχος απαντήσεων</button><button type="button" id="retry">Νέα προσπάθεια</button><p id="score" aria-live="polite"></p><a id="return-to-course" href="https://pkazser.github.io/geoskills/courses/ai-learning/al00/self-assessment/">Επιστροφή στην AL00.10</a><script>const questions=[{"q": "Τι τεκμηριώνει καλύτερα μια νέα δεξιότητα;", "o": ["Μια καλαίσθητη απάντηση ΤΝ", "Μια νέα ανεξάρτητη εφαρμογή", "Μεγάλος αριθμός αιτημάτων"], "a": 1, "why": "Η νέα ανεξάρτητη εφαρμογή δείχνει τι μπορεί να κάνει ο φοιτητής."}, {"q": "Ποιο είναι παράδειγμα τεκμηρίου μάθησης;", "o": ["Μια προσωπική αιτιολόγηση διόρθωσης", "Η απλή ύπαρξη βιβλιογραφικού συνδέσμου", "Η διάρκεια μιας συνομιλίας"], "a": 0, "why": "Το τεκμήριο δείχνει συγκεκριμένη ελέγξιμη ανθρώπινη ενέργεια."}, {"q": "Τι διακρίνει τη διαδικασία από το προϊόν;", "o": ["Η διαδικασία αφορά τις αποφάσεις και τους ελέγχους", "Η διαδικασία είναι πάντα η τελική περίληψη", "Η διαδικασία σημαίνει χρήση πολλών εργαλείων"], "a": 0, "why": "Η διαδικασία περιλαμβάνει επιλογές, προσπάθειες, ελέγχους και διορθώσεις."}, {"q": "Ποια αποτίμηση είναι πιο συγκεκριμένη;", "o": ["Έμαθα τα πάντα", "Μου άρεσε η ΤΝ", "Μπορώ να επαληθεύω αν μια πηγή στηρίζει τον ισχυρισμό"], "a": 2, "why": "Η τρίτη επιλογή περιγράφει παρατηρήσιμη δεξιότητα."}];const dest=document.getElementById('return-to-course');const isLocal=['localhost','127.0.0.1','::1','[::1]'].includes(location.hostname);if(isLocal){dest.href=new URL('/courses/ai-learning/al00/self-assessment/',location.protocol+'//'+location.hostname+':3000').href;}function render(){const form=document.getElementById('qform');form.replaceChildren();questions.forEach((q,i)=>{const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=(i+1)+'. '+q.q;f.append(l);q.o.forEach((answer,j)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(j);label.append(input,document.createTextNode(' '+answer));f.append(label)});const feedback=document.createElement('div');feedback.className='fb';feedback.id='fb'+i;feedback.setAttribute('aria-live','polite');f.append(feedback);form.append(f)});document.getElementById('score').textContent=''}document.getElementById('grade').onclick=()=>{let c=0,a=0;questions.forEach((q,i)=>{const sel=document.querySelector('input[name="q'+i+'"]:checked');const ok=sel&&Number(sel.value)===q.a;if(sel)a++;if(ok)c++;document.getElementById('fb'+i).textContent=(sel?(ok?'Σωστά. ':'Χρειάζεται επανεξέταση. '):'Δεν δόθηκε απάντηση. ')+q.why});document.getElementById('score').textContent='Απάντησες σε '+a+' / '+questions.length+'. Σωστές: '+c+'.'};document.getElementById('retry').onclick=render;render();</script></body></html>
