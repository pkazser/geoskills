<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL00-R — Quiz 1</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:1.5rem auto;padding:0 1rem;line-height:1.55;color:#172e3b}fieldset{margin:1rem 0;border:1px solid #b5cbd2;border-radius:9px;padding:1rem}legend{font-weight:650}label{display:block;padding:.3rem;cursor:pointer}button,.back{display:inline-block;background:#165a68;color:white;border:0;border-radius:7px;padding:.7rem 1rem;margin:.3rem;cursor:pointer;text-decoration:none}#result{font-weight:650;margin:1rem 0}.feedback{margin-top:.5rem;color:#315464}.note{background:#edf4f6;padding:1rem;border-radius:8px}</style></head><body><h1>AL00-R — Quiz 1</h1><p class="note">Συμπληρωματική αυτοαξιολόγηση. Δεν υποκαθιστά τις τέσσερις ανεξάρτητες αποστολές. Τα παραδείγματα είναι συνθετικά.</p><main id="items"></main><button id="grade">Έλεγχος απαντήσεων</button><button id="retry" type="button">Νέα προσπάθεια</button><p id="result" role="status" aria-live="polite"></p><a class="back" id="back" href="https://pkazser.github.io/geoskills/courses/ai-learning/al00/review/">Επιστροφή στο GeoSkills</a><script>const questions=[{"q": "Ποιο αίτημα μειώνει περισσότερο τον κίνδυνο επινοημένων στοιχείων;", "options": ["Γράψε κάτι εντυπωσιακό με πολλά ποσοστά.", "Δώσε σύντομο σχέδιο, χωρίς επινοημένα στατιστικά, και σημείωσε τι πρέπει να επαληθευτεί.", "Πρότεινε όποια μελέτη θυμάσαι χωρίς σύνδεσμο."], "correct": 1, "explain": "Το αίτημα απαιτεί να διαχωριστεί το σχέδιο από τα ανεπιβεβαίωτα στοιχεία."}, {"q": "Σε δύο ομάδες έχουμε 36/60 και 42/70 έγκαιρες επιστροφές. Τι ισχύει;", "options": ["Το Β έχει υψηλότερο ποσοστό.", "Και οι δύο ομάδες έχουν 60%.", "Δεν μπορούν να υπολογιστούν ποσοστά."], "correct": 1, "explain": "Οι λόγοι 36/60 και 42/70 ισούνται με 0,60."}, {"q": "Τι μας επιτρέπει μια μη επαληθευμένη βιβλιογραφική αναφορά;", "options": ["Να ισχυριστούμε ότι το εύρημα ισχύει.", "Να θεωρήσουμε βέβαιο ότι είναι ανύπαρκτη.", "Να ζητήσουμε εντοπισμό και ανάγνωση της πηγής πριν τη χρησιμοποιήσουμε."], "correct": 2, "explain": "Μια αναφορά χωρίς έλεγχο δεν αποτελεί τεκμήριο."}, {"q": "Έξι περισσότερα συμβάντα σε μεγαλύτερη ομάδα αποδεικνύουν ανώτερη αποτελεσματικότητα;", "options": ["Ναι, ο μεγαλύτερος αριθμός αρκεί.", "Όχι· χρειάζονται αναλογίες και έλεγχος συγκρισιμότητας.", "Ναι, εφόσον η απάντηση γράφτηκε από ΤΝ."], "correct": 1, "explain": "Η διαφορά στους απόλυτους αριθμούς δεν αρκεί για τέτοιο συμπέρασμα."}];
const root=document.getElementById('items');
function render(){root.replaceChildren();questions.forEach((it,i)=>{const fs=document.createElement('fieldset');const lg=document.createElement('legend');lg.textContent=(i+1)+'. '+it.q;fs.append(lg);it.options.forEach((s,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.append(input,document.createTextNode(' '+s));fs.append(label)});const fb=document.createElement('p');fb.id='fb'+i;fb.className='feedback';fs.append(fb);root.append(fs)});document.getElementById('result').textContent=''}
document.getElementById('grade').addEventListener('click',()=>{let score=0;questions.forEach((q,i)=>{const choice=document.querySelector('input[name="q'+i+'"]:checked');const ok=choice&&Number(choice.value)===q.correct;if(ok)score++;document.getElementById('fb'+i).textContent=(!choice?'Δεν επιλέχθηκε απάντηση. ':ok?'Σωστή επιλογή. ':'Χρειάζεται επανέλεγχος. ')+q.explain});document.getElementById('result').textContent='Αποτέλεσμα: '+score+'/'+questions.length+'. Διάβασε την ανατροφοδότηση και εξήγησε τη λογική σου.'});document.getElementById('retry').addEventListener('click',render);
// The actual AL00-R slug MUST be verified by Codex. Never invent a lesson return URL.
const publicReturn='https://pkazser.github.io/geoskills/courses/ai-learning/al00/review/';const localReturn=()=>location.protocol+'//'+location.hostname+':3000/courses/ai-learning/al00/review/';const allowed=(value)=>{try{const u=new URL(value);const localPath=u.pathname==='/courses/ai-learning/al00/review/';const publicPath=u.pathname==='/geoskills/courses/ai-learning/al00/review/';const localHost=(u.hostname==='localhost'||u.hostname==='127.0.0.1')&&(u.port==='3000'||u.port==='');const publicHost=u.hostname==='pkazser.github.io';return (localHost&&localPath)||(publicHost&&publicPath)?u.href:null}catch(e){return null}};const fallback=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?localReturn():publicReturn;const params=new URLSearchParams(location.search);const candidate=allowed(params.get('return'))||allowed(document.referrer);document.getElementById('back').href=candidate||fallback;
render();</script></body></html>
