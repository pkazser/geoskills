<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL00.9 — Quiz 2: Κριτική χρήση ΤΝ και μάθηση</title><style>body{font-family:system-ui,Arial,sans-serif;line-height:1.55;max-width:860px;margin:auto;padding:1.4rem;color:#1b3146}fieldset{margin:1rem 0;padding:1rem;border:1px solid #b1c4d5;border-radius:.7rem}label{display:block;margin:.6rem 0}button,.back{display:inline-block;padding:.6rem .9rem;margin:.3rem .3rem .3rem 0;border:1px solid #245d8b;border-radius:.5rem;background:#eaf3fa;color:#12385b;cursor:pointer}.feedback{margin-top:.7rem}button:focus,a:focus,input:focus{outline:3px solid #d28e2b;outline-offset:2px}</style></head><body><h1>AL00.9 — Quiz 2: Κριτική χρήση ΤΝ και μάθηση</h1><p>Επίλεξε μία απάντηση ανά ερώτηση και μετά έλεγξε το αποτέλεσμα. Πρόκειται για αυτοαξιολόγηση, όχι για την ανεξάρτητη τελική αποστολή.</p><form id="form"></form><button type="button" id="grade">Έλεγχος απαντήσεων</button><button type="button" id="reset">Νέα προσπάθεια</button><p><output id="score" aria-live="polite"></output></p><p><a id="return-to-course" class="back" href="https://pkazser.github.io/geoskills/courses/ai-learning/al00/guided-learning-activity/">Επιστροφή στην AL00.9</a></p><script>const questions=[{"q": "Τι είναι κατάλληλη χρήση ΤΝ σε αυτή την αποστολή;", "options": ["Να επινοήσει αποτελέσματα", "Να προτείνει ερωτήσεις με τις οποίες θα ελέγξω δικές μου πηγές", "Να υπογράψει ως συγγραφέας μου"], "answer": 1, "why": "Η ΤΝ μπορεί να βοηθά στην οργάνωση του ελέγχου χωρίς να αντικαθιστά την πηγή."}, {"q": "Η ΤΝ προτείνει ποσοστό που δεν υπάρχει στις πηγές. Τι κάνεις;", "options": ["Το κρατώ επειδή ακούγεται πιθανό", "Το στρογγυλοποιώ", "Το απορρίπτω ή αναζητώ πραγματική τεκμηρίωση"], "answer": 2, "why": "Δεν παρουσιάζουμε μη ελεγμένο αριθμό ως εμπειρικό εύρημα."}, {"q": "Ποιο τεκμήριο δείχνει καλύτερα προσωπική κατανόηση;", "options": ["Νέα ανάλογη άσκηση χωρίς ΤΝ με αιτιολόγηση", "Άψογη περίληψη που έγραψε εργαλείο", "Μεγάλο ιστορικό συνομιλίας"], "answer": 0, "why": "Η ανεξάρτητη εφαρμογή εξετάζει τι μπορεί να κάνει ο φοιτητής χωρίς τη βοήθεια."}, {"q": "Τι κάνεις αν η νέα εφαρμογή δεν πετύχει;", "options": ["Δηλώνω ότι έμαθα πλήρως", "Εντοπίζω την ακριβή δυσκολία και επαναλαμβάνω μικρότερη δοκιμή", "Αντιγράφω ξανά το τελικό κείμενο"], "answer": 1, "why": "Μια αποτυχία στην εφαρμογή εντοπίζει την ανάγκη για νέα στοχευμένη εξάσκηση."}, {"q": "Πώς χειρίζεσαι προσωπικά δεδομένα τρίτων;", "options": ["Τα ανεβάζω για ευκολία", "Ζητώ στην ΤΝ να τα κρύψει αφού τα ανεβάσω", "Δεν τα μεταφορτώνω χωρίς νόμιμη βάση και άδεια· χρησιμοποιώ κατάλληλο συνθετικό παράδειγμα"], "answer": 2, "why": "Προστατεύουμε δεδομένα τρίτων πριν από τη χρήση εργαλείου."}];const form=document.getElementById('form');const back=document.getElementById('return-to-course');const PUBLIC='https://pkazser.github.io/geoskills/courses/ai-learning/al00/guided-learning-activity/';const LOCAL='http://localhost:3000/courses/ai-learning/al00/guided-learning-activity/';const isLocal=['localhost','127.0.0.1'].includes(location.hostname);back.href=isLocal?LOCAL:PUBLIC;function render(){form.replaceChildren();questions.forEach((q,i)=>{const fs=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q.q;fs.append(legend);q.options.forEach((op,j)=>{const l=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;l.append(input,document.createTextNode(' '+op));fs.append(l)});const fb=document.createElement('div');fb.id='f'+i;fb.className='feedback';fb.setAttribute('aria-live','polite');fs.append(fb);form.append(fs)});document.getElementById('score').textContent=''}document.getElementById('grade').addEventListener('click',()=>{let correct=0,answered=0;questions.forEach((q,i)=>{const el=form.querySelector('input[name="q'+i+'"]:checked');if(el){answered++;if(+el.value===q.answer)correct++;}document.getElementById('f'+i).textContent=(el?(+el.value===q.answer?'Σωστά. ':'Χρειάζεται επανεξέταση. '):'Δεν δόθηκε απάντηση. ')+q.why});document.getElementById('score').textContent='Απαντήθηκαν '+answered+'/'+questions.length+' · Σωστές '+correct+'/'+questions.length});document.getElementById('reset').addEventListener('click',render);render();</script></body></html>
