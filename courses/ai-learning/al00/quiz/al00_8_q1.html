<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Μαθησιακή υποστήριξη ή υποκατάσταση;</title><style>body{font:16px/1.55 system-ui,sans-serif;margin:0 auto;max-width:780px;padding:24px;color:#172b40;background:#fafbfe}fieldset{border:1px solid #b6c7d4;border-radius:10px;margin:18px 0;padding:16px}legend{font-weight:700}label{display:block;padding:7px 0;cursor:pointer}.feedback{margin-top:9px;font-size:.95rem}button,a{display:inline-block;padding:10px 16px;margin:8px 7px 0 0;border-radius:8px}button{cursor:pointer;border:1px solid #244e72;background:#244e72;color:white}a{color:#244e72}#result{font-weight:bold;margin-top:18px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c26913;outline-offset:3px}</style></head><body><main><h1>Μαθησιακή υποστήριξη ή υποκατάσταση;</h1><p>Επίλεξε μία απάντηση ανά ερώτηση, έλεγξε την προσπάθειά σου και διάβασε την αιτιολόγηση. Μπορείς να δοκιμάσεις ξανά.</p><form id="quiz"></form><button id="grade" type="button">Έλεγχος απαντήσεων</button><button id="reset" type="button">Νέα προσπάθεια</button><div id="result" role="status" aria-live="polite"></div><p><a id="back" href="https://pkazser.github.io/geoskills/courses/ai-learning/al00/ai-for-learning/">Επιστροφή στην AL00.8</a></p></main><script>const questions=[{"q": "Ποια ενέργεια παρέχει το σαφέστερο τεκμήριο προσωπικής κατανόησης;", "options": ["Να αντιγράψω μια περίληψη", "Να εξηγήσω με δικά μου λόγια χωρίς βοήθεια", "Να ζητήσω μεγαλύτερη απάντηση"], "correct": 1, "why": "Η προσωπική εξήγηση είναι παρατηρήσιμη προσπάθεια του φοιτητή."}, {"q": "Η ΤΝ γράφει ένα άψογο κείμενο για την εργασία μου. Τι γνωρίζουμε;", "options": ["Ότι έμαθα το θέμα πλήρως", "Ότι το κείμενο είναι υποχρεωτικά ακριβές", "Ότι υπάρχει ένα προϊόν, όχι τεκμήριο προσωπικής ικανότητας"], "correct": 2, "why": "Το παραδοτέο δεν ταυτίζεται με την ανθρώπινη μάθηση."}, {"q": "Τι είναι καταλληλότερο πριν ζητήσω επεξήγηση;", "options": ["Να καταγράψω τι γνωρίζω και πού δυσκολεύομαι", "Να διαγράψω όσα προσπάθησα", "Να ζητήσω πάντα έτοιμη λύση"], "correct": 0, "why": "Μια αρχική αυτοδοκιμή αναδεικνύει τη συγκεκριμένη δυσκολία."}, {"q": "Ποια επιλογή ταιριάζει περισσότερο σε νέο μαθησιακό στόχο;", "options": ["Πάντα το ίδιο prompt", "Επιλογή βοήθειας με βάση την απαιτούμενη δεξιότητα", "Μόνο περίληψη, ανεξάρτητα από το πρόβλημα"], "correct": 1, "why": "Ο τύπος βοήθειας ακολουθεί τον μαθησιακό στόχο."}];const form=document.getElementById('quiz');const result=document.getElementById('result');function render(){form.innerHTML='';questions.forEach((x,i)=>{const fs=document.createElement('fieldset');const lg=document.createElement('legend');lg.textContent=(i+1)+'. '+x.q;fs.append(lg);x.options.forEach((s,j)=>{const label=document.createElement('label');const inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=j;label.append(inp,document.createTextNode(' '+s));fs.append(label)});const note=document.createElement('div');note.className='feedback';note.id='f'+i;fs.append(note);form.append(fs)})}document.getElementById('grade').addEventListener('click',()=>{if(questions.some((_,i)=>!form.querySelector('input[name="q'+i+'"]:checked'))){result.textContent='Απάντησε πρώτα σε όλες τις ερωτήσεις.';return}let score=0;questions.forEach((x,i)=>{const selected=Number(form.querySelector('input[name="q'+i+'"]:checked').value);const ok=selected===x.correct;if(ok)score++;document.getElementById('f'+i).textContent=(ok?'Σωστά. ':'Χρειάζεται επανεξέταση. ')+x.why});result.textContent='Αποτέλεσμα: '+score+'/'+questions.length});document.getElementById('reset').addEventListener('click',()=>{form.reset();result.textContent='';questions.forEach((_,i)=>document.getElementById('f'+i).textContent='')});const back=document.getElementById('back'),isPublic=location.hostname==='pkazser.github.io',isLocal=location.hostname==='localhost'||location.hostname==='127.0.0.1',courseOrigin=isPublic?'https://pkazser.github.io/geoskills':(isLocal&&location.port==='3100'?location.protocol+'//'+location.hostname+':3000':location.origin);back.href=new URL('/courses/ai-learning/al00/ai-for-learning/',courseOrigin).href;render();</script></body></html>
