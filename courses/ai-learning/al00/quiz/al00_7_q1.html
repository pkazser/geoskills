<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL00.7 — Quiz 1: Ερώτημα και αναζήτηση</title><style>body{font-family:system-ui,sans-serif;line-height:1.55;max-width:850px;margin:auto;padding:1.25rem;color:#182b41}fieldset{margin:1.2rem 0;padding:1rem;border:1px solid #b8c8d9;border-radius:.6rem}legend{font-weight:700}label{display:block;margin:.6rem 0}button,a.back{display:inline-block;margin:.4rem .3rem .4rem 0;padding:.65rem 1rem;border:1px solid #2b5686;border-radius:.5rem;background:#e9f2fb;color:#123759;cursor:pointer}.feedback{margin-top:.7rem}output{font-weight:700}</style></head><body><h1>AL00.7 — Quiz 1: Ερώτημα και αναζήτηση</h1><p>Επίλεξε μία απάντηση ανά ερώτηση. Μετά την υποβολή θα δεις αποτέλεσμα και εξηγήσεις.</p><form id="form"></form><button id="grade" type="button">Έλεγχος απαντήσεων</button><button id="reset" type="button">Νέα προσπάθεια</button><p><output id="score" aria-live="polite"></output></p><a class="back" id="return-to-course" href="#">Επιστροφή στην AL00.7</a><script>const questions=[{"q": "Τι αποδεικνύει από μόνο του ένας σύνδεσμος σε απάντηση ΤΝ;", "options": ["Ότι ο ισχυρισμός είναι σωστός", "Μόνο ότι δίνεται μία διεύθυνση προς έλεγχο", "Ότι το άρθρο είναι πρωτογενές"], "answer": 1, "why": "Ο σύνδεσμος είναι αφετηρία επαλήθευσης, όχι απόδειξη."}, {"q": "Ποιο είναι σαφέστερο ερευνητικό ερώτημα;", "options": ["ΤΝ γενικά", "Τεχνολογία και κοινωνία", "Πώς περιγράφουν οι πρωτοετείς τη χρήση ΤΝ στη μελέτη;"], "answer": 2, "why": "Το τρίτο ορίζει πληθυσμό και αντικείμενο."}, {"q": "Ποια πηγή ενδείκνυται αρχικά για ισχύουσα διοικητική προθεσμία;", "options": ["Η αρμόδια επίσημη αρχή", "Τυχαίο παλιό άρθρο", "Αυτόματη γενική σύνοψη χωρίς σύνδεσμο"], "answer": 0, "why": "Αναζητούμε την επίσημη ισχύουσα ανακοίνωση."}, {"q": "Τι σημαίνει όταν μια βάση εμφανίζει μόνο την περίληψη;", "options": ["Είδαμε όλη τη μεθοδολογία", "Μπορούμε να συμπληρώσουμε ό,τι λείπει", "Δεν έχουμε εξετάσει το πλήρες άρθρο"], "answer": 2, "why": "Χρειάζεται σαφής διάκριση περίληψης και πλήρους κειμένου."}];const form=document.getElementById('form');const link=document.getElementById('return-to-course'),path=/^\/(?:geoskills\/)?courses\/ai-learning\/al00\/search-sources\/?$/,safe=v=>{try{const u=new URL(v,location.href);if(u.protocol===location.protocol&&u.hostname===location.hostname&&!u.username&&!u.password&&path.test(u.pathname))return u.href}catch(_){}return null},fallback=location.pathname.startsWith('/geoskills/')?'/geoskills/courses/ai-learning/al00/search-sources/':'/courses/ai-learning/al00/search-sources/',ret=safe(new URLSearchParams(location.search).get('return'))||safe(document.referrer);link.href=ret||new URL(fallback,location.origin).href;function render(){form.replaceChildren();questions.forEach((q,i)=>{let fs=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q.q;fs.append(legend);q.options.forEach((opt,j)=>{const label=document.createElement('label'),inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=j;label.append(inp,document.createTextNode(' '+opt));fs.append(label)});const fb=document.createElement('div');fb.id='feedback'+i;fb.className='feedback';fb.setAttribute('aria-live','polite');fs.append(fb);form.append(fs)});document.getElementById('score').textContent='';}document.getElementById('grade').onclick=()=>{let correct=0;let answered=0;questions.forEach((q,i)=>{const a=form.querySelector('input[name="q'+i+'"]:checked');const div=document.getElementById('feedback'+i);if(a){answered++;if(Number(a.value)===q.answer)correct++;}div.textContent=(a?(Number(a.value)===q.answer?'Σωστά. ':'Χρειάζεται επανεξέταση. '):'Δεν δόθηκε απάντηση. ')+q.why});document.getElementById('score').textContent=answered===questions.length?'Αποτέλεσμα: '+correct+' / '+questions.length:'Απάντησες σε '+answered+' / '+questions.length+'. Σωστές: '+correct+'.'};document.getElementById('reset').onclick=render;render();</script></body></html>
