<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Από το αίτημα στο πλαίσιο</title><style>body{font:17px/1.6 system-ui,Arial,sans-serif;max-width:850px;margin:auto;padding:22px;background:#f9fbfd;color:#15283b}fieldset{border:1px solid #b8c8d5;border-radius:12px;padding:18px;margin:16px 0;background:white}legend{font-weight:700}label{display:block;margin:8px 0;padding:6px}button,a.back{display:inline-block;background:#164c73;color:white;padding:11px 16px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;margin:5px 6px 5px 0}button.secondary{background:#d8e4ec;color:#163b56}.feedback{margin-top:12px;padding:10px;border-left:4px solid #447a78;background:#eaf5f2}.summary{font-weight:bold;font-size:20px}a:focus,button:focus,input:focus{outline:3px solid #b36c00;outline-offset:2px}</style></head><body><h1>Από το αίτημα στο πλαίσιο</h1><p>Επίλεξε μία απάντηση ανά ερώτηση. Πάτησε «Έλεγχος» για βαθμολογία και εξηγήσεις. Οι απαντήσεις δεν αποστέλλονται σε εξυπηρετητή.</p><main id="questions"></main><button type="button" id="check">Έλεγχος απαντήσεων</button><button type="button" id="reset" class="secondary">Νέα προσπάθεια</button><div id="result" role="status" aria-live="polite"></div><p><a href="#" class="back" id="return-to-course">Επιστροφή στο μάθημα</a></p><script>const data=[{"q": "Τι καθορίζει κυρίως αν ένα prompt είναι κατάλληλο;", "options": ["Το μήκος του", "Ο μαθησιακός σκοπός", "Ο αριθμός αγγλικών όρων"], "correct": 1, "why": "Ο σκοπός καθορίζει τι χρειάζεται να ζητήσουμε."}, {"q": "Ποια πληροφορία είναι συνήθως σχετική σε αίτημα για δύσκολο κείμενο;", "options": ["Το σημείο του κειμένου που δυσκολεύει", "Τα στοιχεία συμφοιτητών", "Όλες οι προσωπικές σημειώσεις τρίτων"], "correct": 0, "why": "Το συγκεκριμένο σημείο δυσκολίας βοηθά χωρίς περιττά δεδομένα."}, {"q": "Τι ισχύει για τα tokens;", "options": ["Κάθε λέξη είναι πάντα ένα token", "Τα tokens εξαρτώνται από τον tokenizer", "Είναι αποκλειστικά ολόκληρες προτάσεις"], "correct": 1, "why": "Η διάσπαση δεν συμπίπτει πάντα με τις λέξεις."}, {"q": "Ποια συμπεριφορά ενισχύει τη μάθηση;", "options": ["Πάντα άμεση έτοιμη λύση", "Καθοδηγητική υπόδειξη και προσωπική προσπάθεια", "Απομνημόνευση prompt"], "correct": 1, "why": "Η εξάσκηση πριν από τη λύση ελέγχει την κατανόηση."}];const root=document.getElementById('questions');let formFields=[];data.forEach((it,i)=>{const fs=document.createElement('fieldset');const leg=document.createElement('legend');leg.textContent=(i+1)+'. '+it.q;fs.append(leg);it.options.forEach((o,j)=>{const label=document.createElement('label');const r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=String(j);label.append(r,document.createTextNode(' '+o));fs.append(label)});const feed=document.createElement('div');feed.className='feedback';feed.hidden=true;fs.append(feed);formFields.push({fs,feed});root.append(fs)});document.getElementById('check').addEventListener('click',()=>{let score=0,miss=0;data.forEach((it,i)=>{const chosen=formFields[i].fs.querySelector('input:checked');const ok=chosen&&Number(chosen.value)===it.correct;if(!chosen)miss++;if(ok)score++;const f=formFields[i].feed;f.hidden=false;f.textContent=(ok?'Σωστά. ':chosen?'Χρειάζεται επανεξέταση. ':'Δεν απαντήθηκε. ')+it.why+' Σωστή επιλογή: '+it.options[it.correct];});document.getElementById('result').textContent='Αποτέλεσμα: '+score+' / '+data.length+(miss?' · Αναπάντητες: '+miss:'')});document.getElementById('reset').addEventListener('click',()=>{formFields.forEach(({fs,feed})=>{fs.querySelectorAll('input').forEach(x=>x.checked=false);feed.hidden=true});document.getElementById('result').textContent='';window.scrollTo({top:0,behavior:'smooth'})});const link=document.getElementById('return-to-course'),path=/^\/(?:geoskills\/)?courses\/ai-learning\/al00\/prompts-context\/?$/,safe=v=>{try{const u=new URL(v,location.href);if(u.protocol===location.protocol&&u.hostname===location.hostname&&!u.username&&!u.password&&path.test(u.pathname))return u.href}catch(_){}return null},fallback=location.pathname.startsWith('/geoskills/')?'/geoskills/courses/ai-learning/al00/prompts-context/':'/courses/ai-learning/al00/prompts-context/',ret=safe(new URLSearchParams(location.search).get('return'))||safe(document.referrer);link.href=ret||new URL(fallback,location.origin).href;link.addEventListener('click',e=>{if(!ret&&history.length>1){e.preventDefault();history.back()}});</script></body></html>
