<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Σχέση ένταξης AI ML DL</title><desc id="desc">Η Βαθιά Μάθηση περιλαμβάνεται στη Μηχανική Μάθηση, που περιλαμβάνεται στην Τεχνητή Νοημοσύνη.</desc><rect width="900" height="440" fill="#f8fafc"/><rect x="25" y="20" width="850" height="400" rx="22" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="50" y="65" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#0f172a">Τεχνητή Νοημοσύνη (AI)</text><rect x="90" y="95" width="720" height="285" rx="20" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="120" y="141" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#064e3b">Μηχανική Μάθηση (ML)</text><rect x="160" y="172" width="585" height="163" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="452" y="236" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Βαθιά Μάθηση (DL)</text><text x="452" y="278" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#1e40af">Πολυεπίπεδα νευρωνικά δίκτυα</text></svg>