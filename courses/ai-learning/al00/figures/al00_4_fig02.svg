<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Μια λέξη μπορεί να αποτελείται από περισσότερα tokens</title>
  <desc id="desc">Ενδεικτικός διαχωρισμός της λέξης πανεπιστημιακός σε παν, επιστημια και κός. Η διάσπαση εξαρτάται από τον tokenizer και δεν αποτελεί υποχρεωτικά συλλαβισμό ή μορφολογική ανάλυση.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c35b2d"/></marker></defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Μια λέξη μπορεί να αποτελείται από περισσότερα tokens</text>
  <rect x="170" y="95" width="860" height="78" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/>
  <text x="188" y="143" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">πανεπιστημιακός</text>
  <line x1="600" y1="173" x2="600" y2="205" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#17324d">ενδεικτική διάσπαση</text>
  <rect x="125" y="225" width="250" height="82" rx="16" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/>
  <rect x="475" y="225" width="250" height="82" rx="16" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/>
  <rect x="825" y="225" width="250" height="82" rx="16" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/>
  <text x="250" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">παν</text>
  <text x="600" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">επιστημια</text>
  <text x="950" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">κός</text>
  <text x="600" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#17324d">Η διάσπαση είναι ενδεικτική και εξαρτάται από τον tokenizer· δεν δηλώνει υποχρεωτικά συλλαβές ή μορφήματα.</text>
</svg>
