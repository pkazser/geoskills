<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">Η πλήρης μαθησιακή αποστολή</title>
<desc id="desc">Ορίζω στόχο και αρχική απάντηση → Συνεργάζομαι με μικρές υποδείξεις → Επαληθεύω από κατάλληλη πηγή → Εφαρμόζω ανεξάρτητα → Καταγράφω τι άλλαξε</desc>
<rect width="920" height="100%" rx="18" fill="#f7f9fc"/>
<text x="460" y="46" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#18324b" font-weight="bold" text-anchor="middle">Η πλήρης μαθησιακή αποστολή</text>
<rect x="90" y="70" width="740" height="64" rx="12" fill="#e0f0fd" stroke="#8caebd"/>
<text x="460" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172d3a" text-anchor="middle">Ορίζω στόχο και αρχική απάντηση</text>
<path d="M 460 134 v 18 m -6 -7 l 6 7 l 6 -7" stroke="#35566c" fill="none" stroke-width="2"/>
<rect x="90" y="153" width="740" height="64" rx="12" fill="#e5f3ea" stroke="#8caebd"/>
<text x="460" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172d3a" text-anchor="middle">Συνεργάζομαι με μικρές υποδείξεις</text>
<path d="M 460 217 v 18 m -6 -7 l 6 7 l 6 -7" stroke="#35566c" fill="none" stroke-width="2"/>
<rect x="90" y="236" width="740" height="64" rx="12" fill="#e0f0fd" stroke="#8caebd"/>
<text x="460" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172d3a" text-anchor="middle">Επαληθεύω από κατάλληλη πηγή</text>
<path d="M 460 300 v 18 m -6 -7 l 6 7 l 6 -7" stroke="#35566c" fill="none" stroke-width="2"/>
<rect x="90" y="319" width="740" height="64" rx="12" fill="#e5f3ea" stroke="#8caebd"/>
<text x="460" y="358" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172d3a" text-anchor="middle">Εφαρμόζω ανεξάρτητα</text>
<path d="M 460 383 v 18 m -6 -7 l 6 7 l 6 -7" stroke="#35566c" fill="none" stroke-width="2"/>
<rect x="90" y="402" width="740" height="64" rx="12" fill="#e0f0fd" stroke="#8caebd"/>
<text x="460" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172d3a" text-anchor="middle">Καταγράφω τι άλλαξε</text>
</svg>
