<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 285" role="img" aria-labelledby="title desc"><title id="title">Κάρτα προσωπικής πρακτικής</title><desc id="desc">Τέσσερα διαδοχικά βήματα: Ικανότητα, Τεκμήριο, Συνήθεια, Μεταφορά.</desc><rect x="0" y="0" width="1030" height="285" rx="16" fill="#ffffff"/><text x="515" y="53" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="26" font-weight="700" fill="#143852">Κάρτα προσωπικής πρακτικής</text><g font-family="system-ui, Arial, sans-serif"><rect x="32" y="110" width="218" height="126" rx="14" fill="#eef5fc" stroke="#2e5877" stroke-width="1.6"/><text x="141" y="151" text-anchor="middle" font-size="19" font-weight="700" fill="#143852">Ικανότητα</text><text x="141" y="181" text-anchor="middle" font-size="15" fill="#234961">τι μπορώ να κάνω</text><path d="M252 171 h26 m-9 -7 l9 7 -9 7" fill="none" stroke="#2e5877" stroke-width="2.4"/><rect x="282" y="110" width="218" height="126" rx="14" fill="#eef5fc" stroke="#2e5877" stroke-width="1.6"/><text x="391" y="151" text-anchor="middle" font-size="19" font-weight="700" fill="#143852">Τεκμήριο</text><text x="391" y="181" text-anchor="middle" font-size="15" fill="#234961">πού το έδειξα</text><path d="M502 171 h26 m-9 -7 l9 7 -9 7" fill="none" stroke="#2e5877" stroke-width="2.4"/><rect x="532" y="110" width="218" height="126" rx="14" fill="#eef5fc" stroke="#2e5877" stroke-width="1.6"/><text x="641" y="151" text-anchor="middle" font-size="19" font-weight="700" fill="#143852">Συνήθεια</text><text x="641" y="181" text-anchor="middle" font-size="15" fill="#234961">τι θα επαναλάβω</text><path d="M752 171 h26 m-9 -7 l9 7 -9 7" fill="none" stroke="#2e5877" stroke-width="2.4"/><rect x="782" y="110" width="218" height="126" rx="14" fill="#eef5fc" stroke="#2e5877" stroke-width="1.6"/><text x="891" y="151" text-anchor="middle" font-size="19" font-weight="700" fill="#143852">Μεταφορά</text><text x="891" y="181" text-anchor="middle" font-size="15" fill="#234961">πού θα το ξαναδοκιμάσω</text></g></svg>