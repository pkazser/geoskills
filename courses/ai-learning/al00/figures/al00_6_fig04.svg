<title id="t">Σχήμα 6.4: Μην συγχέεις τα επίπεδα βεβαιότητας</title><desc id="d">ΔΕΔΟΜΕΝΟ: Τι παρατηρείται ή υπολογίζεται; ΕΡΜΗΝΕΙΑ: Τι μπορεί να εξηγεί τα δεδομένα; ΑΓΝΩΣΤΟ: Τι δεν υποστηρίζεται ακόμη. Δεν παρουσιάζουμε υπόθεση ως γεγονός</desc>
<rect width="860" height="492" fill="#ffffff"/><rect x="22" y="20" width="816" height="452" rx="20" fill="none" stroke="#cfdae5"/>
<text x="65" y="76" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="25" fill="#123451">Μην συγχέεις τα επίπεδα βεβαιότητας</text>
<g font-family="DejaVu Sans, sans-serif"><rect x="65" y="110" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="138" font-size="21" font-weight="700" fill="#163957">ΔΕΔΟΜΕΝΟ</text><text x="87" y="165" font-size="18" fill="#234765">Τι παρατηρείται ή υπολογίζεται</text><path d="M430 180 v18" stroke="#38799b" stroke-width="2"/><path d="M423 192 l7 7 7 -7" fill="none" stroke="#38799b" stroke-width="2"/><rect x="65" y="204" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="232" font-size="21" font-weight="700" fill="#163957">ΕΡΜΗΝΕΙΑ</text><text x="87" y="259" font-size="18" fill="#234765">Τι μπορεί να εξηγεί τα δεδομένα</text><path d="M430 274 v18" stroke="#38799b" stroke-width="2"/><path d="M423 286 l7 7 7 -7" fill="none" stroke="#38799b" stroke-width="2"/><rect x="65" y="298" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="326" font-size="21" font-weight="700" fill="#163957">ΑΓΝΩΣΤΟ</text><text x="87" y="353" font-size="18" fill="#234765">Τι δεν υποστηρίζεται ακόμη</text></g>
<text x="65" y="447" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#476078">Δεν παρουσιάζουμε υπόθεση ως γεγονός</text></svg>