<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="726" viewBox="0 0 1120 726" role="img" aria-labelledby="title desc"><title id="title">Σχήμα 5.1 · Από το αίτημα στη μάθηση</title><desc id="desc">Τέσσερα ερωτήματα, όχι άκαμπτη φόρμουλα 1 · ΣΤΟΧΟΣ: Τι θέλω να κατανοήσω ή να πετύχω;. 2 · ΠΛΑΙΣΙΟ: Ποιες σχετικές πληροφορίες χρειάζονται;. 3 · ΒΟΗΘΕΙΑ: Τι μορφή υποστήριξης θα με βοηθήσει;. 4 · ΕΛΕΓΧΟΣ: Πώς θα ελέγξω απάντηση και κατανόηση;. Κριτήριο: κατάλληλο για τον συγκεκριμένο σκοπό</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="560" y="54" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="bold" fill="#102c43">Σχήμα 5.1 · Από το αίτημα στη μάθηση</text><text x="560" y="87" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#385069">Τέσσερα ερωτήματα, όχι άκαμπτη φόρμουλα</text>
<rect x="145" y="118" rx="16" width="830" height="95" fill="#e2f2f2" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">1 · ΣΤΟΧΟΣ</text>
<text x="560" y="187" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Τι θέλω να κατανοήσω ή να πετύχω;</text>
<path d="M560 213 v24" stroke="#36596e" stroke-width="3"/><path d="M550 229 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="242" rx="16" width="830" height="95" fill="#e7edf8" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="276" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">2 · ΠΛΑΙΣΙΟ</text>
<text x="560" y="311" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Ποιες σχετικές πληροφορίες χρειάζονται;</text>
<path d="M560 337 v24" stroke="#36596e" stroke-width="3"/><path d="M550 353 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="366" rx="16" width="830" height="95" fill="#edf3e4" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="400" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">3 · ΒΟΗΘΕΙΑ</text>
<text x="560" y="435" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Τι μορφή υποστήριξης θα με βοηθήσει;</text>
<path d="M560 461 v24" stroke="#36596e" stroke-width="3"/><path d="M550 477 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="490" rx="16" width="830" height="95" fill="#f6ebdb" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="524" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">4 · ΕΛΕΓΧΟΣ</text>
<text x="560" y="559" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Πώς θα ελέγξω απάντηση και κατανόηση;</text>
<text x="560" y="686" text-anchor="middle" font-size="18" fill="#304f63" font-family="Arial,DejaVu Sans,sans-serif">Κριτήριο: κατάλληλο για τον συγκεκριμένο σκοπό</text></svg>