<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Από τα δεδομένα στην παρακολούθηση</title><desc id="desc">Έξι στάδια: δεδομένα, εκπαίδευση, επικύρωση, ανεξάρτητος έλεγχος, χρήση και παρακολούθηση.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:20px}.box{stroke:#2f6f8f;stroke-width:3;rx:18}.arrow{stroke:#d4772b;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d4772b"/></marker></defs><rect width="1200" height="620" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Από τα δεδομένα στην πραγματική χρήση</text><rect x="45" y="190" width="165" height="120" fill="#e8f3f7" class="box"/><text x="127" y="245" text-anchor="middle" class="b">1. Δεδομένα</text><text x="127" y="278" text-anchor="middle" class="s">κατάλληλα</text><rect x="235" y="190" width="165" height="120" fill="#fff3e6" class="box"/><text x="317" y="245" text-anchor="middle" class="b">2. Εκπαίδευση</text><text x="317" y="278" text-anchor="middle" class="s">μοντέλου</text><rect x="425" y="190" width="165" height="120" fill="#e8f3f7" class="box"/><text x="507" y="245" text-anchor="middle" class="b">3. Επικύρωση</text><text x="507" y="278" text-anchor="middle" class="s">επιλογών</text><rect x="615" y="190" width="165" height="120" fill="#fff3e6" class="box"/><text x="697" y="245" text-anchor="middle" class="b">4. Ανεξάρτητος</text><text x="697" y="278" text-anchor="middle" class="s">έλεγχος</text><rect x="805" y="190" width="165" height="120" fill="#e8f3f7" class="box"/><text x="887" y="245" text-anchor="middle" class="b">5. Χρήση</text><text x="887" y="278" text-anchor="middle" class="s">στην πράξη</text><rect x="995" y="190" width="165" height="120" fill="#fff3e6" class="box"/><text x="1077" y="245" text-anchor="middle" class="b">6. Παρακολούθηση</text><text x="1077" y="278" text-anchor="middle" class="s">νέων δεδομένων</text><path d="M215 250H230M405 250H420M595 250H610M785 250H800M975 250H990" class="arrow"/><path d="M1080 350C1080 485 700 525 570 390" class="arrow"/><text x="830" y="500" text-anchor="middle" class="s">Πρόβλημα → νέα ανάπτυξη και ανεξάρτητη αξιολόγηση</text><text x="600" y="585" text-anchor="middle" class="s">Η παρακολούθηση συνεχίζει μετά την αρχική αξιολόγηση.</text></svg>
