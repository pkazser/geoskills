<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Πιθανή υπερπροσαρμογή</title><desc id="desc">Η επίδοση εκπαίδευσης αυξάνεται, ενώ η επίδοση επικύρωσης κορυφώνεται στο τρίτο στάδιο και μειώνεται.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:20px}.axis{stroke:#17324d;stroke-width:3}.train{stroke:#2f6f8f;stroke-width:7;fill:none}.val{stroke:#d4772b;stroke-width:7;fill:none}.dot{fill:#fff;stroke-width:5}</style></defs><rect width="1200" height="700" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Ενδεικτική εικόνα πιθανής υπερπροσαρμογής</text><line x1="150" y1="570" x2="1080" y2="570" class="axis"/><line x1="150" y1="570" x2="150" y2="130" class="axis"/><text x="615" y="630" text-anchor="middle" class="b">Στάδια εκπαίδευσης</text><text x="55" y="360" transform="rotate(-90 55 360)" text-anchor="middle" class="b">Επίδοση</text><path d="M220 500 L430 410 L640 320 L850 245 L1040 190" class="train"/><path d="M220 515 L430 405 L640 265 L850 340 L1040 465" class="val"/><g class="s"><text x="205" y="600">1</text><text x="415" y="600">2</text><text x="625" y="600">3</text><text x="835" y="600">4</text><text x="1025" y="600">5</text></g><circle cx="640" cy="265" r="10" class="dot" stroke="#d4772b"/><text x="675" y="250" class="b">κορύφωση επικύρωσης</text><line x1="820" y1="160" x2="870" y2="160" class="train"/><text x="880" y="168" class="s">Εκπαίδευση</text><line x1="820" y1="205" x2="870" y2="205" class="val"/><text x="880" y="213" class="s">Επικύρωση</text><text x="600" y="680" text-anchor="middle" class="s">Η τελική αξιολόγηση γίνεται σε ξεχωριστό σύνολο ελέγχου.</text></svg>
