<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img"><style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#223048}.small{font-size:15px}.label{font-size:19px;font-weight:700}.title{font-size:23px;font-weight:700}.muted{fill:#536276}.panel{fill:#edf4f6;stroke:#94adb8;stroke-width:1.5}.accent{fill:#dcecea;stroke:#0a7d75;stroke-width:2}.link{stroke:#0a7d75;stroke-width:2.5;fill:none}</style><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#0a7d75" stroke-width="1.5"/></marker></defs><text x="30" y="38" class="title">Από την έτοιμη απάντηση στην ενεργητική μάθηση</text><rect class="panel" x="20" y="70" rx="13" width="440" height="170"/><text class="label" x="45" y="106">Παραγωγή αποτελέσματος</text><text class="small" x="45" y="144">Ερώτηση → Απάντηση ΤΝ → Παράδοση</text><text class="small muted" x="45" y="185">Δεν τεκμηριώνεται από μόνη της η κατανόηση.</text><rect class="accent" x="490" y="70" rx="13" width="490" height="170"/><text class="label" x="515" y="106">Υποστήριξη μάθησης</text><text class="small" x="515" y="144">Εξήγηση → Προσωπική προσπάθεια</text><text class="small" x="515" y="173">→ Ανατροφοδότηση → Νέα εφαρμογή</text><text class="small muted" x="515" y="207">Δημιουργεί ευκαιρίες ανεξάρτητου ελέγχου.</text></svg>