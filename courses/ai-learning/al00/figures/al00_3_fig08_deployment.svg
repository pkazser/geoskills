<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Καθημερινή χρήση εκπαιδευμένου μοντέλου</title><desc id="desc">Νέο μήνυμα περνά από εκπαιδευμένο μοντέλο, εκτίμηση και ενέργεια εφαρμογής.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:20px}.box{stroke:#2f6f8f;stroke-width:3;rx:18}.arrow{stroke:#d4772b;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d4772b"/></marker></defs><rect width="1200" height="600" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Απλουστευμένη ροή καθημερινής χρήσης</text><rect x="55" y="190" width="235" height="130" fill="#e8f3f7" class="box"/><text x="172" y="245" text-anchor="middle" class="b">Νέο μήνυμα</text><text x="172" y="280" text-anchor="middle" class="s">είσοδος</text><path d="M300 255H390" class="arrow"/><rect x="405" y="190" width="235" height="130" fill="#fff3e6" class="box"/><text x="522" y="245" text-anchor="middle" class="b">Εκπαιδευμένο</text><text x="522" y="280" text-anchor="middle" class="b">μοντέλο</text><path d="M650 255H740" class="arrow"/><rect x="755" y="190" width="190" height="130" fill="#e8f3f7" class="box"/><text x="850" y="245" text-anchor="middle" class="b">Εκτίμηση</text><text x="850" y="280" text-anchor="middle" class="s">Spam / Κανονικό</text><path d="M955 255H1040" class="arrow"/><rect x="1055" y="165" width="100" height="180" fill="#fff3e6" class="box"/><text x="1105" y="220" text-anchor="middle" class="s">Ενέργεια</text><text x="1105" y="260" text-anchor="middle" class="s">Εισερχόμενα</text><text x="1105" y="300" text-anchor="middle" class="s">ή Spam</text><text x="600" y="485" text-anchor="middle" class="s">Η εκτίμηση του μοντέλου διακρίνεται από την ενέργεια της εφαρμογής.</text><text x="600" y="525" text-anchor="middle" class="s">Μπορεί να παρεμβάλλονται κανόνες ή επιλογές του χρήστη.</text></svg>
