<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="825" viewBox="0 0 1100 825" role="img" aria-labelledby="title desc"><title id="title">Από την πηγή στον ισχυρισμό</title><desc id="desc">Ταυτοποιώ — Επιβεβαιώνω τίτλο, συγγραφείς, έτος και σύνδεσμο; Ελέγχω τι διάβασα — Τίτλος, περίληψη ή πλήρες κείμενο;; Συνδέω το τεκμήριο — Ποιο συγκεκριμένο στοιχείο στηρίζει την πρόταση;; Ορίζω τα όρια — Τι δεν αποδεικνύεται;; Αποφασίζω — Χρησιμοποιώ, αναζητώ περαιτέρω ή απορρίπτω</desc><defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}.title{font-size:36px;font-weight:bold;fill:#163B62}.head{font-size:27px;font-weight:bold;fill:#173F62}.sub{font-size:22px;fill:#304F68}.num{font-size:23px;font-weight:bold;fill:white}.foot{font-size:21px;fill:#4A6176}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#647C93"/></marker></defs><rect width="1100" height="825" fill="#fff"/><text x="46" y="88" class="title">Από την πηγή στον ισχυρισμό</text><line x1="46" y1="115" x2="1054" y2="115" stroke="#CBDCEB" stroke-width="2"/><rect x="46" y="170" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="214" r="24" fill="#225B91"/><text x="95" y="221" class="num" text-anchor="middle">1</text><text x="140" y="204" class="head">Ταυτοποιώ</text><text x="140" y="233" class="sub">Επιβεβαιώνω τίτλο, συγγραφείς, έτος και σύνδεσμο</text><path d="M550 261 v16" stroke="#647C93" stroke-width="3" marker-end="url(#arrow)"/><rect x="46" y="280" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="324" r="24" fill="#225B91"/><text x="95" y="331" class="num" text-anchor="middle">2</text><text x="140" y="314" class="head">Ελέγχω τι διάβασα</text><text x="140" y="343" class="sub">Τίτλος, περίληψη ή πλήρες κείμενο;</text><path d="M550 371 v16" stroke="#647C93" stroke-width="3" marker-end="url(#arrow)"/><rect x="46" y="390" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="434" r="24" fill="#225B91"/><text x="95" y="441" class="num" text-anchor="middle">3</text><text x="140" y="424" class="head">Συνδέω το τεκμήριο</text><text x="140" y="453" class="sub">Ποιο συγκεκριμένο στοιχείο στηρίζει την πρόταση;</text><path d="M550 481 v16" stroke="#647C93" stroke-width="3" marker-end="url(#arrow)"/><rect x="46" y="500" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="544" r="24" fill="#225B91"/><text x="95" y="551" class="num" text-anchor="middle">4</text><text x="140" y="534" class="head">Ορίζω τα όρια</text><text x="140" y="563" class="sub">Τι δεν αποδεικνύεται;</text><path d="M550 591 v16" stroke="#647C93" stroke-width="3" marker-end="url(#arrow)"/><rect x="46" y="610" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="654" r="24" fill="#225B91"/><text x="95" y="661" class="num" text-anchor="middle">5</text><text x="140" y="644" class="head">Αποφασίζω</text><text x="140" y="673" class="sub">Χρησιμοποιώ, αναζητώ περαιτέρω ή απορρίπτω</text><text x="46" y="787" class="foot">Η ύπαρξη DOI δεν αποδεικνύει τον ισχυρισμό.</text></svg>