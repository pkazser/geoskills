<title id="t">Σχήμα 6.3: Ο βιβλιογραφικός έλεγχος έχει δύο στάδια</title><desc id="d">1. ΥΠΑΡΧΕΙ Η ΠΗΓΗ;: Σωστά μεταδεδομένα και τεκμήριο; 2. ΣΤΗΡΙΖΕΙ ΤΟΝ ΙΣΧΥΡΙΣΜΟ;: Σχετικό απόσπασμα και όρια. Αληθινή πηγή ≠ σωστή χρήση της πηγής</desc>
<rect width="860" height="398" fill="#ffffff"/><rect x="22" y="20" width="816" height="358" rx="20" fill="none" stroke="#cfdae5"/>
<text x="65" y="76" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="25" fill="#123451">Ο βιβλιογραφικός έλεγχος έχει δύο στάδια</text>
<g font-family="DejaVu Sans, sans-serif"><rect x="65" y="110" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="138" font-size="21" font-weight="700" fill="#163957">1. ΥΠΑΡΧΕΙ Η ΠΗΓΗ;</text><text x="87" y="165" font-size="18" fill="#234765">Σωστά μεταδεδομένα και τεκμήριο</text><path d="M430 180 v18" stroke="#38799b" stroke-width="2"/><path d="M423 192 l7 7 7 -7" fill="none" stroke="#38799b" stroke-width="2"/><rect x="65" y="204" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="232" font-size="21" font-weight="700" fill="#163957">2. ΣΤΗΡΙΖΕΙ ΤΟΝ ΙΣΧΥΡΙΣΜΟ;</text><text x="87" y="259" font-size="18" fill="#234765">Σχετικό απόσπασμα και όρια</text></g>
<text x="65" y="353" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#476078">Αληθινή πηγή ≠ σωστή χρήση της πηγής</text></svg>