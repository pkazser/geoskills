<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="497" viewBox="0 0 1000 497" role="img" aria-labelledby="t d">
<title id="t">Παραδοτέο ≠ απόδειξη μάθησης</title><desc id="d">Χρειάζεται ανεξάρτητη εφαρμογή σε νέα περίπτωση</desc>
<rect width="1000" height="100%" fill="#ffffff"/>
<text x="500" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#18324b">Παραδοτέο ≠ απόδειξη μάθησης</text>
<text x="500" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#18324b">Χρειάζεται ανεξάρτητη εφαρμογή σε νέα περίπτωση</text>
<rect x="130" y="105" width="740" height="62" rx="13" fill="#eaf3fa" stroke="#aabed0"/>
<text x="165" y="131" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#145da0">Τελικό σημείωμα</text>
<text x="165" y="154" font-family="Arial,sans-serif" font-size="16" fill="#18324b">Δείχνει την ποιότητα μιας ολοκληρωμένης εργασίας</text>
<rect x="130" y="183" width="740" height="62" rx="13" fill="#eaf3fa" stroke="#aabed0"/>
<text x="165" y="209" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#145da0">Δική μου εξήγηση χωρίς ΤΝ</text>
<text x="165" y="232" font-family="Arial,sans-serif" font-size="16" fill="#18324b">Δείχνει τι μπορώ να αιτιολογήσω</text>
<rect x="130" y="261" width="740" height="62" rx="13" fill="#eaf3fa" stroke="#aabed0"/>
<text x="165" y="287" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#145da0">Νέα ανεξάρτητη εφαρμογή</text>
<text x="165" y="310" font-family="Arial,sans-serif" font-size="16" fill="#18324b">Ελέγχει αν η δεξιότητα μεταφέρεται</text>
<rect x="130" y="339" width="740" height="62" rx="13" fill="#eaf3fa" stroke="#aabed0"/>
<text x="165" y="365" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#145da0">Αναστοχασμός</text>
<text x="165" y="388" font-family="Arial,sans-serif" font-size="16" fill="#18324b">Τι διορθώθηκε και τι χρειάζεται εξάσκηση</text>
</svg>