<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='580' viewBox='0 0 1200 580' role='img' aria-labelledby='title desc'><title id='title'>Έλεγχος βιβλιογραφικής αναφοράς</title><desc id='desc'>Η ύπαρξη της πηγής δεν αποδεικνύει ότι υποστηρίζει τον ισχυρισμό.</desc><defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#c35b2d'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='60' y='60' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#17324d'>Έλεγχος βιβλιογραφικής αναφοράς</text><rect x='170' y='120' width='860' height='78' rx='18' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='3'/><text x='188' y='158' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='#17324d'>1. Αναζητώ τη δημοσίευση</text><line x1='600' y1='198' x2='600' y2='225' stroke='#c35b2d' stroke-width='4' marker-end='url(#arrow)'/><rect x='170' y='235' width='860' height='78' rx='18' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='3'/><text x='188' y='273' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='#17324d'>2. Ελέγχω τα στοιχεία</text><line x1='600' y1='313' x2='600' y2='340' stroke='#c35b2d' stroke-width='4' marker-end='url(#arrow)'/><rect x='170' y='350' width='860' height='78' rx='18' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='3'/><text x='188' y='388' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='#17324d'>3. Εξετάζω το περιεχόμενο</text><line x1='600' y1='428' x2='600' y2='455' stroke='#c35b2d' stroke-width='4' marker-end='url(#arrow)'/><rect x='170' y='465' width='860' height='78' rx='18' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='3'/><text x='188' y='503' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='#17324d'>4. Ελέγχω τον ισχυρισμό</text></svg>
