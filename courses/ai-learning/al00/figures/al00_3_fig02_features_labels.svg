<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Χαρακτηριστικά και ετικέτα</title><desc id="desc">Ένα μήνυμα μετατρέπεται σε χαρακτηριστικά και συνοδεύεται από γνωστή ετικέτα.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:25px}.s{font-size:21px}.box{stroke:#2f6f8f;stroke-width:3;rx:20}.arrow{stroke:#d4772b;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d4772b"/></marker></defs><rect width="1200" height="650" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Από το μήνυμα στα χαρακτηριστικά και την ετικέτα</text><rect x="55" y="150" width="320" height="300" fill="#e8f3f7" class="box"/><text x="215" y="205" text-anchor="middle" class="h">Μήνυμα</text><text x="215" y="275" text-anchor="middle" class="b">«ΚΕΡΔΙΣΕ ΔΩΡΟ»</text><text x="215" y="320" text-anchor="middle" class="s">λέξεις, μήκος,</text><text x="215" y="352" text-anchor="middle" class="s">σύμβολα και άλλα</text><path d="M390 300H490" class="arrow"/><rect x="505" y="150" width="300" height="300" fill="#fff3e6" class="box"/><text x="655" y="205" text-anchor="middle" class="h">Χαρακτηριστικά</text><text x="655" y="275" text-anchor="middle" class="b">λέξη «δώρο» = 1</text><text x="655" y="315" text-anchor="middle" class="b">μήκος = 13</text><text x="655" y="355" text-anchor="middle" class="b">σύμβολα = 0</text><path d="M820 300H900" class="arrow"/><rect x="915" y="195" width="230" height="210" fill="#e8f3f7" class="box"/><text x="1030" y="255" text-anchor="middle" class="h">Ετικέτα</text><text x="1030" y="320" text-anchor="middle" class="b">Spam</text><text x="1030" y="360" text-anchor="middle" class="s">γνωστή απάντηση</text><text x="600" y="565" text-anchor="middle" class="s">Τα χαρακτηριστικά είναι διαθέσιμη πληροφορία εισόδου· η ετικέτα είναι η γνωστή απάντηση.</text></svg>
