<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Τρεις μορφές μαθησιακού αιτήματος</title><desc id="d">Τρία διαδοχικά αιτήματα: γενικός ορισμός, εξήγηση με παράδειγμα, εξήγηση και προσωπική δοκιμή. Η τελευταία ζητά ανατροφοδότηση.</desc><rect width="1200" height="500" fill="#f6f9fc"/><text x="600" y="54" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="bold" fill="#152f47">Από την πληροφορία στη δική μου κατανόηση</text><g font-family="Arial,DejaVu Sans,sans-serif"><rect x="40" y="105" width="345" height="310" rx="18" fill="#e8edf6" stroke="#6d8aa6" stroke-width="2"/><rect x="428" y="105" width="345" height="310" rx="18" fill="#e3f3f0" stroke="#608b87" stroke-width="2"/><rect x="816" y="105" width="345" height="310" rx="18" fill="#f9f0df" stroke="#b49965" stroke-width="2"/><g font-size="25" font-weight="bold" fill="#1c3b51" text-anchor="middle"><text x="212" y="158">Α · Ορισμός</text><text x="600" y="158">Β · Παράδειγμα</text><text x="988" y="158">Γ · Εξάσκηση</text></g><g font-size="19" fill="#1c3b51" text-anchor="middle"><text x="212" y="230">Τι σημαίνει;</text><text x="600" y="225">Εξήγησε για αρχάριο</text><text x="600" y="255">με καθημερινό παράδειγμα</text><text x="988" y="216">Εξήγησε, έπειτα</text><text x="988" y="246">ρώτησέ με και περίμενε</text><text x="988" y="276">τη δική μου απάντηση</text></g><g font-size="19" font-weight="bold" text-anchor="middle"><text x="212" y="356" fill="#385574">Πληροφορία</text><text x="600" y="356" fill="#37695e">Κατανόηση</text><text x="988" y="356" fill="#926523">Εφαρμογή + έλεγχος</text></g><g stroke="#47647d" stroke-width="4" fill="none"><path d="M392 260 H422"/><path d="M412 250 l10 10 -10 10"/><path d="M780 260 H810"/><path d="M800 250 l10 10 -10 10"/></g></g><text x="600" y="462" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52687a">Το κατάλληλο αίτημα εξαρτάται από τον συγκεκριμένο μαθησιακό στόχο.</text></svg>