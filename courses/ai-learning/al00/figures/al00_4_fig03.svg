<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Από τα tokens στα αριθμητικά αναγνωριστικά</title>
  <desc id="desc">Ενδεικτική αντιστοίχιση των tokens της φράσης Η έρευνα χρειάζεται δεδομένα με τα IDs 104, 528, 316, 872 και 19. Τα IDs δεν μετρούν σημασία και δεν είναι πραγματικές τιμές συγκεκριμένου tokenizer.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c35b2d"/></marker></defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Από τα tokens στα αριθμητικά αναγνωριστικά</text>
  <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Οι αριθμοί είναι ενδεικτικοί</text>
  <rect x="120" y="125" width="960" height="75" rx="16" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/>
  <text x="600" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">«Η έρευνα χρειάζεται δεδομένα.»</text>
  <line x1="600" y1="200" x2="600" y2="230" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d" text-anchor="middle">
    <rect x="70" y="260" width="190" height="85" rx="14" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="165" y="312">Η → 104</text>
    <rect x="285" y="260" width="190" height="85" rx="14" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="380" y="312">έρευνα → 528</text>
    <rect x="500" y="260" width="190" height="85" rx="14" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="595" y="312">χρειάζεται → 316</text>
    <rect x="715" y="260" width="190" height="85" rx="14" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="810" y="312">δεδομένα → 872</text>
    <rect x="930" y="260" width="190" height="85" rx="14" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="1025" y="312">. → 19</text>
  </g>
  <text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Ενδεικτική αντιστοίχιση token–ID· τα IDs δεν εκφράζουν σημασία.</text>
</svg>
