<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 262" role="img" aria-labelledby="title-fig01 title-fig01-desc"><title id="title-fig01">Σχήμα 1 — Ανάλυση ενός υπολογιστικού συστήματος</title><desc id="title-fig01-desc">Διάγραμμα τεσσάρων διαδοχικών σταδίων: στόχος, είσοδος, επεξεργασία και αποτέλεσμα. Τα βέλη δείχνουν τη ροή από την περιγραφή της εργασίας και των πληροφοριών προς τις μεθόδους και το παραγόμενο αποτέλεσμα. Η σημείωση επισημαίνει ότι το ίδιο πλαίσιο ισχύει και για συμβατικά προγράμματα και δεν αποτελεί από μόνο του κριτήριο Τεχνητής Νοημοσύνης.</desc><style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#223048}.small{font-size:15px}.label{font-size:19px;font-weight:700}.title{font-size:23px;font-weight:700}.muted{fill:#536276}.panel{fill:#edf4f6;stroke:#94adb8;stroke-width:1.5}.accent{fill:#dcecea;stroke:#0a7d75;stroke-width:2}.link{stroke:#0a7d75;stroke-width:2.5;fill:none}</style><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#0a7d75" stroke-width="1.5"/></marker></defs><text x="30" y="38" class="title">Αναλύουμε τη λειτουργία ενός συστήματος</text><rect class="panel" x="20" y="78" rx="13" width="220" height="119"/><text class="label" x="130" y="117" text-anchor="middle">Στόχος</text><text class="small muted" x="130" y="149" text-anchor="middle">Ποια εργασία;</text><rect class="panel" x="270" y="78" rx="13" width="210" height="119"/><text class="label" x="375" y="117" text-anchor="middle">Είσοδος</text><text class="small muted" x="375" y="149" text-anchor="middle">Ποιες πληροφορίες;</text><rect class="accent" x="510" y="78" rx="13" width="220" height="119"/><text class="label" x="620" y="117" text-anchor="middle">Επεξεργασία</text><text class="small muted" x="620" y="149" text-anchor="middle">Ποιες μέθοδοι;</text><rect class="panel" x="760" y="78" rx="13" width="220" height="119"/><text class="label" x="870" y="117" text-anchor="middle">Αποτέλεσμα</text><text class="small muted" x="870" y="149" text-anchor="middle">Τι παράγεται;</text><path class="link" d="M240 137 H267 M480 137 H507 M730 137 H757" marker-end="url(#ar)"/><text class="small muted" x="500" y="234" text-anchor="middle">Το πλαίσιο ισχύει και για συμβατικά προγράμματα· δεν αποτελεί από μόνο του κριτήριο ΤΝ.</text></svg>
