<text x="65" y="76" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="25" fill="#123451">Πού μπορεί να εμφανιστεί μεροληψία</text>
<g font-family="DejaVu Sans, sans-serif"><rect x="65" y="110" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="138" font-size="21" font-weight="700" fill="#163957">ΔΕΔΟΜΕΝΑ</text><text x="87" y="165" font-size="18" fill="#234765">Ποιοι εκπροσωπούνται;</text><path d="M430 180 v18" stroke="#38799b" stroke-width="2"/><path d="M423 192 l7 7 7 -7" fill="none" stroke="#38799b" stroke-width="2"/><rect x="65" y="204" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="232" font-size="21" font-weight="700" fill="#163957">ΣΧΕΔΙΑΣΜΟΣ</text><text x="87" y="259" font-size="18" fill="#234765">Ποιες υποθέσεις ενσωματώνονται;</text><path d="M430 274 v18" stroke="#38799b" stroke-width="2"/><path d="M423 286 l7 7 7 -7" fill="none" stroke="#38799b" stroke-width="2"/><rect x="65" y="298" rx="12" width="730" height="70" fill="#ecf3f9" stroke="#a8c6df"/><text x="87" y="326" font-size="21" font-weight="700" fill="#163957">ΑΞΙΟΛΟΓΗΣΗ</text><text x="87" y="353" font-size="18" fill="#234765">Σε ποιες συνθήκες ελέγχεται;</text></g>
