<title id="t">Σχήμα 6.5: Πού μπορεί να εμφανιστεί μεροληψία</title><desc id="d">ΔΕΔΟΜΕΝΑ: Ποιοι εκπροσωπούνται;; ΣΧΕΔΙΑΣΜΟΣ: Ποιες υποθέσεις ενσωματώνονται;; ΑΞΙΟΛΟΓΗΣΗ: Σε ποιες συνθήκες ελέγχεται;. Ένα καλύτερο prompt δεν αρκεί πάντα</desc>
