<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Εκπαίδευση και inference</title><desc id="desc">Παράλληλες ροές εκπαίδευσης μοντέλου και εφαρμογής του σε νέο μήνυμα.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:25px;font-weight:700}.s{font-size:21px}.box{stroke:#2f6f8f;stroke-width:3;rx:18}.arrow{stroke:#d4772b;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d4772b"/></marker></defs><rect width="1200" height="700" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Εκπαίδευση και χρήση σε νέο μήνυμα</text><line x1="600" y1="100" x2="600" y2="600" stroke="#9bb4c3" stroke-width="3" stroke-dasharray="10 10"/><text x="300" y="105" text-anchor="middle" class="h">Εκπαίδευση</text><text x="900" y="105" text-anchor="middle" class="h">Inference / χρήση</text><rect x="75" y="165" width="430" height="90" fill="#e8f3f7" class="box"/><text x="290" y="220" text-anchor="middle" class="b">Παραδείγματα με ετικέτες</text><path d="M290 260V315" class="arrow"/><rect x="75" y="330" width="430" height="90" fill="#fff3e6" class="box"/><text x="290" y="385" text-anchor="middle" class="b">Προσαρμογή μοντέλου</text><path d="M290 425V480" class="arrow"/><rect x="75" y="495" width="430" height="90" fill="#e8f3f7" class="box"/><text x="290" y="550" text-anchor="middle" class="b">Εκπαιδευμένο μοντέλο</text><rect x="695" y="165" width="430" height="90" fill="#e8f3f7" class="box"/><text x="910" y="220" text-anchor="middle" class="b">Νέο μήνυμα</text><path d="M910 260V315" class="arrow"/><rect x="695" y="330" width="430" height="90" fill="#fff3e6" class="box"/><text x="910" y="385" text-anchor="middle" class="b">Εκτίμηση: Spam ή Κανονικό</text><path d="M910 425V480" class="arrow"/><rect x="695" y="495" width="430" height="90" fill="#e8f3f7" class="box"/><text x="910" y="550" text-anchor="middle" class="b">Ενέργεια εφαρμογής</text><text x="600" y="660" text-anchor="middle" class="s">Η εκπαίδευση προσαρμόζει το μοντέλο· η χρήση αξιοποιεί το εκπαιδευμένο μοντέλο.</text></svg>
