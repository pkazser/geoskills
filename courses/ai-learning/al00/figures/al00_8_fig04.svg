<rect x="90" y="319" width="740" height="64" rx="12" fill="#e5f3ea" stroke="#8caebd"/>
<text x="460" y="358" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172d3a" text-anchor="middle">Νέα δοκιμή χωρίς ΤΝ</text>
