<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Πίνακας σύγχυσης spam</title><desc id="desc">15 σωστά spam, 5 spam που διέφυγαν, 5 κανονικά μηνύματα που μπλοκαρίστηκαν και 75 σωστά κανονικά.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:21px}.good{fill:#b9dfc2;stroke:#5b8e58;stroke-width:3}.bad{fill:#f5c0b8;stroke:#ba594e;stroke-width:3}</style></defs><rect width="1200" height="720" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Πίνακας σύγχυσης για 100 μηνύματα</text><text x="720" y="115" text-anchor="middle" class="b">Πρόβλεψη μοντέλου</text><text x="535" y="160" text-anchor="middle" class="s">Spam</text><text x="900" y="160" text-anchor="middle" class="s">Κανονικό</text><text x="165" y="360" transform="rotate(-90 165 360)" text-anchor="middle" class="b">Πραγματική κατηγορία</text><text x="260" y="290" text-anchor="middle" class="s">Spam</text><text x="260" y="500" text-anchor="middle" class="s">Κανονικό</text><rect x="340" y="195" width="360" height="180" class="good"/><rect x="700" y="195" width="360" height="180" class="bad"/><rect x="340" y="375" width="360" height="180" class="bad"/><rect x="700" y="375" width="360" height="180" class="good"/><text x="520" y="255" text-anchor="middle" class="b">15 σωστά spam</text><text x="520" y="300" text-anchor="middle" class="s">εντοπίστηκαν</text><text x="880" y="255" text-anchor="middle" class="b">5 spam</text><text x="880" y="300" text-anchor="middle" class="s">διέφυγαν</text><text x="520" y="435" text-anchor="middle" class="b">5 κανονικά</text><text x="520" y="480" text-anchor="middle" class="s">μπλοκαρίστηκαν</text><text x="880" y="435" text-anchor="middle" class="b">75 σωστά</text><text x="880" y="480" text-anchor="middle" class="s">κανονικά</text><text x="600" y="650" text-anchor="middle" class="s">Πράσινο = σωστή ταξινόμηση · Κόκκινο = λανθασμένη ταξινόμηση.</text></svg>
