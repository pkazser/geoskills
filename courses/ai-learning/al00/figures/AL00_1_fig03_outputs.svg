<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 255" role="img" aria-labelledby="title-fig03 title-fig03-desc"><title id="title-fig03">Σχήμα 3 — Διαφορετικές λειτουργίες και αποτελέσματα</title><desc id="title-fig03-desc">Οριζόντιο διάγραμμα πέντε τύπων αποτελεσμάτων μιας εφαρμογής Τεχνητής Νοημοσύνης: ταξινόμηση, πρόβλεψη, παραγωγή, σύσταση και απόφαση. Κάθε πλαίσιο συνδέει τη λειτουργία με το αντίστοιχο αποτέλεσμα και η σημείωση αναφέρει ότι οι λειτουργίες μπορούν να συνδυάζονται.</desc><style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#223048}.small{font-size:15px}.label{font-size:19px;font-weight:700}.title{font-size:23px;font-weight:700}.muted{fill:#536276}.panel{fill:#edf4f6;stroke:#94adb8;stroke-width:1.5}.accent{fill:#dcecea;stroke:#0a7d75;stroke-width:2}.link{stroke:#0a7d75;stroke-width:2.5;fill:none}</style><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#0a7d75" stroke-width="1.5"/></marker></defs><text x="30" y="38" class="title">Διαφορετικές λειτουργίες, διαφορετικά αποτελέσματα</text><rect class="panel" x="20" y="78" rx="12" width="180" height="125"/><text class="label" x="110" y="116" text-anchor="middle">Ταξινόμηση</text><text class="small muted" x="110" y="148" text-anchor="middle">Κατηγορία</text><rect class="panel" x="220" y="78" rx="12" width="180" height="125"/><text class="label" x="310" y="116" text-anchor="middle">Πρόβλεψη</text><text class="small muted" x="310" y="148" text-anchor="middle">Άγνωστη τιμή</text><rect class="panel" x="420" y="78" rx="12" width="180" height="125"/><text class="label" x="510" y="116" text-anchor="middle">Παραγωγή</text><text class="small muted" x="510" y="148" text-anchor="middle">Νέο περιεχόμενο</text><rect class="panel" x="620" y="78" rx="12" width="180" height="125"/><text class="label" x="710" y="116" text-anchor="middle">Σύσταση</text><text class="small muted" x="710" y="148" text-anchor="middle">Πρόταση</text><rect class="panel" x="820" y="78" rx="12" width="180" height="125"/><text class="label" x="910" y="116" text-anchor="middle">Απόφαση</text><text class="small muted" x="910" y="148" text-anchor="middle">Επιλογή ενέργειας</text><text class="small muted" x="500" y="237" text-anchor="middle">Οι λειτουργίες μπορούν να συνδυάζονται στην ίδια εφαρμογή.</text></svg>
