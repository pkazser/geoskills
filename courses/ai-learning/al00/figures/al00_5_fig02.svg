<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="726" viewBox="0 0 1120 726" role="img" aria-labelledby="title desc"><title id="title">Σχήμα 5.2 · Επιλέγω τα απαραίτητα</title><desc id="desc">Δεν προσθέτουμε κάθε λεπτομέρεια στο prompt ΤΟ ΖΗΤΟΥΜΕΝΟ: Σαφής μαθησιακός στόχος. ΟΙ ΣΧΕΤΙΚΕΣ ΠΛΗΡΟΦΟΡΙΕΣ: Επίπεδο, διαθέσιμο υλικό, περιορισμοί. Ο ΤΡΟΠΟΣ ΥΠΟΣΤΗΡΙΞΗΣ: Παράδειγμα, υπόδειξη, πίνακας ή ερωτήσεις. Ο ΕΛΕΓΧΟΣ: Επαλήθευση ισχυρισμών και προσωπική προσπάθεια. Αφαιρώ άσχετες και ευαίσθητες πληροφορίες</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="560" y="54" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="bold" fill="#102c43">Σχήμα 5.2 · Επιλέγω τα απαραίτητα</text><text x="560" y="87" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#385069">Δεν προσθέτουμε κάθε λεπτομέρεια στο prompt</text>
<rect x="145" y="118" rx="16" width="830" height="95" fill="#e2f2f2" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">ΤΟ ΖΗΤΟΥΜΕΝΟ</text>
<text x="560" y="187" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Σαφής μαθησιακός στόχος</text>
<path d="M560 213 v24" stroke="#36596e" stroke-width="3"/><path d="M550 229 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="242" rx="16" width="830" height="95" fill="#e7edf8" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="276" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">ΟΙ ΣΧΕΤΙΚΕΣ ΠΛΗΡΟΦΟΡΙΕΣ</text>
<text x="560" y="311" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Επίπεδο, διαθέσιμο υλικό, περιορισμοί</text>
<path d="M560 337 v24" stroke="#36596e" stroke-width="3"/><path d="M550 353 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="366" rx="16" width="830" height="95" fill="#edf3e4" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="400" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">Ο ΤΡΟΠΟΣ ΥΠΟΣΤΗΡΙΞΗΣ</text>
<text x="560" y="435" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Παράδειγμα, υπόδειξη, πίνακας ή ερωτήσεις</text>
<path d="M560 461 v24" stroke="#36596e" stroke-width="3"/><path d="M550 477 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="490" rx="16" width="830" height="95" fill="#f6ebdb" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="524" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">Ο ΕΛΕΓΧΟΣ</text>
<text x="560" y="559" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Επαλήθευση ισχυρισμών και προσωπική προσπάθεια</text>
<text x="560" y="686" text-anchor="middle" font-size="18" fill="#304f63" font-family="Arial,DejaVu Sans,sans-serif">Αφαιρώ άσχετες και ευαίσθητες πληροφορίες</text></svg>