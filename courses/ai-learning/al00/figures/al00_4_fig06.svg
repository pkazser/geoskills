<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='500' viewBox='0 0 1200 500' role='img' aria-labelledby='title desc'><title id='title'>Υποθετικές πιθανότητες επόμενης λέξης</title><desc id='desc'>Κατασκευασμένες πιθανότητες για το κείμενο «Ο φοιτητής μελετά για την αυριανή…». Όχι πραγματικά tokens/έξοδος μοντέλου.</desc><defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#c35b2d'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='60' y='60' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#17324d'>Υποθετικές πιθανότητες επόμενης λέξης</text><text x='90' y='148' font-family='Arial, sans-serif' font-size='21' font-weight='700' fill='#17324d'>εξέταση</text><rect x='360' y='120' width='600' height='38' rx='10' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='2'/><rect x='360' y='120' width='330' height='38' rx='10' fill='#5b9bd5'/><text x='990' y='148' font-family='Arial' font-size='21' fill='#17324d'>55%</text><text x='90' y='248' font-family='Arial, sans-serif' font-size='21' font-weight='700' fill='#17324d'>παρουσίαση</text><rect x='360' y='220' width='600' height='38' rx='10' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='2'/><rect x='360' y='220' width='150' height='38' rx='10' fill='#5b9bd5'/><text x='990' y='248' font-family='Arial' font-size='21' fill='#17324d'>25%</text><text x='90' y='348' font-family='Arial, sans-serif' font-size='21' font-weight='700' fill='#17324d'>εργασία</text><rect x='360' y='320' width='600' height='38' rx='10' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='2'/><rect x='360' y='320' width='90' height='38' rx='10' fill='#5b9bd5'/><text x='990' y='348' font-family='Arial' font-size='21' fill='#17324d'>15%</text><text x='90' y='448' font-family='Arial, sans-serif' font-size='21' font-weight='700' fill='#17324d'>εκδρομή</text><rect x='360' y='420' width='600' height='38' rx='10' fill='#eaf3fb' stroke='#2b6f9f' stroke-width='2'/><rect x='360' y='420' width='30' height='38' rx='10' fill='#5b9bd5'/><text x='990' y='448' font-family='Arial' font-size='21' fill='#17324d'>5%</text></svg>
