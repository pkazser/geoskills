<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Εικονογραφημένο παράδειγμα ελέγχου επιστημονικού ισχυρισμού</title><desc id="d">Αριστερά κάρτα ισχυρισμού από ΤΝ, κέντρο μεγεθυντικός φακός συμβολίζει ανεξάρτητη εξέταση πηγής, δεξιά κάρτα καταγράφει τι τεκμηριώνεται και τι παραμένει αβέβαιο.</desc><rect width="1200" height="520" fill="#f7f9fc"/><text x="600" y="56" font-size="32" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="bold" fill="#143249">Ελέγχω πριν αποδεχθώ</text><g font-family="Arial,DejaVu Sans,sans-serif"><rect x="35" y="120" width="335" height="280" rx="18" fill="#edf0f9" stroke="#7387ad" stroke-width="2"/><text x="202" y="164" text-anchor="middle" font-size="25" font-weight="bold" fill="#234363">Απάντηση ΤΝ</text><text x="202" y="228" text-anchor="middle" font-size="19" fill="#234363">«Η μελέτη αποδεικνύει</text><text x="202" y="259" text-anchor="middle" font-size="19" fill="#234363">ότι το Α προκαλεί το Β»</text><text x="202" y="342" text-anchor="middle" font-size="18" fill="#6c4663">Ισχυρισμός για έλεγχο</text><circle cx="595" cy="245" r="105" fill="#e7f4f0" stroke="#497e76" stroke-width="9"/><circle cx="582" cy="230" r="53" fill="none" stroke="#295e57" stroke-width="12"/><path d="M622 270 L684 328" stroke="#295e57" stroke-width="17" stroke-linecap="round"/><text x="595" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="#295e57">Αρχική πηγή</text><rect x="815" y="120" width="350" height="280" rx="18" fill="#f0f4e7" stroke="#7b945d" stroke-width="2"/><text x="990" y="164" text-anchor="middle" font-size="25" font-weight="bold" fill="#34552a">Δική μου κρίση</text><text x="990" y="227" text-anchor="middle" font-size="19" fill="#34552a">Τι δείχνουν τα δεδομένα;</text><text x="990" y="262" text-anchor="middle" font-size="19" fill="#34552a">Τι δεν αποδεικνύεται;</text><text x="990" y="343" text-anchor="middle" font-size="18" fill="#34552a">Τεκμηριωμένο συμπέρασμα</text><path d="M373 255 H468 M710 255 H810" fill="none" stroke="#526c75" stroke-width="4"/><path d="M455 246 l13 9 -13 9 M798 246 l12 9 -12 9" stroke="#526c75" stroke-width="4" fill="none"/></g><text x="600" y="466" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#4c6172">Η παραπομπή ή ο βέβαιος τόνος δεν υποκαθιστούν την επαλήθευση.</text></svg>