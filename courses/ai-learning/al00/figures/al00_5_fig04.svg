<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="726" viewBox="0 0 1120 726" role="img" aria-labelledby="title desc"><title id="title">Σχήμα 5.4 · Ελεγχόμενη βελτίωση</title><desc id="desc">Τρεις γύροι με σαφές σημείο ολοκλήρωσης 1 · ΑΡΧΙΚΟ ΑΙΤΗΜΑ: Ζητώ βοήθεια για συγκεκριμένη δυσκολία. 2 · ΣΤΟΧΕΥΜΕΝΗ ΔΙΕΥΚΡΙΝΙΣΗ: Διορθώνω μία συγκεκριμένη αδυναμία. 3 · ΔΙΚΗ ΜΟΥ ΠΡΟΣΠΑΘΕΙΑ: Εφαρμόζω τη γνώση χωρίς έτοιμη λύση. 4 · ΕΛΕΓΧΟΣ ΚΑΙ ΟΛΟΚΛΗΡΩΣΗ: Ελέγχω, τεκμηριώνω και σταματώ. Ο στόχος δεν είναι ατελείωτες νέες απαντήσεις</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="560" y="54" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="bold" fill="#102c43">Σχήμα 5.4 · Ελεγχόμενη βελτίωση</text><text x="560" y="87" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#385069">Τρεις γύροι με σαφές σημείο ολοκλήρωσης</text>
<rect x="145" y="118" rx="16" width="830" height="95" fill="#e2f2f2" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">1 · ΑΡΧΙΚΟ ΑΙΤΗΜΑ</text>
<text x="560" y="187" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Ζητώ βοήθεια για συγκεκριμένη δυσκολία</text>
<path d="M560 213 v24" stroke="#36596e" stroke-width="3"/><path d="M550 229 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="242" rx="16" width="830" height="95" fill="#e7edf8" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="276" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">2 · ΣΤΟΧΕΥΜΕΝΗ ΔΙΕΥΚΡΙΝΙΣΗ</text>
<text x="560" y="311" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Διορθώνω μία συγκεκριμένη αδυναμία</text>
<path d="M560 337 v24" stroke="#36596e" stroke-width="3"/><path d="M550 353 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="366" rx="16" width="830" height="95" fill="#edf3e4" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="400" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">3 · ΔΙΚΗ ΜΟΥ ΠΡΟΣΠΑΘΕΙΑ</text>
<text x="560" y="435" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Εφαρμόζω τη γνώση χωρίς έτοιμη λύση</text>
<path d="M560 461 v24" stroke="#36596e" stroke-width="3"/><path d="M550 477 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="490" rx="16" width="830" height="95" fill="#f6ebdb" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="524" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">4 · ΕΛΕΓΧΟΣ ΚΑΙ ΟΛΟΚΛΗΡΩΣΗ</text>
<text x="560" y="559" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Ελέγχω, τεκμηριώνω και σταματώ</text>
<text x="560" y="686" text-anchor="middle" font-size="18" fill="#304f63" font-family="Arial,DejaVu Sans,sans-serif">Ο στόχος δεν είναι ατελείωτες νέες απαντήσεις</text></svg>