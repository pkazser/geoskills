<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Κύκλος εκπαίδευσης</title><desc id="desc">Κύκλος παραδείγματος, πρόβλεψης, σύγκρισης, προσαρμογής και επανάληψης.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:20px}.node{stroke:#2f6f8f;stroke-width:3}.arrow{stroke:#d4772b;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d4772b"/></marker></defs><rect width="1200" height="700" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Απλουστευμένος κύκλος επιβλεπόμενης εκπαίδευσης</text><circle cx="600" cy="355" r="105" fill="#fff3e6" class="node"/><text x="600" y="345" text-anchor="middle" class="b">Επανάληψη</text><text x="600" y="380" text-anchor="middle" class="s">με πολλά παραδείγματα</text><rect x="440" y="115" width="320" height="90" rx="18" fill="#e8f3f7" class="node"/><text x="600" y="170" text-anchor="middle" class="b">1. Παράδειγμα με ετικέτα</text><rect x="850" y="310" width="280" height="90" rx="18" fill="#e8f3f7" class="node"/><text x="990" y="365" text-anchor="middle" class="b">2. Πρόβλεψη</text><rect x="690" y="535" width="320" height="90" rx="18" fill="#e8f3f7" class="node"/><text x="850" y="590" text-anchor="middle" class="b">3. Σύγκριση με την ετικέτα</text><rect x="190" y="535" width="320" height="90" rx="18" fill="#e8f3f7" class="node"/><text x="350" y="590" text-anchor="middle" class="b">4. Προσαρμογή μοντέλου</text><rect x="70" y="310" width="280" height="90" rx="18" fill="#e8f3f7" class="node"/><text x="210" y="365" text-anchor="middle" class="b">5. Επανάληψη</text><path d="M680 180C800 205 875 250 930 305" class="arrow"/><path d="M1000 410C1010 485 970 520 940 535" class="arrow"/><path d="M680 590H520" class="arrow"/><path d="M185 535C120 490 105 440 115 405" class="arrow"/><path d="M260 310C310 220 380 175 435 165" class="arrow"/><text x="600" y="675" text-anchor="middle" class="s">Απλουστευμένη εικόνα· δεν περιγράφει καθολικά κάθε αλγόριθμο ML.</text></svg>
