<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Διαχωρισμός δεδομένων</title><desc id="desc">Χίλια παραδείγματα χωρίζονται σε 700 εκπαίδευσης, 150 επικύρωσης και 150 ανεξάρτητου ελέγχου.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:25px;font-weight:700}.s{font-size:21px}.train{fill:#2f6f8f}.val{fill:#d4772b}.test{fill:#5b8e58}</style></defs><rect width="1200" height="620" fill="#f7fbfd"/><text x="600" y="60" text-anchor="middle" class="h">Ενδεικτικός διαχωρισμός 1.000 παραδειγμάτων</text><text x="600" y="115" text-anchor="middle" class="s">70% εκπαίδευση · 15% επικύρωση · 15% ανεξάρτητος έλεγχος</text><rect x="100" y="190" width="700" height="130" class="train"/><rect x="800" y="190" width="150" height="130" class="val"/><rect x="950" y="190" width="150" height="130" class="test"/><text x="450" y="250" text-anchor="middle" fill="#fff" class="b">700 — Εκπαίδευση</text><text x="875" y="250" text-anchor="middle" fill="#fff" class="b">150</text><text x="875" y="285" text-anchor="middle" fill="#fff" class="s">Επικύρωση</text><text x="1025" y="250" text-anchor="middle" fill="#fff" class="b">150</text><text x="1025" y="285" text-anchor="middle" fill="#fff" class="s">Έλεγχος</text><text x="100" y="400" class="b">Εκπαίδευση</text><text x="100" y="445" class="s">Το μοντέλο προσαρμόζεται</text><text x="500" y="400" class="b">Επικύρωση</text><text x="500" y="445" class="s">Επιλογές χωρίς τελική κρίση</text><text x="850" y="400" class="b">Ανεξάρτητος έλεγχος</text><text x="850" y="445" class="s">Τελική εκτίμηση σε νέα δεδομένα</text><text x="600" y="550" text-anchor="middle" class="s">Ενδεικτικό 70/15/15· άλλες αναλογίες ή διασταυρούμενη επικύρωση μπορεί να είναι καταλληλότερες.</text></svg>
