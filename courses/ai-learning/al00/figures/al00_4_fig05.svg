<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Η σταδιακή δημιουργία μιας απάντησης</title>
  <desc id="desc">Τέσσερα διαδοχικά, σωρευτικά στάδια της σχηματικής δημιουργίας μιας απάντησης. Κάθε στάδιο μπορεί να περιλαμβάνει πολλά πραγματικά βήματα παραγωγής tokens και δεν αντιστοιχεί σε ένα μόνο token.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c35b2d"/></marker></defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Η σταδιακή δημιουργία μιας απάντησης</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Σχηματική απεικόνιση — όχι ακριβής αντιστοίχιση ενός σταδίου με ένα token.</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">
    <rect x="150" y="105" width="900" height="88" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="175" y="158">Η επιστημονική έρευνα βασίζεται σε…</text>
    <line x1="600" y1="193" x2="600" y2="220" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="150" y="235" width="900" height="88" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="175" y="288">Η επιστημονική έρευνα βασίζεται σε <tspan fill="#c35b2d">δεδομένα</tspan></text>
    <line x1="600" y1="323" x2="600" y2="350" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="150" y="365" width="900" height="88" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="175" y="418">Η επιστημονική έρευνα βασίζεται σε δεδομένα <tspan fill="#c35b2d">και</tspan></text>
    <line x1="600" y1="453" x2="600" y2="480" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="150" y="495" width="900" height="88" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="175" y="548">Η επιστημονική έρευνα βασίζεται σε δεδομένα και <tspan fill="#c35b2d">συστηματική εξέταση των ευρημάτων</tspan></text>
  </g>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Το νέο τμήμα επισημαίνεται με πορτοκαλί χρώμα.</text>
</svg>
