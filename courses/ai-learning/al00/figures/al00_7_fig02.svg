<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="715" viewBox="0 0 1100 715" role="img" aria-labelledby="title desc"><title id="title">Ποια πηγή χρειάζεται;</title><desc id="desc">Τρέχουσα διοικητική πληροφορία — Επίσημη ανακοίνωση και τυχόν τροποποιήσεις; Εμπειρικός επιστημονικός ισχυρισμός — Μελέτη και κατάλληλη επιστημονική σύνθεση; Βασική έννοια — Έγκυρο εγχειρίδιο ή επιστημονικός φορέας; Ιστορικό συμβάν — Πρωτότυπο τεκμήριο και ιστορικό πλαίσιο</desc><defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}.title{font-size:36px;font-weight:bold;fill:#163B62}.head{font-size:27px;font-weight:bold;fill:#173F62}.sub{font-size:22px;fill:#304F68}.num{font-size:23px;font-weight:bold;fill:white}.foot{font-size:21px;fill:#4A6176}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#647C93"/></marker></defs><rect width="1100" height="715" fill="#fff"/><text x="46" y="88" class="title">Ποια πηγή χρειάζεται;</text><line x1="46" y1="115" x2="1054" y2="115" stroke="#CBDCEB" stroke-width="2"/><rect x="46" y="170" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="214" r="24" fill="#225B91"/><text x="95" y="221" class="num" text-anchor="middle">1</text><text x="140" y="204" class="head">Τρέχουσα διοικητική πληροφορία</text><text x="140" y="233" class="sub">Επίσημη ανακοίνωση και τυχόν τροποποιήσεις</text><path d="M550 261 v16" stroke="#647C93" stroke-width="3" marker-end="url(#arrow)"/><rect x="46" y="280" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="324" r="24" fill="#225B91"/><text x="95" y="331" class="num" text-anchor="middle">2</text><text x="140" y="314" class="head">Εμπειρικός επιστημονικός ισχυρισμός</text><text x="140" y="343" class="sub">Μελέτη και κατάλληλη επιστημονική σύνθεση</text><path d="M550 371 v16" stroke="#647C93" stroke-width="3" marker-end="url(#arrow)"/><rect x="46" y="390" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="434" r="24" fill="#225B91"/><text x="95" y="441" class="num" text-anchor="middle">3</text><text x="140" y="424" class="head">Βασική έννοια</text><text x="140" y="453" class="sub">Έγκυρο εγχειρίδιο ή επιστημονικός φορέας</text><path d="M550 481 v16" stroke="#647C93" stroke-width="3" marker-end="url(#arrow)"/><rect x="46" y="500" width="1008" height="88" rx="16" fill="#EFF5FB" stroke="#CADBEE" stroke-width="2"/><circle cx="95" cy="544" r="24" fill="#225B91"/><text x="95" y="551" class="num" text-anchor="middle">4</text><text x="140" y="534" class="head">Ιστορικό συμβάν</text><text x="140" y="563" class="sub">Πρωτότυπο τεκμήριο και ιστορικό πλαίσιο</text><text x="46" y="677" class="foot">Η καταλληλότητα εξαρτάται από το ερώτημα.</text></svg>