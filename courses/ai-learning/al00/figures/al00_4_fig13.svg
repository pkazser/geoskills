<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Από την ερώτηση στην απάντηση</title>
  <desc id="desc">Απλοποιημένη κατακόρυφη διαδρομή: ερώτηση του χρήστη, tokens και αριθμητικές αναπαραστάσεις, επεξεργασία από το γλωσσικό μοντέλο, σταδιακή παραγωγή tokens και απάντηση.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c35b2d"/></marker></defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Από την ερώτηση στην απάντηση</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle">
    <rect x="180" y="90" width="840" height="110" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="600" y="155">1. Ερώτηση του χρήστη</text>
    <line x1="600" y1="200" x2="600" y2="245" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="180" y="260" width="840" height="110" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="600" y="325">2. Tokens και αριθμητικές αναπαραστάσεις</text>
    <line x1="600" y1="370" x2="600" y2="415" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="180" y="430" width="840" height="110" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="600" y="495">3. Επεξεργασία από το γλωσσικό μοντέλο</text>
    <line x1="600" y1="540" x2="600" y2="585" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="180" y="600" width="840" height="110" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="600" y="665">4. Σταδιακή παραγωγή tokens</text>
    <line x1="600" y1="710" x2="600" y2="755" stroke="#c35b2d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="180" y="770" width="840" height="110" rx="18" fill="#eaf3fb" stroke="#2b6f9f" stroke-width="3"/><text x="600" y="835">5. Απάντηση στον χρήστη</text>
  </g>
  <text x="600" y="930" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Απλοποιημένη διαδρομή· μπορεί να χρησιμοποιούνται πρόσθετες οδηγίες ή εργαλεία.</text>
</svg>
