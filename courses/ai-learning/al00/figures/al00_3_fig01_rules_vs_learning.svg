<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Κανόνες και μάθηση από παραδείγματα</title><desc id="desc">Σύγκριση ρητών κανόνων με εκπαίδευση μοντέλου από δεδομένα.</desc><defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#17324d}.h{font-size:32px;font-weight:700}.b{font-size:25px}.s{font-size:21px}.box{stroke:#2f6f8f;stroke-width:3;rx:20}.arrow{stroke:#d4772b;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d4772b"/></marker></defs><rect width="1200" height="700" fill="#f7fbfd"/><text x="600" y="55" text-anchor="middle" class="h">Ρητοί κανόνες και μάθηση από παραδείγματα</text><rect x="55" y="100" width="505" height="500" fill="#e8f3f7" class="box"/><rect x="640" y="100" width="505" height="500" fill="#fff3e6" class="box"/><text x="307" y="155" text-anchor="middle" class="h">Χειροκίνητος κανόνας</text><text x="892" y="155" text-anchor="middle" class="h">Μοντέλο από δεδομένα</text><rect x="125" y="215" width="365" height="105" fill="#fff" class="box"/><text x="307" y="258" text-anchor="middle" class="b">Αν περιέχει «ΚΕΡΔΙΣΕ ΤΩΡΑ»</text><text x="307" y="293" text-anchor="middle" class="s">τότε → Spam</text><path d="M307 330V400" class="arrow"/><rect x="125" y="420" width="365" height="105" fill="#fff" class="box"/><text x="307" y="463" text-anchor="middle" class="b">Συνθήκη → ενέργεια</text><text x="307" y="498" text-anchor="middle" class="s">ο άνθρωπος ορίζει τη συμπεριφορά</text><rect x="705" y="210" width="180" height="115" fill="#fff" class="box"/><text x="795" y="255" text-anchor="middle" class="b">Πολλά</text><text x="795" y="290" text-anchor="middle" class="b">παραδείγματα</text><rect x="925" y="210" width="180" height="115" fill="#fff" class="box"/><text x="1015" y="255" text-anchor="middle" class="b">Αλγόριθμος</text><text x="1015" y="290" text-anchor="middle" class="s">εκπαίδευσης</text><path d="M885 268H920" class="arrow"/><path d="M1015 340V410" class="arrow"/><rect x="735" y="430" width="310" height="105" fill="#fff" class="box"/><text x="890" y="473" text-anchor="middle" class="b">Μοντέλο</text><text x="890" y="508" text-anchor="middle" class="s">σχέσεις για νέες περιπτώσεις</text><text x="600" y="655" text-anchor="middle" class="s">Μια εφαρμογή μπορεί να συνδυάζει και τις δύο προσεγγίσεις.</text></svg>
