<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="602" viewBox="0 0 1120 602" role="img" aria-labelledby="title desc"><title id="title">Σχήμα 5.3 · Διαθέσιμο πλαίσιο</title><desc id="desc">Εννοιολογική αναπαράσταση, όχι τεχνική κλίμακα ΤΡΕΧΟΝ ΑΙΤΗΜΑ: Αυτό που ζητά ο φοιτητής τώρα. ΣΧΕΤΙΚΟ ΠΡΟΗΓΟΥΜΕΝΟ ΠΕΡΙΕΧΟΜΕΝΟ: Όσα είναι διαθέσιμα στο μοντέλο αυτή τη στιγμή. ΤΕΧΝΙΚΑ ΟΡΙΑ ΚΑΙ ΕΠΙΛΟΓΕΣ ΕΦΑΡΜΟΓΗΣ: Δεν εξασφαλίζουν πρόσβαση σε όλο το ιστορικό. Κρατώ δικό μου ελεγμένο σημείωμα αποφάσεων</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="560" y="54" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="bold" fill="#102c43">Σχήμα 5.3 · Διαθέσιμο πλαίσιο</text><text x="560" y="87" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#385069">Εννοιολογική αναπαράσταση, όχι τεχνική κλίμακα</text>
<rect x="145" y="118" rx="16" width="830" height="95" fill="#e2f2f2" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">ΤΡΕΧΟΝ ΑΙΤΗΜΑ</text>
<text x="560" y="187" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Αυτό που ζητά ο φοιτητής τώρα</text>
<path d="M560 213 v24" stroke="#36596e" stroke-width="3"/><path d="M550 229 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="242" rx="16" width="830" height="95" fill="#e7edf8" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="276" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">ΣΧΕΤΙΚΟ ΠΡΟΗΓΟΥΜΕΝΟ ΠΕΡΙΕΧΟΜΕΝΟ</text>
<text x="560" y="311" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Όσα είναι διαθέσιμα στο μοντέλο αυτή τη στιγμή</text>
<path d="M560 337 v24" stroke="#36596e" stroke-width="3"/><path d="M550 353 l10 10 10 -10" fill="none" stroke="#36596e" stroke-width="3"/>
<rect x="145" y="366" rx="16" width="830" height="95" fill="#edf3e4" stroke="#7693a3" stroke-width="1.5"/>
<text x="560" y="400" text-anchor="middle" font-size="24" font-weight="bold" fill="#173750" font-family="Arial,DejaVu Sans,sans-serif">ΤΕΧΝΙΚΑ ΟΡΙΑ ΚΑΙ ΕΠΙΛΟΓΕΣ ΕΦΑΡΜΟΓΗΣ</text>
<text x="560" y="435" text-anchor="middle" font-size="18" fill="#20394f" font-family="Arial,DejaVu Sans,sans-serif">Δεν εξασφαλίζουν πρόσβαση σε όλο το ιστορικό</text>
<text x="560" y="562" text-anchor="middle" font-size="18" fill="#304f63" font-family="Arial,DejaVu Sans,sans-serif">Κρατώ δικό μου ελεγμένο σημείωμα αποφάσεων</text></svg>