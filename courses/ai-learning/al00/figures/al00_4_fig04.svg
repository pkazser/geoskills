<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='470' viewBox='0 0 1200 470' role='img' aria-labelledby='title desc'><title id='title'>Η επίδραση των συμφραζομένων</title><desc id='desc'>Εννοιολογική απεικόνιση. Δεν παρουσιάζει πραγματικούς εσωτερικούς υπολογισμούς.</desc><defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#c35b2d'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='60' y='60' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#17324d'>Η επίδραση των συμφραζομένων</text><rect x='70' y='170' width='470' height='170' rx='18' fill='#eef7ee' stroke='#2b6f9f' stroke-width='3'/><text x='88' y='208' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='#17324d'>Φύλλο δέντρου</text><text x='88' y='242' font-family='Arial, sans-serif' font-size='17' font-weight='400' fill='#17324d'>δέντρο · βλάστηση · κιτρίνισμα</text><rect x='660' y='170' width='470' height='170' rx='18' fill='#fff3df' stroke='#2b6f9f' stroke-width='3'/><text x='678' y='208' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='#17324d'>Φύλλο εργασίας</text><text x='678' y='242' font-family='Arial, sans-serif' font-size='17' font-weight='400' fill='#17324d'>άσκηση · συμπλήρωση · παράδοση</text><text x='250' y='410' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='#17324d'>διαφορετικά συμφραζόμενα → διαφορετική ερμηνεία</text></svg>
