<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL01.2 — Quiz 1: Αναζητώ επιστημονικές πηγές</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;line-height:1.55;color:#182535;background:#f7f9fc}main{background:white;padding:1.5rem;border-radius:12px;box-shadow:0 2px 14px #19334d12}fieldset{border:1px solid #ced8e1;border-radius:9px;padding:1rem;margin:1rem 0}legend{font-weight:700}label{display:block;padding:.5rem;border-radius:6px;cursor:pointer}label:focus-within{outline:2px solid #2864a0}button{padding:.65rem 1rem;margin-right:.4rem;cursor:pointer;border:1px solid #2864a0;border-radius:7px;background:#2864a0;color:white}button.secondary{background:white;color:#2864a0}.feedback{padding:.6rem;background:#eef4fa;border-radius:6px;margin-top:.5rem}a{color:#18599a}</style></head><body><main><h1>AL01.2 — Quiz 1: Αναζητώ επιστημονικές πηγές</h1><p>Επίλεξε μία απάντηση ανά ερώτηση. Μπορείς να δοκιμάσεις ξανά.</p><form id="quiz"><fieldset data-answer="0" data-feedback="Οι όροι αναφέρονται στο αντικείμενο της αναζήτησης."><legend>1. Ποια είναι χρήσιμη πρώτη αναζήτηση;</legend><label><input type="radio" name="q0" value="0"> generative AI higher education learning</label><label><input type="radio" name="q0" value="1"> everything about technology</label><label><input type="radio" name="q0" value="2"> write my university assignment</label><div class="feedback" role="status" hidden></div></fieldset><fieldset data-answer="1" data-feedback="Η αναθεώρηση των όρων είναι μέρος της αναζήτησης."><legend>2. Βρίσκω άσχετα αποτελέσματα. Τι κάνω;</legend><label><input type="radio" name="q1" value="0"> Διαλέγω τα πρώτα</label><label><input type="radio" name="q1" value="1"> Αλλάζω λέξεις-κλειδιά</label><label><input type="radio" name="q1" value="2"> Σταματώ οριστικά</label><div class="feedback" role="status" hidden></div></fieldset><fieldset data-answer="2" data-feedback="Οι πραγματικές δημοσιεύσεις ελέγχονται ανεξάρτητα."><legend>3. Πώς βοηθά κατάλληλα η ΤΝ;</legend><label><input type="radio" name="q2" value="0"> Εγγυάται τη βιβλιογραφία</label><label><input type="radio" name="q2" value="1"> Αντικαθιστά την επαλήθευση</label><label><input type="radio" name="q2" value="2"> Προτείνει εναλλακτικούς όρους</label><div class="feedback" role="status" hidden></div></fieldset><fieldset data-answer="0" data-feedback="Η σειρά εμφάνισης δεν τεκμηριώνει συνάφεια."><legend>4. Άρθρο που εμφανίζεται πρώτο σημαίνει ότι:</legend><label><input type="radio" name="q3" value="0"> Δεν είναι απαραίτητα το καταλληλότερο</label><label><input type="radio" name="q3" value="1"> Είναι πάντα το καλύτερο</label><label><input type="radio" name="q3" value="2"> Δεν χρειάζεται ανάγνωση</label><div class="feedback" role="status" hidden></div></fieldset><button type="submit">Έλεγχος απαντήσεων</button><button type="button" class="secondary" id="reset">Νέα προσπάθεια</button></form><p id="score" role="status" aria-live="polite"></p><p><a href="/geoskills/courses/ai-learning/al01/core/literature-search/" id="back">Επιστροφή στην προηγούμενη σελίδα</a></p></main><script>const form=document.querySelector('#quiz');form.addEventListener('submit',e=>{e.preventDefault();const fs=[...form.querySelectorAll('fieldset')];if(fs.some(f=>!f.querySelector('input:checked'))){document.querySelector('#score').textContent='Απάντησε και στις τέσσερις ερωτήσεις.';return}let count=0;fs.forEach(f=>{const ok=Number(f.querySelector('input:checked').value)===Number(f.dataset.answer);count+=ok?1:0;const n=f.querySelector('.feedback');n.hidden=false;n.textContent=(ok?'Σωστά. ':'Χρειάζεται επανεξέταση. ')+f.dataset.feedback});document.querySelector('#score').textContent=`Αποτέλεσμα: ${count}/4`;});document.querySelector('#reset').addEventListener('click',()=>{HTMLFormElement.prototype.reset.call(form);document.querySelectorAll('.feedback').forEach(x=>x.hidden=true);document.querySelector('#score').textContent='';});const back=document.querySelector('#back');function coreReturnURL(){return '/geoskills/courses/ai-learning/al01/core/literature-search/';}back.href=coreReturnURL();</script></body></html>
