<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL01.1 — Quiz 2: Ελέγχω το σχέδιο</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;line-height:1.55;color:#182535;background:#f7f9fc}main{background:white;padding:1.5rem;border-radius:12px;box-shadow:0 2px 14px #19334d12}fieldset{border:1px solid #ced8e1;border-radius:9px;padding:1rem;margin:1rem 0}legend{font-weight:700}label{display:block;padding:.5rem;border-radius:6px;cursor:pointer}label:focus-within{outline:2px solid #2864a0}button{padding:.65rem 1rem;margin-right:.4rem;cursor:pointer;border:1px solid #2864a0;border-radius:7px;background:#2864a0;color:white}button.secondary{background:white;color:#2864a0}.feedback{padding:.6rem;background:#eef4fa;border-radius:6px;margin-top:.5rem}a{color:#18599a}</style></head><body><main><h1>AL01.1 — Quiz 2: Ελέγχω το σχέδιο</h1><p>Επίλεξε μία απάντηση ανά ερώτηση. Μπορείς να δοκιμάσεις ξανά.</p><form id="quiz"><fieldset data-answer="2" data-feedback="Η τρίτη διατύπωση περιορίζει τη χρήση και το πλαίσιο."><legend>1. Ποιο είναι πιο συγκεκριμένο θέμα;</legend><label><input type="radio" name="q0" value="0"> Η τεχνολογία στον κόσμο</label><label><input type="radio" name="q0" value="1"> Η ΤΝ από την αρχαιότητα</label><label><input type="radio" name="q0" value="2"> Η ΤΝ για κατανόηση εννοιών από φοιτητές</label><div class="feedback" role="status" hidden></div></fieldset><fieldset data-answer="1" data-feedback="Η ευθύνη των αποφάσεων μένει στον φοιτητή."><legend>2. Πώς χρησιμοποιώ την ΤΝ;</legend><label><input type="radio" name="q1" value="0"> Αποδέχομαι έτοιμη εργασία</label><label><input type="radio" name="q1" value="1"> Ζητώ εναλλακτικές και ελέγχω τις επιλογές μου</label><label><input type="radio" name="q1" value="2"> Αφήνω την ΤΝ να αποφασίσει</label><div class="feedback" role="status" hidden></div></fieldset><fieldset data-answer="2" data-feedback="Η επάρκεια βιβλιογραφίας ελέγχεται στην αναζήτηση."><legend>3. Δεν ξέρω αν υπάρχουν αρκετές πηγές. Τι κάνω;</legend><label><input type="radio" name="q2" value="0"> Τις επινοώ</label><label><input type="radio" name="q2" value="1"> Απορρίπτω όλες τις ιδέες</label><label><input type="radio" name="q2" value="2"> Καταγράφω εκκρεμότητα για την AL01.2</label><div class="feedback" role="status" hidden></div></fieldset><fieldset data-answer="0" data-feedback="Στόχος είναι λειτουργικό προσωπικό σχέδιο με αιτιολόγηση."><legend>4. Τι αποτελεί απόδειξη ολοκλήρωσης;</legend><label><input type="radio" name="q3" value="0"> Σχέδιο που μπορώ να εξηγήσω</label><label><input type="radio" name="q3" value="1"> Αντιγραφή απάντησης ΤΝ</label><label><input type="radio" name="q3" value="2"> Έτοιμο τελικό δοκίμιο</label><div class="feedback" role="status" hidden></div></fieldset><button type="submit">Έλεγχος απαντήσεων</button><button type="button" class="secondary" id="reset">Νέα προσπάθεια</button></form><p id="score" role="status" aria-live="polite"></p><p><a href="/geoskills/courses/ai-learning/al01/core/assignment-planning/" id="back">Επιστροφή στην προηγούμενη σελίδα</a></p></main><script>const form=document.querySelector('#quiz');form.addEventListener('submit',e=>{e.preventDefault();const fs=[...form.querySelectorAll('fieldset')];if(fs.some(f=>!f.querySelector('input:checked'))){document.querySelector('#score').textContent='Απάντησε και στις τέσσερις ερωτήσεις.';return}let count=0;fs.forEach(f=>{const ok=Number(f.querySelector('input:checked').value)===Number(f.dataset.answer);count+=ok?1:0;const n=f.querySelector('.feedback');n.hidden=false;n.textContent=(ok?'Σωστά. ':'Χρειάζεται επανεξέταση. ')+f.dataset.feedback});document.querySelector('#score').textContent=`Αποτέλεσμα: ${count}/4`;});document.querySelector('#reset').addEventListener('click',()=>{HTMLFormElement.prototype.reset.call(form);document.querySelectorAll('.feedback').forEach(x=>x.hidden=true);document.querySelector('#score').textContent='';});const back=document.querySelector('#back');function coreReturnURL(){return '/geoskills/courses/ai-learning/al01/core/assignment-planning/';}back.href=coreReturnURL();</script></body></html>
