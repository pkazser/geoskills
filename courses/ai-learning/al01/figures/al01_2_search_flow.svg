<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="al012-title al012-desc"><title id="al012-title">Διαδρομή τεκμηριωμένης βιβλιογραφικής αναζήτησης</title><desc id="al012-desc">Πέντε στάδια: ερευνητικό ερώτημα, όροι, πραγματική αναζήτηση, ταυτοποίηση πηγών, αξιολόγηση συνάφειας. Βέλος επιστροφής από την αξιολόγηση προς το αρχικό ερώτημα για τεκμηριωμένη αναθεώρηση.</desc><rect width="1120" height="310" fill="#f8fafc" rx="16"/><g font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><rect x="20" y="56" width="190" height="100" rx="12" fill="#dae9f7" stroke="#346c9e"/><text x="115" y="94"><tspan x="115">Ερευνητικό</tspan><tspan x="115" dy="27">ερώτημα</tspan></text><rect x="245" y="56" width="190" height="100" rx="12" fill="#d9eee2" stroke="#3d8568"/><text x="340" y="94"><tspan x="340">Έννοιες και</tspan><tspan x="340" dy="27">λέξεις-κλειδιά</tspan></text><rect x="470" y="56" width="190" height="100" rx="12" fill="#fff0d8" stroke="#ad7a25"/><text x="565" y="94"><tspan x="565">Πραγματική</tspan><tspan x="565" dy="27">αναζήτηση</tspan></text><rect x="695" y="56" width="190" height="100" rx="12" fill="#e9e1f5" stroke="#8069a5"/><text x="790" y="94"><tspan x="790">Ταυτοποίηση</tspan><tspan x="790" dy="27">δημοσιεύσεων</tspan></text><rect x="920" y="56" width="180" height="100" rx="12" fill="#d9eee2" stroke="#3d8568"/><text x="1010" y="94"><tspan x="1010">Αξιολόγηση</tspan><tspan x="1010" dy="27">συνάφειας</tspan></text></g><g fill="none" stroke="#425466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M213 106h28m-9 -7 9 7 -9 7"/><path d="M438 106h28m-9 -7 9 7 -9 7"/><path d="M663 106h28m-9 -7 9 7 -9 7"/><path d="M888 106h28m-9 -7 9 7 -9 7"/><path d="M1010 160v76H115v-76m-8 9 8 -9 8 9" stroke="#b45f36" stroke-dasharray="9 6"/></g><text x="565" y="264" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#86482b">Αναθεώρηση ερωτήματος και στρατηγικής όταν χρειάζεται</text></svg>