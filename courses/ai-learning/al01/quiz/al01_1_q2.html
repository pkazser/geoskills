<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 2 — Αξιολογώ ένα σχέδιο εργασίας</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f9fb;color:#192536;line-height:1.55;margin:0}main{max-width:850px;margin:32px auto;padding:28px;background:#fff;border:1px solid #e3e8ee;border-radius:14px}h1{font-size:1.7rem}fieldset{border:1px solid #d8e1eb;border-radius:10px;padding:18px;margin:20px 0}legend{font-weight:700;padding:0 6px}label{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:7px;cursor:pointer}label:focus-within{outline:2px solid #2865aa;outline-offset:1px}label:hover{background:#f2f6fa}input{margin-top:5px;accent-color:#235d98}button,.back{border:0;border-radius:8px;background:#235d98;color:#fff;padding:11px 17px;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}button:focus-visible,.back:focus-visible{outline:3px solid #f4a934;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#e7edf4;color:#192536}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}.feedback{border-left:4px solid #2d667e;background:#edf7fb;padding:12px;margin:12px 0}.feedback.correct{border-color:#15815b;background:#eef9f3}.feedback.incorrect{border-color:#ab6020;background:#fff7e9}.error{color:#9c2d24;font-weight:700}#result{font-weight:700;margin-top:18px}small{color:#49596b}@media(max-width:600px){main{padding:16px;margin:0;min-height:100vh;border-radius:0}h1{font-size:1.35rem}fieldset{padding:12px}}</style></head><body><main><h1>Quiz 2 — Αξιολογώ ένα σχέδιο εργασίας</h1><p>GeoSkills — AL01.1. Απάντησε χωρίς βοήθεια ΤΝ. Μετά τη βαθμολόγηση διάβασε την αιτιολόγηση κάθε απάντησης.</p><form id="quiz" novalidate></form><div id="result" role="status" aria-live="polite"></div><div class="actions"><button type="submit" form="quiz" id="grade">Έλεγχος απαντήσεων</button><button class="secondary" type="button" id="retry" hidden>Νέα προσπάθεια</button><a class="back" id="return-link" href="../index.html">Επιστροφή στο μάθημα</a></div><p><small>Οι απαντήσεις αξιολογούνται μόνο σε αυτόν τον browser και δεν αποθηκεύονται σε διακομιστή.</small></p></main><script>const QUESTIONS=[{"question": "Ποια χρήση της ΤΝ υποστηρίζει περισσότερο την ακαδημαϊκή αυτονομία;", "options": ["Να αποφασίζει μόνη της το θέμα", "Να παραδίδει έτοιμο κείμενο χωρίς έλεγχο", "Να προτείνει επιλογές που αξιολογεί ο φοιτητής"], "correct": 2, "explanation": "Η ΤΝ βοηθά στον σχεδιασμό, ενώ ο φοιτητής αξιολογεί, επιλέγει και αναλαμβάνει την ευθύνη."}, {"question": "Ένα εργαλείο ΤΝ προτείνει πέντε άρθρα. Ποιο είναι το σωστό επόμενο βήμα;", "options": ["Να τα συμπεριλάβω αμέσως στη βιβλιογραφία", "Να επιβεβαιώσω ότι υπάρχουν και ότι είναι σχετικά και κατάλληλα", "Να παραλείψω όλες τις βιβλιογραφικές αναφορές"], "correct": 1, "explanation": "Τα εργαλεία ΤΝ μπορεί να προτείνουν ανακριβή ή ανύπαρκτα στοιχεία. Κάθε πηγή χρειάζεται ανεξάρτητη επαλήθευση."}, {"question": "Μετά την αρχική αναζήτηση διαπιστώνεις ότι το ερώτημά σου είναι πολύ ευρύ. Τι κάνεις;", "options": ["Διατηρώ αμετάβλητο το αρχικό σχέδιο", "Στενεύω τεκμηριωμένα το ερώτημα και ενημερώνω το σχέδιο", "Ζητώ από την ΤΝ να επινοήσει στοιχεία που λείπουν"], "correct": 1, "explanation": "Ο αρχικός σχεδιασμός είναι αναθεωρήσιμος. Τα νέα ευρήματα δικαιολογούν αλλαγές που εξηγούνται και καταγράφονται."}, {"question": "Ποιο σχέδιο είναι περισσότερο εφαρμόσιμο για εργασία δύο εβδομάδων;", "options": ["Αναζήτηση, ανάγνωση, σύνθεση, συγγραφή, έλεγχος και υποβολή με ενδιάμεσες προθεσμίες", "Συγγραφή και παράδοση αποκλειστικά την τελευταία ημέρα", "Αναμονή μέχρι η ΤΝ να γράψει όλο το κείμενο"], "correct": 0, "explanation": "Τα συγκεκριμένα ενδιάμεσα παραδοτέα αφήνουν χρόνο για έλεγχο πηγών και αναθεώρηση και περιορίζουν τον κίνδυνο καθυστέρησης."}];
function quizReturnURL(){
 const origin=location.origin;
 const local=location.hostname==='localhost'||location.hostname==='127.0.0.1';
 if(local){const lessonOrigin=location.port==='3100'?`${location.protocol}//${location.hostname}:3000`:origin;return `${lessonOrigin}/courses/ai-learning/al01/assignment-planning/`;}
 return `${origin}/geoskills/courses/ai-learning/al01/assignment-planning/`;
}
function render(){
 const form=document.getElementById('quiz');
 QUESTIONS.forEach((q,i)=>{
   const field=document.createElement('fieldset');
   const legend=document.createElement('legend');legend.textContent=`${i+1}. ${q.question}`;field.append(legend);
   q.options.forEach((option,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name=`q${i}`;input.value=String(j);input.required=true;label.append(input,document.createTextNode(option));field.append(label);});
   const feedback=document.createElement('div');feedback.className='feedback';feedback.id=`feedback-${i}`;feedback.hidden=true;feedback.setAttribute('role','status');field.append(feedback);form.append(field);
 });
 document.getElementById('return-link').href=quizReturnURL();
}
function grade(event){
 event.preventDefault();const selections=QUESTIONS.map((_,i)=>document.querySelector(`input[name="q${i}"]:checked`));
 if(selections.some(v=>v===null)){document.getElementById('result').textContent='Απάντησε σε όλες τις ερωτήσεις πριν από τη βαθμολόγηση.';document.getElementById('result').className='error';return;}
 let score=0;QUESTIONS.forEach((q,i)=>{const choice=Number(selections[i].value);const correct=choice===q.correct;if(correct)score++;const f=document.getElementById(`feedback-${i}`);f.hidden=false;f.className=`feedback ${correct?'correct':'incorrect'}`;f.textContent=`${correct?'Σωστά.':'Χρειάζεται επανεξέταση.'} Σωστή επιλογή: ${q.options[q.correct]}. ${q.explanation}`;});
 document.getElementById('result').className='';document.getElementById('result').textContent=`Αποτέλεσμα: ${score}/${QUESTIONS.length}. Διάβασε την ανατροφοδότηση σε κάθε ερώτηση.`;
 document.getElementById('retry').hidden=false;document.getElementById('grade').hidden=true;
 document.querySelectorAll('input[type="radio"]').forEach(x=>x.disabled=true);
}
function resetQuiz(){document.getElementById('quiz').reset();document.querySelectorAll('input[type="radio"]').forEach(x=>x.disabled=false);QUESTIONS.forEach((_,i)=>{document.getElementById(`feedback-${i}`).hidden=true;});document.getElementById('result').textContent='';document.getElementById('retry').hidden=true;document.getElementById('grade').hidden=false;document.getElementById('grade').focus();}
window.addEventListener('DOMContentLoaded',()=>{render();document.getElementById('quiz').addEventListener('submit',grade);document.getElementById('retry').addEventListener('click',resetQuiz);});</script></body></html>
