<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL01.2 · Quiz 1</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}body{background:#f5f7fa;color:#1d2939;margin:0;padding:24px}main{max-width:790px;margin:auto;background:white;padding:clamp(16px,4vw,40px);border:1px solid #e1e5e9;border-radius:14px}fieldset{border:1px solid #d9dfe6;border-radius:10px;margin:20px 0;padding:18px}legend{font-weight:700;padding:0 5px}label{display:block;padding:8px 4px;cursor:pointer}input{accent-color:#176c5b}button,a.return{display:inline-block;background:#176c5b;color:white;padding:11px 16px;margin:8px 8px 4px 0;border:0;border-radius:8px;text-decoration:none;cursor:pointer;font-size:1rem}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e0a52a;outline-offset:3px}.feedback{margin-top:8px;padding:12px;border-radius:6px;background:#f2f5f7}.result{font-weight:bold;font-size:1.15rem}small{color:#526171}@media(max-width:500px){body{padding:8px}fieldset{padding:10px}}</style></head><body><main><h1>AL01.2 — Quiz 1</h1><p>Σχεδιάζω την αναζήτηση</p><p>Επίλεξε μία απάντηση σε καθεμία από τις τέσσερις ερωτήσεις. Μετά τη βαθμολόγηση διάβασε την επεξήγηση.</p><form id="quiz"></form><p id="result" role="status" aria-live="polite"></p><button type="button" id="grade">Βαθμολόγηση</button><button type="button" id="reset">Νέα προσπάθεια</button><a class="return" id="back" href="/geoskills/courses/ai-learning/al01/literature-search/">Επιστροφή στην AL01.2</a><p><small>Η βαθμολογία προορίζεται για διαμορφωτική αυτοαξιολόγηση.</small></p></main><script>
'use strict';
const questions = [{"q": "Ποια είναι η καταλληλότερη αρχική ενέργεια για αναζήτηση σχετικά με ΤΝ και μάθηση προπτυχιακών;", "options": ["Να ζητήσω από chatbot να δημιουργήσει βιβλιογραφία", "Να αναλύσω τις έννοιες του ερωτήματος και πιθανούς όρους αναζήτησης", "Να επιλέξω τους πρώτους πέντε τίτλους μιας γενικής αναζήτησης"], "correct": 1, "feedback": "Η στρατηγική αρχίζει από το πραγματικό ερώτημα και τους όρους του, όχι από τυχαία αποτελέσματα."}, {"q": "Γιατί χρησιμοποιούμε εναλλακτικούς όρους όπως generative AI και large language models;", "options": ["Επειδή είναι απολύτως ταυτόσημοι", "Επειδή μπορεί να οδηγήσουν σε διαφορετικές συναφείς δημοσιεύσεις, εφόσον ελέγξουμε το νόημά τους", "Επειδή ο ένας αποκλείει υποχρεωτικά τον άλλο"], "correct": 1, "feedback": "Οι όροι επικαλύπτονται, αλλά δεν ταυτίζονται πλήρως. Η συνάφεια ελέγχεται στις πηγές."}, {"q": "Σε υπηρεσία που υποστηρίζει Boolean αναζήτηση, τι επιδιώκουμε με OR μεταξύ δύο εναλλακτικών όρων;", "options": ["Αποτελέσματα με τον έναν ή τον άλλο όρο", "Υποχρεωτική παρουσία και των δύο", "Αποκλεισμό και των δύο"], "correct": 0, "feedback": "Ο τελεστής OR διευρύνει την αναζήτηση σε εναλλακτικούς όρους, σύμφωνα με τη σύνταξη της υπηρεσίας."}, {"q": "Μια εστιασμένη αναζήτηση επιστρέφει λίγα αποτελέσματα. Τι πρέπει να κάνω;", "options": ["Να συμπεράνω ότι δεν υπάρχει βιβλιογραφία", "Να επινοήσω πρόσθετες πηγές", "Να δοκιμάσω άλλους όρους και λιγότερο περιοριστική στρατηγική"], "correct": 2, "feedback": "Ο μικρός αριθμός μπορεί να προκύπτει από όρους και φίλτρα, όχι από απουσία πραγματικών μελετών."}];
const form=document.getElementById('quiz');
function makeQuestions(){form.replaceChildren();questions.forEach((item,i)=>{const f=document.createElement('fieldset');const l=document.createElement('legend');l.textContent=(i+1)+'. '+item.q;f.append(l);item.options.forEach((option,j)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=String(j);label.append(radio,document.createTextNode(' '+option));f.append(label);});const fb=document.createElement('div');fb.className='feedback';fb.id='feedback'+i;fb.hidden=true;f.append(fb);form.append(f);});document.getElementById('result').textContent='';}
document.getElementById('grade').addEventListener('click',()=>{let score=0,missing=0;const values=[];questions.forEach((q,i)=>{const checked=form.querySelector('input[name="q'+i+'"]:checked');if(!checked)missing++;values.push(checked?Number(checked.value):null);});if(missing){document.getElementById('result').textContent='Απάντησε και στις τέσσερις ερωτήσεις πριν από τη βαθμολόγηση.';return;}questions.forEach((q,i)=>{const correct=values[i]===q.correct;if(correct)score++;const fb=document.getElementById('feedback'+i);fb.hidden=false;fb.textContent=(correct?'Σωστή απάντηση. ':'Χρειάζεται επανεξέταση. Σωστή επιλογή: '+q.options[q.correct]+'. ')+q.feedback;});document.getElementById('result').textContent='Αποτέλεσμα: '+score+'/'+questions.length+'.';});
document.getElementById('reset').addEventListener('click',makeQuestions);
function getReturnURL(){const url=new URL(window.location.href);const isLocal=['localhost','127.0.0.1'].includes(url.hostname);if(isLocal){const local=new URL(url.href);local.port='3000';local.pathname='/courses/ai-learning/al01/literature-search/';local.search='';local.hash='';return local.href;}return new URL('/geoskills/courses/ai-learning/al01/literature-search/',url.origin).href;}
document.getElementById('back').href=getReturnURL();makeQuestions();
</script></body></html>
