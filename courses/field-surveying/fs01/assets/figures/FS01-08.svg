<g font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#344f5d"><text x="43" y="575">● Σ1, Σ2: υποψήφιες στάσεις · όχι επιβεβαιωμένα σημεία ελέγχου</text><text x="43" y="602">Δεν απεικονίζονται πραγματικές συντεταγμένες, μετρήσεις ή άδειες πρόσβασης.</text></g>
