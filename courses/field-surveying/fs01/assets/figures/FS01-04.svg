<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">FS01-04 — παράγωγο CAMPUS-01</title>
<desc id="desc">Συνθετικός υπαίθριος χώρος περίπου 60 επί 80 μέτρων. Κτίριο Α βορειοδυτικά, κτίριο Β νοτιοανατολικά, κεντρικός διάδρομος από δυτικά προς ανατολικά, δέντρα νοτιοδυτικά, ανοικτή περιοχή Α βορειοανατολικά, περιοχή εμποδίων Β νοτιοδυτικά και μεικτή περιοχή Γ γύρω από τον διάδρομο. Οι θέσεις Σ1 και Σ2 είναι υποψήφιες και δεν έχουν πραγματικές συντεταγμένες.</desc>
<rect width="960" height="640" fill="#fff"/>
<text x="35" y="43" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#172e3c">FS01-04 · CAMPUS-01</text>
<text x="35" y="70" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#526371">Συνθετικό εκπαιδευτικό παράδειγμα · όχι τοπογραφική αποτύπωση</text>
