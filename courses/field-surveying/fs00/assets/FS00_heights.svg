<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" role="img" aria-labelledby="title desc"><title id="title">Ύψη στη μέτρηση</title><desc id="desc">Συγκρίνει τα σημεία αναφοράς και τις αποστάσεις ύψους οργάνου, στόχου και κεραίας που πρέπει να οριστούν πριν από τη μέτρηση.</desc><rect width="700" height="410" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:21px;font-weight:bold}.s{font-size:16px}</style><line x1="40" y1="340" x2="660" y2="340" stroke="#64748b" stroke-width="3"/><rect x="110" y="70" width="80" height="46" rx="6" fill="#a2b5c5" stroke="#4f697d" stroke-width="3"/><line x1="150" y1="116" x2="86" y2="336" stroke="#897955" stroke-width="7"/><line x1="150" y1="116" x2="214" y2="336" stroke="#897955" stroke-width="7"/><line x1="150" y1="116" x2="150" y2="340" stroke="#897955" stroke-width="6"/><circle cx="150" cy="91" r="8" fill="#4479a7"/><line x1="248" y1="91" x2="248" y2="340" stroke="#268e74" stroke-width="4"/><text x="261" y="221" class="t">HI</text><line x1="490" y1="75" x2="490" y2="340" stroke="#64748b" stroke-width="8"/><circle cx="490" cy="75" r="18" fill="#dfa54a"/><line x1="585" y1="75" x2="585" y2="340" stroke="#268e74" stroke-width="4"/><text x="598" y="220" class="t">HR</text><text x="88" y="379" class="s">Ύψος οργάνου</text><text x="437" y="379" class="s">Ύψος στόχου</text></svg>