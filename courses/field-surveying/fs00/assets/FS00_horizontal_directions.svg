<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Δύο οριζόντιες διευθύνσεις</title><desc id="desc">Κάτοψη προς Α και Π1, η διαφορά των διευθύνσεων ορίζει γωνία β.</desc><rect width="800" height="420" rx="18" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#20394b} .lab{font-size:20px;font-weight:bold} .sub{font-size:16px} .ok{stroke:#25816b;stroke-width:5;fill:none} .bad{stroke:#bf5348;stroke-width:5;fill:none} .thin{stroke:#637b8e;stroke-width:3;fill:none} .dash{stroke-dasharray:8 8} .pt{fill:#2873a5;stroke:white;stroke-width:3}</style><circle cx="180" cy="325" r="12" fill="#2873a5" stroke="white" stroke-width="3"/><circle cx="125" cy="75" r="9" fill="#2873a5" stroke="white" stroke-width="3"/><circle cx="600" cy="130" r="9" fill="#2873a5" stroke="white" stroke-width="3"/><path d="M180 325 L125 75" class="thin"/><path d="M180 325 L600 130" class="thin"/><path d="M165 257 A70 70 0 0 1 244 295" stroke="#25816b" stroke-width="5" fill="none"/><text x="205" y="261" class="lab">β</text><text x="67" y="53" class="lab">Α — οπισθοσκόπευση</text><text x="577" y="102" class="lab">Π1 — στόχος</text><text x="122" y="369" class="lab">Σ1 — στάση</text><text x="235" y="395" class="sub">β = διαφορά οριζόντιων διευθύνσεων</text></svg>