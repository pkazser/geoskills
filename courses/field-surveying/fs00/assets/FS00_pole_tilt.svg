<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" role="img" aria-labelledby="title desc"><title id="title">Κατακόρυφο και κεκλιμένο κοντάρι</title><desc id="desc">Συγκρίνει κατακόρυφη και κεκλιμένη θέση κονταριού και δείχνει γιατί η θέση του στόχου επηρεάζει τη μέτρηση.</desc><rect width="700" height="410" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:21px;font-weight:bold}.s{font-size:16px}</style><line x1="25" y1="340" x2="675" y2="340" stroke="#64748b" stroke-width="3"/><line x1="175" y1="340" x2="175" y2="93" stroke="#657b8e" stroke-width="9"/><circle cx="175" cy="93" r="18" fill="#dba44e"/><circle cx="175" cy="340" r="8" fill="#cf6552"/><text x="130" y="55" class="t">Κατακόρυφο</text><line x1="480" y1="340" x2="557" y2="106" stroke="#657b8e" stroke-width="9"/><circle cx="557" cy="106" r="18" fill="#dba44e"/><circle cx="480" cy="340" r="8" fill="#cf6552"/><line x1="480" y1="340" x2="480" y2="100" stroke="#b45e4d" stroke-width="3" stroke-dasharray="8 8"/><line x1="480" y1="95" x2="557" y2="95" stroke="#b45e4d" stroke-width="3"/><text x="454" y="55" class="t">Κεκλιμένο</text><text x="489" y="76" class="s">Μετατόπιση</text></svg>