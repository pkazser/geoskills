<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Σφάλμα προσανατολισμού</title><desc id="desc">Σχηματική κάτοψη σωστής και λανθασμένης αναφοράς, με διαφορετική θέση σημείου.</desc><rect width="800" height="420" rx="18" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#20394b} .lab{font-size:20px;font-weight:bold} .sub{font-size:16px} .ok{stroke:#25816b;stroke-width:5;fill:none} .bad{stroke:#bf5348;stroke-width:5;fill:none} .thin{stroke:#637b8e;stroke-width:3;fill:none} .dash{stroke-dasharray:8 8} .pt{fill:#2873a5;stroke:white;stroke-width:3}</style><text x="110" y="46" class="lab">Ορθή αναφορά</text><text x="523" y="46" class="lab">Λάθος αναφορά</text><circle cx="125" cy="314" r="9" fill="#2873a5" stroke="white" stroke-width="3"/><circle cx="195" cy="102" r="9" fill="#d7a148" stroke="white" stroke-width="3"/><circle cx="310" cy="210" r="9" fill="#2873a5" stroke="white" stroke-width="3"/><path d="M125 314 L195 102" class="ok"/><path d="M125 314 L310 210" class="ok"/><text x="102" y="350" class="lab">Σ1</text><text x="184" y="86" class="lab">Α</text><text x="310" y="190" class="lab">Π1</text><circle cx="507" cy="314" r="9" fill="#2873a5" stroke="white" stroke-width="3"/><circle cx="577" cy="102" r="9" fill="#d7a148" stroke="white" stroke-width="3"/><circle cx="689" cy="245" r="9" fill="#bf5348" stroke="white" stroke-width="3"/><path d="M507 314 L577 102" class="thin dash"/><path d="M507 314 L689 245" class="bad"/><text x="486" y="350" class="lab">Σ1</text><text x="570" y="86" class="lab">Α</text><text x="675" y="225" class="lab">Π1′</text><text x="459" y="399" class="sub">Σχηματική περιστροφή αποτελεσμάτων</text></svg>