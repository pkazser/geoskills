<title id="title">FS00.7-P03 — GNSS κατάσταση σημείου</title><desc id="desc">Συνθετική εκπαιδευτική απεικόνιση · receiver/software/model δεν προσδιορίζονται.</desc><defs><style>
text{font-family:Arial,'Segoe UI',sans-serif;fill:#17202a}.h{font-size:30px;font-weight:700}.sub{font-size:18px}.screen{fill:#f7f9fb;stroke:#657786;stroke-width:3}.bar{fill:#183b56}.bartext{fill:#fff;font-size:22px;font-weight:700}.field{fill:#fff;stroke:#9aa7b2;stroke-width:2}.fl{font-size:18px}.fv{font-size:20px;font-weight:700}.small{font-size:16px}.button{fill:#e7f0f8;stroke:#0b5cab;stroke-width:2}.warn{fill:#fff3cd;stroke:#b58105;stroke-width:2}.green{fill:#dff3e5;stroke:#2e8b57;stroke-width:2}
</style></defs><rect width="1200" height="760" fill="#f4f7f9"/><text x="40" y="48" class="h">FS00.7-P03 — GNSS κατάσταση σημείου</text><text x="40" y="78" class="sub">Συνθετική εκπαιδευτική απεικόνιση · receiver/software/model δεν προσδιορίζονται.</text><rect x="85" y="115" width="1030" height="560" rx="18" class="screen"/><rect x="85" y="115" width="1030" height="66" rx="18" class="bar"/><text x="115" y="157" class="bartext">ΕΝΔΕΙΚΤΙΚΟ ΠΕΡΙΒΑΛΛΟΝ ΕΡΓΑΣΙΑΣ</text>
<text x="125" y="225" class="fl">Κατάσταση GNSS σημείου</text>
<rect x="125" y="250" width="285" height="72" rx="8" class="field"/><text x="145" y="280" class="fl">Point ID</text><text x="145" y="308" class="fv">P-103 (ενδεικτικό)</text>
<rect x="445" y="250" width="285" height="72" rx="8" class="field"/><text x="465" y="280" class="fl">Antenna type</text><text x="465" y="308" class="fv">Pole (ενδεικτικό)</text>
<rect x="765" y="250" width="265" height="72" rx="8" class="field"/><text x="785" y="280" class="fl">Antenna height</text><text x="785" y="308" class="fv">2.000 m (ενδεικτικό)</text>
<rect x="125" y="355" width="285" height="72" rx="8" class="field"/><text x="145" y="385" class="fl">Corrections</text><text x="145" y="413" class="fv">Network RTK</text>
<rect x="445" y="355" width="285" height="72" rx="8" class="green"/><text x="465" y="385" class="fl">Solution status</text><text x="465" y="413" class="fv">FIX (ενδεικτικό)</text>
<rect x="765" y="355" width="265" height="72" rx="8" class="field"/><text x="785" y="385" class="fl">Quality</text><text x="785" y="413" class="fv">PDOP 1.4 · 18 sat</text>
<text x="125" y="500" class="small">Σκοπός: αναγνώριση των πεδίων point ID, κεραίας, corrections, solution status και quality indicators.</text><rect x="115" y="615" width="970" height="38" rx="8" class="warn"/><text x="135" y="640" class="small">ΟΛΕΣ ΟΙ ΤΙΜΕΣ ΚΑΙ ΟΙ ΕΠΙΛΟΓΕΣ ΕΙΝΑΙ ΕΝΔΕΙΚΤΙΚΕΣ — ΟΧΙ ΠΡΑΓΜΑΤΙΚΟ UI ΣΥΓΚΕΚΡΙΜΕΝΟΥ ΚΑΤΑΣΚΕΥΑΣΤΗ.</text></svg>
