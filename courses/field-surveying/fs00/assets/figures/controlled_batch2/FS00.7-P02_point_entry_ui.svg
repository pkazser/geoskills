<title id="title">FS00.7-P02 — Καταχώριση σημείου</title><desc id="desc">Συνθετική εκπαιδευτική απεικόνιση · τα πεδία είναι ενδεικτικά.</desc><defs><style>
text{font-family:Arial,'Segoe UI',sans-serif;fill:#17202a}.h{font-size:30px;font-weight:700}.sub{font-size:18px}.screen{fill:#f7f9fb;stroke:#657786;stroke-width:3}.bar{fill:#183b56}.bartext{fill:#fff;font-size:22px;font-weight:700}.field{fill:#fff;stroke:#9aa7b2;stroke-width:2}.fl{font-size:18px}.fv{font-size:20px;font-weight:700}.small{font-size:16px}.button{fill:#e7f0f8;stroke:#0b5cab;stroke-width:2}.warn{fill:#fff3cd;stroke:#b58105;stroke-width:2}.green{fill:#dff3e5;stroke:#2e8b57;stroke-width:2}
</style></defs><rect width="1200" height="760" fill="#f4f7f9"/><text x="40" y="48" class="h">FS00.7-P02 — Καταχώριση σημείου</text><text x="40" y="78" class="sub">Συνθετική εκπαιδευτική απεικόνιση · τα πεδία είναι ενδεικτικά.</text><rect x="85" y="115" width="1030" height="560" rx="18" class="screen"/><rect x="85" y="115" width="1030" height="66" rx="18" class="bar"/><text x="115" y="157" class="bartext">ΕΝΔΕΙΚΤΙΚΟ ΠΕΡΙΒΑΛΛΟΝ ΕΡΓΑΣΙΑΣ</text>
<text x="125" y="225" class="fl">Καταχώριση νέου σημείου</text>
<rect x="125" y="250" width="430" height="70" rx="8" class="field"/><text x="150" y="280" class="fl">Point ID</text><text x="150" y="307" class="fv">P-103 (ενδεικτικό)</text>
<rect x="600" y="250" width="430" height="70" rx="8" class="field"/><text x="625" y="280" class="fl">Κωδικός</text><text x="625" y="307" class="fv">Φ01 (ενδεικτικό)</text>
<rect x="125" y="350" width="430" height="70" rx="8" class="field"/><text x="150" y="380" class="fl">Αντικείμενο</text><text x="150" y="407" class="fv">Φωτιστικό (ενδεικτικό)</text>
<rect x="600" y="350" width="430" height="70" rx="8" class="field"/><text x="625" y="380" class="fl">Κατάσταση</text><text x="625" y="407" class="fv">Προς έλεγχο</text>
<text x="125" y="500" class="small">Σκοπός: έλεγχος ότι Point ID, αντικείμενο και κωδικός συμφωνούν πριν από την αποθήκευση.</text><rect x="115" y="615" width="970" height="38" rx="8" class="warn"/><text x="135" y="640" class="small">ΟΛΕΣ ΟΙ ΤΙΜΕΣ ΚΑΙ ΟΙ ΕΠΙΛΟΓΕΣ ΕΙΝΑΙ ΕΝΔΕΙΚΤΙΚΕΣ — ΟΧΙ ΠΡΑΓΜΑΤΙΚΟ UI ΣΥΓΚΕΚΡΙΜΕΝΟΥ ΚΑΤΑΣΚΕΥΑΣΤΗ.</text></svg>
