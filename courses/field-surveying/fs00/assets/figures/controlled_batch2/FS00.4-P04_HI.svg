<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#fff"/><rect width="1200" height="85" fill="#e8f1f8"/><defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#22354a}.h{font-size:25px;font-weight:bold}.s{font-size:17px}.tiny{font-size:14px}.note{font-size:16px;fill:#62552e}.line{stroke:#25486c;stroke-width:4;fill:none}.dash{stroke:#d35a3c;stroke-width:3;stroke-dasharray:7 5;fill:none}.ground{stroke:#3c5364;stroke-width:5}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#d35a3c" stroke-width="1.7"/></marker></defs><text class="h" x="38" y="53">FS00.4-P04 — Ύψος οργάνου (HI)</text><text class="s" x="55" y="128">Γενική έννοια ύψους οργάνου — όχι φωτογραφία πραγματικού οργάνου</text><line x1="85" y1="488" x2="750" y2="488" class="ground"/><path d="M385 247 L250 488 M385 247 L530 488" class="line"/><rect x="310" y="188" width="150" height="63" rx="10" fill="#d4e7f8" stroke="#25486c" stroke-width="3"/><circle cx="385" cy="220" r="8" fill="#d35a3c"/><line x1="385" y1="220" x2="385" y2="488" stroke="#25486c" stroke-dasharray="8 7" stroke-width="2"/><circle cx="385" cy="488" r="8" fill="#d35a3c"/><line x1="160" y1="220" x2="160" y2="488" stroke="#d35a3c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="147" y1="220" x2="380" y2="220" class="dash"/><line x1="147" y1="488" x2="380" y2="488" class="dash"/><text class="h" x="105" y="365">HI</text><text class="s" x="408" y="477">Σημείο στάσης</text><text class="tiny" x="480" y="208">Σημείο αναγωγής οργάνου</text><rect x="780" y="183" width="365" height="282" rx="12" fill="#f5f8fb" stroke="#b1cbdc"/><text class="s" x="800" y="222">Το HI εξαρτάται από:</text><text class="s" x="800" y="269">• σημείο αναφοράς οργάνου</text><text class="s" x="800" y="309">• μέθοδο μέτρησης</text><text class="s" x="800" y="349">• πιθανή μετατροπή</text><text class="s" x="818" y="377">  κεκλιμένου ύψους</text><text class="s" x="800" y="423">• οδηγίες κατασκευαστή</text><rect x="35" y="588" width="1130" height="75" rx="10" fill="#fff4d7"/><text class="note" x="53" y="617">Η κόκκινη διάσταση είναι εννοιολογική, όχι σημείο τοποθέτησης μετροταινίας.</text><text class="note" x="53" y="647">Για πραγματική μέτρηση απαιτείται το σημείο και η διαδικασία του συγκεκριμένου μοντέλου.</text></svg>