<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#fff"/><rect width="1200" height="85" fill="#e8f1f8"/><defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#22354a}.h{font-size:25px;font-weight:bold}.s{font-size:17px}.tiny{font-size:14px}.note{font-size:16px;fill:#62552e}.line{stroke:#25486c;stroke-width:4;fill:none}.dash{stroke:#d35a3c;stroke-width:3;stroke-dasharray:7 5;fill:none}.ground{stroke:#3c5364;stroke-width:5}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#d35a3c" stroke-width="1.7"/></marker></defs><text class="h" x="38" y="53">FS00.4-P05 — Ύψος στόχου (HR)</text><text class="s" x="55" y="130">Ύψος στόχου: από το σημείο εδάφους έως το κέντρο αναφοράς του πρίσματος</text><line x1="85" y1="490" x2="740" y2="490" class="ground"/><line x1="400" y1="230" x2="400" y2="490" stroke="#63788c" stroke-width="19"/><rect x="339" y="174" width="122" height="85" fill="#ffdeaa" stroke="#25486c" stroke-width="4"/><circle cx="400" cy="218" r="23" fill="#b9ebff" stroke="#25486c" stroke-width="4"/><circle cx="400" cy="218" r="5" fill="#d35a3c"/><circle cx="400" cy="490" r="8" fill="#d35a3c"/><line x1="190" y1="218" x2="190" y2="490" stroke="#d35a3c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="193" y1="218" x2="392" y2="218" class="dash"/><line x1="193" y1="490" x2="393" y2="490" class="dash"/><text class="h" x="137" y="365">HR</text><text class="s" x="431" y="204">Κέντρο πρίσματος</text><text class="s" x="430" y="481">Σημείο εδάφους</text><rect x="773" y="183" width="375" height="294" rx="12" fill="#f5f8fb" stroke="#b1cbdc"/><text class="s" x="796" y="227">Ελέγχουμε:</text><text class="s" x="796" y="274">• το κέντρο αναφοράς στόχου</text><text class="s" x="796" y="315">• το πραγματικό HR</text><text class="s" x="796" y="357">• την τιμή στο χειριστήριο</text><text class="s" x="796" y="399">• κάθε αλλαγή ύψους</text><text class="tiny" x="796" y="447">Δεν αρκεί το ονομαστικό</text><text class="tiny" x="796" y="469">μήκος του κονταριού.</text><rect x="35" y="588" width="1130" height="75" rx="10" fill="#fff4d7"/><text class="note" x="53" y="617">Σχηματικό εκπαιδευτικό παράδειγμα — δεν απεικονίζει συγκεκριμένο πρίσμα.</text><text class="note" x="53" y="647">Ο τρόπος αναγωγής / οι offsets διαφέρουν ανά στόχο και εξοπλισμό.</text></svg>