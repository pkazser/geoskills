<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-label="Συνθετικό εκπαιδευτικό σχέδιο χώρου με κτίριο, πεζοδρόμιο, πράσινο, φωτιστικά και φρεάτιο, χωρίς κλίμακα ή συντεταγμένες">
<rect width="1400" height="980" fill="#f6f8fb"/>
<rect x="32" y="28" width="1336" height="922" rx="18" fill="white" stroke="#b9c8d7" stroke-width="2"/>
<rect x="32" y="28" width="1336" height="98" rx="18" fill="#1d3653"/><rect x="32" y="90" width="1336" height="36" fill="#1d3653"/>
<text x="72" y="78" font-size="36" fill="white" font-family="DejaVu Sans" font-weight="bold">FS00.1-P02 — Εκπαιδευτικό σχέδιο χώρου</text>
<text x="72" y="112" font-size="19" fill="#e2ebf3" font-family="DejaVu Sans">Συνθετική αναπαράσταση χαρακτηριστικών αντικειμένων — όχι αποτέλεσμα αποτύπωσης</text>
<rect x="70" y="154" width="920" height="700" fill="#eaf4e5" stroke="#9fafa6" stroke-width="3"/>
<!-- landscape trees -->
<g fill="#9bc989" stroke="#447d55" stroke-width="3"><circle cx="133" cy="230" r="45"/><circle cx="160" cy="655" r="39"/><circle cx="897" cy="222" r="41"/><circle cx="906" cy="771" r="42"/></g>
<g fill="#3f734b"><circle cx="133" cy="230" r="6"/><circle cx="160" cy="655" r="6"/><circle cx="897" cy="222" r="6"/><circle cx="906" cy="771" r="6"/></g>
<!-- building rectangle and extensions -->
<path d="M255 205 H725 V504 H255 Z" fill="#cad2d9" stroke="#2e4053" stroke-width="7"/>
<path d="M255 205 H725 V504 H255 Z" fill="url(#buildingHatch)" opacity=".30"/>
<defs><pattern id="buildingHatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#ffffff" stroke-width="2"/></pattern><pattern id="pavers" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 0H36V36H0Z" stroke="#c9c3b7" stroke-width="1" fill="none"/></pattern></defs>
<text x="490" y="342" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="34" fill="#20354d">ΚΤΙΡΙΟ</text>
<text x="490" y="383" text-anchor="middle" font-family="DejaVu Sans" font-size="19" fill="#425264">Περίγραμμα κτιρίου</text>
<!-- sidewalk winding at right and front -->
<path d="M770 153 H874 L855 548 L728 668 L403 802 L245 855 H70 V747 L349 696 L682 562 L760 485 Z" fill="#e4e0d8" stroke="#777d84" stroke-width="5" stroke-linejoin="round"/>
<path d="M770 153 H874 L855 548 L728 668 L403 802 L245 855 H70 V747 L349 696 L682 562 L760 485 Z" fill="url(#pavers)"/>
<!-- grass zone -->
<path d="M255 532 H684 L350 669 L70 716 V510 H203 V532Z" fill="#a4d69a" stroke="#438a55" stroke-width="3"/>
<text x="320" y="603" font-size="24" font-family="DejaVu Sans" fill="#2b6040" font-weight="bold">ΧΩΡΟΣ ΠΡΑΣΙΝΟΥ</text>
<!-- lamp posts as plan markers -->
<g stroke="#ab7316" stroke-width="4" fill="#ffdf80"><circle cx="643" cy="730" r="18"/><path d="M628 715L658 745M658 715L628 745"/><circle cx="897" cy="485" r="18"/><path d="M882 470L912 500M912 470L882 500"/></g>
<text x="612" y="772" font-family="DejaVu Sans" font-size="19" font-weight="bold">Φ1</text>
<text x="915" y="486" font-family="DejaVu Sans" font-size="19" font-weight="bold">Φ2</text>
<!-- manhole -->
<circle cx="741" cy="603" r="23" fill="#f9f9f9" stroke="#394b5c" stroke-width="4"/>
<path d="M726 588L756 618 M756 588L726 618" stroke="#394b5c" stroke-width="3"/>
<text x="769" y="607" font-family="DejaVu Sans" font-size="19" font-weight="bold">ΦΡ1</text>
<!-- characteristic example points -->
<g fill="#d9493e" stroke="white" stroke-width="3"><circle cx="255" cy="205" r="9"/><circle cx="725" cy="205" r="9"/><circle cx="725" cy="504" r="9"/><circle cx="255" cy="504" r="9"/><circle cx="682" cy="562" r="9"/><circle cx="403" cy="802" r="9"/></g>
<g font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#9a2e28"><text x="225" y="183">Κ1</text><text x="729" y="185">Κ2</text><text x="732" y="522">Κ3</text><text x="217" y="524">Κ4</text><text x="647" y="553">Π1</text><text x="371" y="825">Π2</text></g>
<!-- no scale north arrow only indicative -->
<g transform="translate(1054 166)"><path d="M0 75 L26 0 L52 75 L26 58Z" fill="#233e59"/><text x="26" y="101" text-anchor="middle" font-family="DejaVu Sans" font-size="22">Β</text></g>
<rect x="1022" y="298" width="318" height="365" rx="12" fill="#f3f6fa" stroke="#c5d0da" stroke-width="2"/>
<text x="1044" y="342" font-family="DejaVu Sans" font-weight="bold" font-size="27" fill="#1d3653">Υπόμνημα</text>
<rect x="1046" y="376" width="31" height="23" fill="#cad2d9" stroke="#2e4053" stroke-width="3"/><text x="1092" y="396" font-family="DejaVu Sans" font-size="19">Κτίριο</text>
<rect x="1046" y="421" width="31" height="23" fill="#e4e0d8" stroke="#777d84" stroke-width="2"/><text x="1092" y="441" font-family="DejaVu Sans" font-size="19">Πεζοδρόμιο</text>
<rect x="1046" y="466" width="31" height="23" fill="#a4d69a" stroke="#438a55" stroke-width="2"/><text x="1092" y="486" font-family="DejaVu Sans" font-size="19">Χώρος πρασίνου</text>
<circle cx="1062" cy="529" r="10" fill="#d9493e"/><text x="1092" y="535" font-family="DejaVu Sans" font-size="18">Χαρακτηριστικό σημείο</text>
<circle cx="1062" cy="576" r="11" fill="#ffdf80" stroke="#ab7316" stroke-width="3"/><text x="1092" y="582" font-family="DejaVu Sans" font-size="19">Φωτιστικό</text>
<circle cx="1062" cy="623" r="11" fill="white" stroke="#394b5c" stroke-width="3"/><text x="1092" y="629" font-family="DejaVu Sans" font-size="19">Φρεάτιο</text>
<rect x="1022" y="695" width="318" height="157" rx="12" fill="#fff5e3" stroke="#e2bc78" stroke-width="2"/>
<text x="1043" y="734" font-family="DejaVu Sans" font-size="21" fill="#775315" font-weight="bold">Προσοχή</text>
<text x="1043" y="770" font-family="DejaVu Sans" font-size="18" fill="#775315">Χωρίς κλίμακα ή συντεταγμένες.</text>
<text x="1043" y="802" font-family="DejaVu Sans" font-size="18" fill="#775315">Οι κωδικοί είναι ενδεικτικοί.</text>
<text x="1043" y="830" font-family="DejaVu Sans" font-size="17" fill="#775315">Δεν απεικονίζονται μετρήσεις.</text>
<text x="73" y="912" font-family="DejaVu Sans" font-size="21" fill="#496176">FS00 · Εικονογραφικό παράδειγμα για αναγνώριση αντικειμένων και χαρακτηριστικών σημείων</text>
</svg>
