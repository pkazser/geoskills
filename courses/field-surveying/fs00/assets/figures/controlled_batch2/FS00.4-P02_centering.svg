<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#fff"/><rect width="1200" height="85" fill="#e8f1f8"/><defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#22354a}.h{font-size:25px;font-weight:bold}.s{font-size:17px}.tiny{font-size:14px}.note{font-size:16px;fill:#62552e}.line{stroke:#25486c;stroke-width:4;fill:none}.dash{stroke:#d35a3c;stroke-width:3;stroke-dasharray:7 5;fill:none}.ground{stroke:#3c5364;stroke-width:5}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#d35a3c" stroke-width="1.7"/></marker></defs><text class="h" x="38" y="53">FS00.4-P02 — Κέντρωση πάνω από σημείο στάσης</text><text class="s" x="55" y="123">Πλευρική όψη — εννοιολογικό σχήμα</text><line x1="70" y1="491" x2="720" y2="491" class="ground"/><path d="M395 235 L260 491 M395 235 L530 491" class="line"/><rect x="331" y="205" width="128" height="49" rx="8" fill="#d4e7f8" stroke="#25486c" stroke-width="3"/><rect x="369" y="162" width="53" height="44" rx="7" fill="#e2af54" stroke="#25486c" stroke-width="3"/><line x1="395" y1="255" x2="395" y2="491" class="dash"/><circle cx="395" cy="491" r="11" fill="#d35a3c"/><text class="s" x="417" y="476">Σημείο στάσης Σ</text><text class="s" x="420" y="335">Κατακόρυφος άξονας</text><path d="M420 341 L398 352" class="line"/><rect x="755" y="180" width="390" height="285" rx="12" fill="#f5f8fb" stroke="#b1cbdc"/><text class="s" x="777" y="230">Σκοπός της κέντρωσης</text><text class="s" x="777" y="276">Ο κατακόρυφος άξονας</text><text class="s" x="777" y="313">του οργάνου να διέρχεται</text><text class="s" x="777" y="350">από το σημείο στάσης.</text><text class="tiny" x="777" y="414">Έλεγχος με οπτικό / laser</text><text class="tiny" x="777" y="439">κέντρωσης, κατά το όργανο.</text><rect x="35" y="588" width="1130" height="75" rx="10" fill="#fff4d7"/><text class="note" x="53" y="617">Συνθετικό εννοιολογικό σχήμα — δεν αποτελεί οδηγία χειρισμού συγκεκριμένου μοντέλου.</text><text class="note" x="53" y="647">Η κέντρωση και η οριζοντίωση ελέγχονται χωριστά, σύμφωνα με το εγχειρίδιο.</text></svg>