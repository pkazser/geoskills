<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#fff"/><rect width="1200" height="85" fill="#e8f1f8"/><defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#22354a}.h{font-size:25px;font-weight:bold}.s{font-size:17px}.tiny{font-size:14px}.note{font-size:16px;fill:#62552e}.line{stroke:#25486c;stroke-width:4;fill:none}.dash{stroke:#d35a3c;stroke-width:3;stroke-dasharray:7 5;fill:none}.ground{stroke:#3c5364;stroke-width:5}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#d35a3c" stroke-width="1.7"/></marker></defs><text class="h" x="38" y="53">FS00.4-P06 — Ύψος κεραίας GNSS</text><text class="s" x="55" y="126">Ύψος κονταριού GNSS και αναγωγή στη θέση κεραίας</text><line x1="85" y1="501" x2="725" y2="501" class="ground"/><line x1="389" y1="290" x2="389" y2="501" stroke="#63788c" stroke-width="20"/><ellipse cx="389" cy="259" rx="110" ry="37" fill="#f3f3ee" stroke="#25486c" stroke-width="4"/><rect x="339" y="268" width="100" height="27" rx="8" fill="#e2af54" stroke="#25486c" stroke-width="3"/><circle cx="389" cy="286" r="6" fill="#d35a3c"/><line x1="167" y1="286" x2="167" y2="501" stroke="#d35a3c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="170" y1="286" x2="382" y2="286" class="dash"/><line x1="170" y1="501" x2="382" y2="501" class="dash"/><text class="h" x="100" y="406">h(ARP)</text><text class="s" x="507" y="278">ARP (σχηματικά)</text><path d="M501 283 L397 286" class="line"/><rect x="761" y="180" width="385" height="316" rx="12" fill="#f5f8fb" stroke="#b1cbdc"/><text class="s" x="783" y="225">ARP: φυσικό σημείο αναφοράς</text><text class="s" x="783" y="267">APC: κέντρο φάσης (μοντέλο)</text><text class="s" x="783" y="315">Το APC δεν προσδιορίζεται</text><text class="s" x="783" y="350">οπτικά από το περίβλημα.</text><text class="s" x="783" y="402">Η ρύθμιση ύψους εξαρτάται</text><text class="s" x="783" y="437">από δέκτη και λογισμικό.</text><rect x="35" y="588" width="1130" height="75" rx="10" fill="#fff4d7"/><text class="note" x="53" y="617">Εννοιολογική απεικόνιση. Δεν σημειώνεται αυθαίρετα θέση APC στο σώμα της κεραίας.</text><text class="note" x="53" y="647">Η ακριβής αναφορά ARP, οι offsets και το πεδίο καταχώρισης ελέγχονται από το εγχειρίδιο.</text></svg>