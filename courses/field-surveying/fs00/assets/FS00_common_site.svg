<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" role="img" aria-labelledby="title desc"><title id="title">Κοινό συνθετικό σκαρίφημα χώρου FS00</title><desc id="desc">Δείχνει το μικρό κτίριο, το πεζοδρόμιο, το πράσινο, τα δύο φωτιστικά και το φρεάτιο του κοινού εκπαιδευτικού σεναρίου· οι υποψήφιες στάσεις δεν είναι γνωστά ή ασφαλή σημεία.</desc><rect width="700" height="410" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:21px;font-weight:bold}.s{font-size:16px}</style><rect x="25" y="35" width="650" height="345" rx="12" fill="#edf6e9" stroke="#89a88c" stroke-width="2"/><rect x="55" y="60" width="225" height="125" fill="#b9ccdc" stroke="#607b94" stroke-width="3"/><text x="145" y="128" class="t">Κτίριο</text><rect x="400" y="59" width="210" height="124" rx="14" fill="#bbdbad" stroke="#679264" stroke-width="2"/><text x="444" y="125" class="t">Πράσινο</text><rect x="30" y="225" width="640" height="60" fill="#cfbea8"/><text x="457" y="257" class="s">Πεζοδρόμιο</text><circle cx="148" cy="329" r="12" fill="#ecaa45"/><text x="170" y="335" class="s">Φ1</text><circle cx="333" cy="328" r="12" fill="#ecaa45"/><text x="355" y="334" class="s">Φ2</text><rect x="475" y="310" width="26" height="26" fill="#718096"/><text x="509" y="330" class="s">Φρεάτιο</text><circle cx="250" cy="310" r="12" fill="#4179ad"/><text x="209" y="365" class="s">Θέση Α (υποψήφια)</text><circle cx="605" cy="335" r="12" fill="#9e6a44"/><text x="506" y="367" class="s">Θέση Β (υποψήφια)</text></svg>