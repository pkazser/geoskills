<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="title desc"><title id="title">FS00.4-P04 — προσωρινό SVG υποκατάστατο</title><desc id="desc">Προσωρινή σχηματική αναπαράσταση και όχι πραγματική φωτογραφία. Η απαιτούμενη εικόνα είναι: Μετροταινία στο σημείο μέτρησης HI για το πραγματικό όργανο, με σαφή ένδειξη από πού έως πού.</desc>
