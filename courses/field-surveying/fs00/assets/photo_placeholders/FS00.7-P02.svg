<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="title desc"><title id="title">FS00.7-P02 — προσωρινό SVG υποκατάστατο</title><desc id="desc">Προσωρινή σχηματική αναπαράσταση και όχι πραγματική φωτογραφία. Η απαιτούμενη εικόνα είναι: Χειριστήριο και καταχώριση σημείου, χωρίς στοιχεία λογαριασμών ή προσωπικά δεδομένα.</desc>
