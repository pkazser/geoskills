<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="title desc"><title id="title">FS00.4-P06 — προσωρινό SVG υποκατάστατο</title><desc id="desc">Προσωρινή σχηματική αναπαράσταση και όχι πραγματική φωτογραφία. Η απαιτούμενη εικόνα είναι: GNSS κοντάρι και ένδειξη ύψους, δεύτερο καρέ με τη ρύθμιση antenna height στο χειριστήριο. Η αντιστοίχιση να ελεγχθεί από συνάδελφο και εγχειρίδιο συσκευής.</desc>
