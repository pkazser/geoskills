<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="title desc"><title id="title">FS00.6-P01 — προσωρινό SVG υποκατάστατο</title><desc id="desc">Προσωρινή σχηματική αναπαράσταση και όχι πραγματική φωτογραφία. Η απαιτούμενη εικόνα είναι: Σταθερός τρίποδας σε ασφαλές επίπεδο, χωρίς να υπονοείται ότι το επίπεδο έδαφος αρκεί για την ορθή εγκατάσταση.</desc>
