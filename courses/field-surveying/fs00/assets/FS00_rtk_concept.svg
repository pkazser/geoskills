<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">GNSS και RTK</title><desc id="desc">Δορυφορικές παρατηρήσεις προς δίκτυο αναφοράς και rover, μετά έλεγχος θέσης.</desc><rect width="800" height="420" rx="18" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#20394b} .lab{font-size:20px;font-weight:bold} .sub{font-size:16px} .ok{stroke:#25816b;stroke-width:5;fill:none} .bad{stroke:#bf5348;stroke-width:5;fill:none} .thin{stroke:#637b8e;stroke-width:3;fill:none} .dash{stroke-dasharray:8 8} .pt{fill:#2873a5;stroke:white;stroke-width:3}</style><text x="280" y="45" class="lab">Δορυφόροι GNSS</text><circle cx="330" cy="77" r="11" fill="#b38d45" stroke="white" stroke-width="3"/><circle cx="400" cy="77" r="11" fill="#b38d45" stroke="white" stroke-width="3"/><circle cx="470" cy="77" r="11" fill="#b38d45" stroke="white" stroke-width="3"/><path d="M340 90 L175 198" class="thin dash"/><path d="M450 90 L610 198" class="thin dash"/><rect x="60" y="185" width="260" height="90" rx="12" fill="#e5edf3" stroke="#7b9aab"/><text x="90" y="217" class="lab">Δίκτυο αναφοράς</text><text x="99" y="244" class="sub">δεδομένα / διορθώσεις</text><rect x="495" y="185" width="250" height="90" rx="12" fill="#dceee6" stroke="#6b9b88"/><text x="545" y="217" class="lab">GNSS Rover</text><text x="530" y="244" class="sub">λήψη σημάτων</text><path d="M320 236 L490 236" class="ok dash"/><text x="342" y="223" class="sub">διορθώσεις</text><path d="M620 275 L620 315" class="ok"/><rect x="445" y="320" width="300" height="72" rx="12" fill="#f1ebdc" stroke="#ab996d"/><text x="484" y="349" class="lab">Έλεγχος θέσης</text><text x="482" y="376" class="sub">Fixed ≠ εγγύηση ορθότητας</text></svg>