<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="295" viewBox="0 0 1100 295"><rect width="1100" height="295" rx="18" fill="#fff"/><text x="32" y="38" font-family="DejaVu Sans,Arial" font-size="24" font-weight="bold" fill="#183f57">F05-F · Πέντε έλεγχοι πριν από το πραγματικό σχέδιο πτήσης</text><g font-family="DejaVu Sans,Arial"><rect x="32" y="76" width="188" height="118" rx="13" fill="#f3f8fc" stroke="#9cbdd2" stroke-width="2"/><circle cx="59" cy="100" r="17" fill="#16648b"/><text x="59" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="white">01</text><text x="44" y="138" font-size="15" font-weight="700" fill="#153e56">Στόχος &amp; GSD</text><text x="44" y="163" font-size="12.5" fill="#405669">Τι προϊόν χρειάζεται;</text><path d="M 222 133 h 12" stroke="#28758d" stroke-width="3"/><path d="M 234 133 l -7 -5 v 10 z" fill="#28758d"/><rect x="237" y="76" width="188" height="118" rx="13" fill="#f3f8fc" stroke="#9cbdd2" stroke-width="2"/><circle cx="264" cy="100" r="17" fill="#16648b"/><text x="264" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="white">02</text><text x="249" y="138" font-size="15" font-weight="700" fill="#153e56">Κάμερα &amp; έδαφος</text><text x="249" y="163" font-size="12.5" fill="#405669">Ισχύουν οι παραδοχές;</text><path d="M 427 133 h 12" stroke="#28758d" stroke-width="3"/><path d="M 439 133 l -7 -5 v 10 z" fill="#28758d"/><rect x="442" y="76" width="188" height="118" rx="13" fill="#f3f8fc" stroke="#9cbdd2" stroke-width="2"/><circle cx="469" cy="100" r="17" fill="#16648b"/><text x="469" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="white">03</text><text x="454" y="138" font-size="15" font-weight="700" fill="#153e56">Επικάλυψη</text><text x="454" y="163" font-size="12.5" fill="#405669">Ελέγχθηκαν τα όρια;</text><path d="M 632 133 h 12" stroke="#28758d" stroke-width="3"/><path d="M 644 133 l -7 -5 v 10 z" fill="#28758d"/><rect x="647" y="76" width="188" height="118" rx="13" fill="#f3f8fc" stroke="#9cbdd2" stroke-width="2"/><circle cx="674" cy="100" r="17" fill="#16648b"/><text x="674" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="white">04</text><text x="659" y="138" font-size="15" font-weight="700" fill="#153e56">Χρόνος</text><text x="659" y="163" font-size="12.5" fill="#405669">Εφικτή η πτήση;</text><path d="M 837 133 h 12" stroke="#28758d" stroke-width="3"/><path d="M 849 133 l -7 -5 v 10 z" fill="#28758d"/><rect x="852" y="76" width="188" height="118" rx="13" fill="#f3f8fc" stroke="#9cbdd2" stroke-width="2"/><circle cx="879" cy="100" r="17" fill="#16648b"/><text x="879" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="white">05</text><text x="864" y="138" font-size="15" font-weight="700" fill="#153e56">Εκκρεμότητες</text><text x="864" y="163" font-size="12.5" fill="#405669">Τι λείπει ακόμη;</text></g><rect x="32" y="223" width="1028" height="45" rx="10" fill="#fff1df"/><text x="48" y="251" font-family="DejaVu Sans,Arial" font-size="16" font-weight="700" fill="#825020">Αριθμητικά σωστό σχέδιο ≠ έγκριση πτήσης · καταγράφω όσα παραμένουν άγνωστα</text></svg>