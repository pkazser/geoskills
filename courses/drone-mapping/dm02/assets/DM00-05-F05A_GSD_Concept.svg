<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Σχήμα F05-A: Απόσταση κάμερας εδάφους και GSD</title><desc id="d">Σχηματικό διάγραμμα κάμερας σε δύο διαφορετικές αποστάσεις από το έδαφος, όπου η μεγαλύτερη απόσταση δημιουργεί μεγαλύτερο αποτύπωμα και μεγαλύτερο GSD για την ίδια κάμερα.</desc><rect width="1200" height="720" fill="#f8fbfc"/><text x="600" y="56" font-size="32" font-family="DejaVu Sans" fill="#18344a" text-anchor="middle" font-weight="bold">Ίδια κάμερα — διαφορετική απόσταση από το έδαφος</text><text x="600" y="94" font-size="20" font-family="DejaVu Sans" fill="#35546a" text-anchor="middle">Σχηματική σχέση ύψους, αποτυπώματος και GSD (όχι υπό κλίμακα)</text><line x1="65" y1="560" x2="1135" y2="560" stroke="#547c58" stroke-width="10"/><rect x="65" y="565" width="1070" height="46" rx="5" fill="#deebd9"/><text x="600" y="648" font-size="21" font-family="DejaVu Sans" fill="#355046" text-anchor="middle">ΕΠΙΠΕΔΟ ΕΔΑΦΟΣ — ΥΠΟΘΕΤΙΚΟ ΠΑΡΑΔΕΙΓΜΑ</text><g fill="#284e72"><rect x="260" y="217" width="85" height="38" rx="6"/><circle cx="302" cy="259" r="10"/><rect x="790" y="127" width="85" height="38" rx="6"/><circle cx="832" cy="169" r="10"/></g><g fill="#b6d8e9" opacity=".55" stroke="#5b9bbd" stroke-width="3"><polygon points="301,261 145,558 460,558"/><polygon points="832,170 565,558 1090,558"/></g><g stroke="#2b5978" stroke-width="3" stroke-dasharray="8,8"><line x1="301" y1="267" x2="301" y2="555"/><line x1="832" y1="175" x2="832" y2="555"/></g><g fill="#1f3e57" font-family="DejaVu Sans" font-size="24"><text x="300" y="180" text-anchor="middle">60 m</text><text x="950" y="155" text-anchor="middle">90 m</text><text x="300" y="695" text-anchor="middle">~1,64 cm/pixel</text><text x="835" y="695" text-anchor="middle">~2,47 cm/pixel</text></g><g stroke="#d59b42" stroke-width="6"><line x1="145" y1="553" x2="460" y2="553"/><line x1="565" y1="553" x2="1090" y2="553"/></g><g fill="#a86e29" font-family="DejaVu Sans" font-size="19"><text x="302" y="524" text-anchor="middle">Μικρότερο αποτύπωμα</text><text x="828" y="524" text-anchor="middle">Μεγαλύτερο αποτύπωμα</text></g></svg>