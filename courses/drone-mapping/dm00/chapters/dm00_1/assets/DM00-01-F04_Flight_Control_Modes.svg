<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="ttl desc">
<title id="ttl">Τρεις τρόποι καθορισμού της πορείας drone</title>
<desc id="desc">Τρεις κάρτες: χειροκίνητη πτήση με χειριστή και κατευθυνόμενες εντολές, προγραμματισμένη αποστολή με παράλληλα περάσματα, και προσαρμοστική λειτουργία με αισθητήρα και αλλαγή πορείας γύρω από εμπόδιο. Κάτω, κοινή σημείωση ότι ο ελεγκτής πτήσης σταθεροποιεί το αεροσκάφος και στις τρεις περιπτώσεις.</desc>
<defs>
<style>
text{font-family:'DejaVu Sans','Noto Sans',Arial,sans-serif;fill:#142339} .h{font-size:24px;font-weight:700} .s{font-size:19px} .note{font-size:18px} .mini{font-size:17px;font-weight:650} .stroke{stroke:#334c66;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f99" stroke-width="1.9"/></marker>
<marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b35c31" stroke-width="1.9"/></marker>
<g id="drone"><path d="M-26 -14 L26 14 M-26 14 L26 -14" class="stroke"/><rect x="-13" y="-10" width="26" height="20" rx="8" fill="#2b506c"/><circle cx="-30" cy="-18" r="17" stroke="#37617c" stroke-width="3" fill="#dceef5"/><circle cx="30" cy="18" r="17" stroke="#37617c" stroke-width="3" fill="#dceef5"/><circle cx="-30" cy="18" r="17" stroke="#37617c" stroke-width="3" fill="#dceef5"/><circle cx="30" cy="-18" r="17" stroke="#37617c" stroke-width="3" fill="#dceef5"/><path d="M0 -19 l-6 -9 h12 z" fill="#e58a3d"/></g>
</defs>
<rect width="1500" height="760" fill="#fbfcff"/>
<text x="750" y="62" font-size="31" font-weight="700" text-anchor="middle">Ποιος καθορίζει την πορεία του drone;</text>
<text x="750" y="101" font-size="20" fill="#4d6279" text-anchor="middle">Σχηματική σύγκριση τριών τρόπων λειτουργίας</text>
<!-- cards -->
<rect x="30" y="130" width="460" height="508" rx="18" fill="#eff7fc" stroke="#c5dce9" stroke-width="2"/>
<rect x="520" y="130" width="460" height="508" rx="18" fill="#eef8f1" stroke="#c9e7d0" stroke-width="2"/>
<rect x="1010" y="130" width="460" height="508" rx="18" fill="#fff7ef" stroke="#f1d9bd" stroke-width="2"/>
<text x="260" y="174" class="h" text-anchor="middle">Α · Χειροκίνητη</text>
<text x="750" y="174" class="h" text-anchor="middle">Β · Προγραμματισμένη</text>
<text x="1240" y="174" class="h" text-anchor="middle">Γ · Προσαρμοστική</text>
<!-- manual illustration -->
<g transform="translate(260,312)"><use href="#drone"/></g>
<path d="M176 425 Q245 396 300 359" fill="none" stroke="#147f99" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
<g transform="translate(150,457)"><rect x="-56" y="-28" width="112" height="56" rx="17" fill="#e0eaf2" stroke="#36546c" stroke-width="4"/><circle cx="-32" cy="1" r="6" fill="#36546c"/><circle cx="32" cy="1" r="6" fill="#36546c"/><path d="M-32 1 l-9 -22 M32 1 l8 -20" stroke="#36546c" stroke-width="4" stroke-linecap="round"/></g>
<text x="260" y="522" class="mini" text-anchor="middle">Εντολές από τον χειριστή</text>
<text x="260" y="556" class="s" text-anchor="middle">κατά τη διάρκεια της πτήσης</text>
<text x="260" y="604" class="note" text-anchor="middle">π.χ. επιλογή κάδρου</text>
<!-- programmed -->
<path d="M600 240 H892 V281 H600 V322 H892 V363 H600 V404 H892" fill="none" stroke="#147f69" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(890,404) scale(.72)"><use href="#drone"/></g>
<circle cx="600" cy="240" r="9" fill="#147f69"/><circle cx="892" cy="404" r="9" fill="#147f69"/>
<text x="750" y="522" class="mini" text-anchor="middle">Πορεία και σημεία λήψης</text>
<text x="750" y="556" class="s" text-anchor="middle">ορίζονται από πριν</text>
<text x="750" y="604" class="note" text-anchor="middle">π.χ. παράλληλα περάσματα</text>
<!-- adaptive -->
<path d="M1085 396 L1127 355 L1160 330" fill="none" stroke="#b35c31" stroke-width="5" stroke-dasharray="12 8"/>
<path d="M1160 330 Q1170 244 1250 240 Q1340 246 1365 338" fill="none" stroke="#b35c31" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow2)"/>
<rect x="1206" y="316" width="73" height="79" rx="12" fill="#f1c29c" stroke="#b35c31" stroke-width="3"/>
<text x="1242" y="364" font-size="18" text-anchor="middle" font-weight="700">Εμπόδιο</text>
<g transform="translate(1082,398) scale(.78)"><use href="#drone"/></g>
<path d="M1130 382 Q1172 355 1188 351" stroke="#b35c31" stroke-width="3" stroke-dasharray="4 8" fill="none"/>
<text x="1240" y="522" class="mini" text-anchor="middle">Δεδομένα αισθητήρων</text>
<text x="1240" y="556" class="s" text-anchor="middle">επηρεάζουν την πορεία</text>
<text x="1240" y="604" class="note" text-anchor="middle">π.χ. αλλαγή διαδρομής</text>
<!-- common note -->
<rect x="30" y="660" width="1440" height="72" rx="12" fill="#eaf0f7"/>
<text x="750" y="691" text-anchor="middle" class="mini">Κοινό και στις τρεις περιπτώσεις: ο ελεγκτής πτήσης υποστηρίζει τον έλεγχο και τη σταθεροποίηση.</text>
<text x="750" y="718" text-anchor="middle" class="note">Αυτοματοποίηση ≠ εγγυημένη ασφάλεια ή ποιότητα δεδομένων</text>
</svg>
