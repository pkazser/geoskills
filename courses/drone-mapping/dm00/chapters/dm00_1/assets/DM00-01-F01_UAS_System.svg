<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">Το μη επανδρωμένο αεροσκάφος ως μέρος συστήματος UAS</title>
<desc id="desc">Αριστερά ένα πολυκόπτερο με κάμερα, δεξιά χειριστής και τηλεχειριστήριο. Αμφίδρομη επικοινωνία ενώνει τα δύο. Κάτω ακολουθεί συλλογή δεδομένων και παραγωγή αποτελεσμάτων.</desc>
<rect width="1100" height="580" rx="24" fill="#f7fafc"/>
<text x="550" y="56" text-anchor="middle" fill="#19324b" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="bold">Σύστημα μη επανδρωμένου αεροσκάφους (UAS / ΣμηΕΑ)</text>
<rect x="52" y="92" width="414" height="256" rx="22" fill="#e7f2ff" stroke="#2d6599" stroke-width="2"/>
<rect x="634" y="92" width="414" height="256" rx="22" fill="#e8f5f0" stroke="#26735a" stroke-width="2"/>
<text x="259" y="128" fill="#173a59" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold">Μη επανδρωμένο αεροσκάφος</text>
<text x="841" y="128" fill="#17513d" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold">Εξοπλισμός ελέγχου</text>
<!-- icon drone -->
<g stroke="#233b50" stroke-width="8" stroke-linecap="round" fill="none">
<path d="M195 204 L323 262 M195 262 L323 204"/><rect x="237" y="215" width="44" height="36" rx="10" fill="#8ab6d9" stroke-width="4"/>
<circle cx="175" cy="193" r="30" stroke="#2d6599" stroke-width="5"/><circle cx="343" cy="193" r="30" stroke="#2d6599" stroke-width="5"/>
<circle cx="175" cy="273" r="30" stroke="#2d6599" stroke-width="5"/><circle cx="343" cy="273" r="30" stroke="#2d6599" stroke-width="5"/>
<path d="M251 252 v16 h18 v-16" stroke-width="4"/>
</g><rect x="245" y="263" width="30" height="23" rx="7" fill="#305a7e"/>
<circle cx="260" cy="274" r="7" fill="#d8efff"/>
<text x="259" y="325" text-anchor="middle" fill="#173a59" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Αεροσκάφος και κάμερα</text>
<!-- controller -->
<g><rect x="771" y="187" width="140" height="92" rx="26" fill="#295846"/><rect x="798" y="178" width="87" height="46" rx="5" fill="#b5e0cb" stroke="#295846" stroke-width="5"/><circle cx="810" cy="243" r="13" fill="#d6f0e5"/><circle cx="872" cy="243" r="13" fill="#d6f0e5"/><path d="M810 243 v-16 M872 243 v-16" stroke="#295846" stroke-width="5" stroke-linecap="round"/></g>
<text x="841" y="325" text-anchor="middle" fill="#17513d" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Χειριστής / τηλεχειριστήριο</text>
<!-- bidirectional channel -->
<path d="M475 212 H625" stroke="#805a16" stroke-width="5" stroke-linecap="round"/>
<path d="M475 212 l16 -10 v20 z" fill="#805a16"/><path d="M625 212 l-16 -10 v20 z" fill="#805a16"/>
<text x="550" y="182" text-anchor="middle" fill="#805a16" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="bold">Επικοινωνία</text>
<text x="550" y="238" text-anchor="middle" fill="#805a16" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">εντολές / στοιχεία</text>
<!-- deliverables separated from UAS -->
<path d="M257 350 v39 h293 v24" fill="none" stroke="#65758a" stroke-width="3" stroke-dasharray="8 7"/>
<path d="M550 409 l-8 -13 h16 z" fill="#65758a"/>
<rect x="265" y="418" width="570" height="94" rx="18" fill="#fff4df" stroke="#d4a047" stroke-width="2" stroke-dasharray="6 5"/>
<text x="550" y="454" text-anchor="middle" fill="#6f4a12" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold">Δεδομένα και αποτελέσματα της εργασίας</text>
<text x="550" y="487" text-anchor="middle" fill="#6f4a12" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Εικόνες → οργάνωση / επεξεργασία → παραδοτέο</text>
<text x="550" y="549" text-anchor="middle" fill="#526273" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">Η κάτω περιοχή αφορά τη ροή της εργασίας — δεν είναι κανονιστικός ορισμός του UAS.</text>
</svg>
