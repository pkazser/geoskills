<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Σχήμα 1.2: Αιώρηση, άνοδος και κίνηση προς τα εμπρός</title>
<desc id="desc">Τρεις σχηματικές καταστάσεις τετρακόπτερου: αιώρηση με ώση που ισορροπεί με το βάρος, άνοδος με μεγαλύτερη ανοδική ώση, και κλίση προς τα εμπρός με οριζόντια συνιστώσα ώσης. Τα βέλη είναι ποιοτικά.</desc>
<defs>
 <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#137e88"/></marker>
 <marker id="down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c4663a"/></marker>
 <marker id="forward" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#315dac"/></marker>
 <g id="drone"><path d="M-99 -13 L-29 -10 L29 -10 L99 -13" stroke="#24354b" stroke-width="13" stroke-linecap="round" fill="none"/><ellipse rx="45" ry="20" fill="#51647b"/><ellipse cx="-99" cy="-19" rx="57" ry="7" fill="#a6cbd1" stroke="#264252" stroke-width="3"/><ellipse cx="99" cy="-19" rx="57" ry="7" fill="#a6cbd1" stroke="#264252" stroke-width="3"/><rect x="-29" y="-8" width="58" height="22" rx="9" fill="#24354b"/><path d="M-30 18 L-44 48 M30 18 L44 48" stroke="#24354b" stroke-width="7" stroke-linecap="round"/></g>
</defs>
<rect width="1440" height="650" fill="#f7fafc"/>
<text x="720" y="55" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1d344c">Πώς ελέγχεται η κίνηση ενός τετρακόπτερου</text>
<text x="720" y="90" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#4a6073">Σχηματική πλευρική όψη · όχι ακριβής αναπαράσταση δυνάμεων</text>
<g font-family="Arial,DejaVu Sans,sans-serif">
 <g transform="translate(30,126)"><rect width="440" height="462" rx="22" fill="white" stroke="#d7e2ea" stroke-width="2"/><text x="220" y="47" text-anchor="middle" font-weight="700" font-size="25" fill="#17324c">Α · Αιώρηση</text><g transform="translate(220,187)"><use href="#drone"/><line x1="0" y1="-30" x2="0" y2="-78" stroke="#137e88" stroke-width="6" marker-end="url(#up)"/><line x1="0" y1="32" x2="0" y2="113" stroke="#c4663a" stroke-width="6" marker-end="url(#down)"/></g><text x="283" y="128" fill="#137e88" font-size="18" font-weight="600">Ώση προς τα πάνω</text><text x="250" y="344" fill="#c4663a" font-size="18" font-weight="600">Βάρος προς τα κάτω</text><text x="220" y="394" text-anchor="middle" font-size="19" fill="#24354b">Συνολική ώση ≈ βάρος</text><text x="220" y="427" text-anchor="middle" font-size="17" fill="#4a6073">Περίπου σταθερό ύψος</text></g>
 <g transform="translate(500,126)"><rect width="440" height="462" rx="22" fill="white" stroke="#d7e2ea" stroke-width="2"/><text x="220" y="47" text-anchor="middle" font-weight="700" font-size="25" fill="#17324c">Β · Άνοδος</text><g transform="translate(220,201)"><use href="#drone"/><line x1="0" y1="-30" x2="0" y2="-105" stroke="#137e88" stroke-width="8" marker-end="url(#up)"/><line x1="0" y1="32" x2="0" y2="93" stroke="#c4663a" stroke-width="6" marker-end="url(#down)"/></g><text x="280" y="137" fill="#137e88" font-size="18" font-weight="600">Μεγαλύτερη ώση</text><text x="245" y="329" fill="#c4663a" font-size="18" font-weight="600">Βάρος</text><text x="220" y="394" text-anchor="middle" font-size="19" fill="#24354b">Συνολική ώση &gt; βάρος</text><text x="220" y="427" text-anchor="middle" font-size="17" fill="#4a6073">Ανοδική επιτάχυνση</text></g>
 <g transform="translate(970,126)"><rect width="440" height="462" rx="22" fill="white" stroke="#d7e2ea" stroke-width="2"/><text x="220" y="47" text-anchor="middle" font-weight="700" font-size="25" fill="#17324c">Γ · Κίνηση εμπρός</text><g transform="translate(199,194) rotate(13)"><use href="#drone"/><line x1="0" y1="-30" x2="0" y2="-91" stroke="#137e88" stroke-width="7" marker-end="url(#up)"/></g><line x1="199" y1="209" x2="339" y2="209" stroke="#315dac" stroke-width="7" marker-end="url(#forward)"/><text x="323" y="176" fill="#315dac" text-anchor="middle" font-size="18" font-weight="600">Εμπρός</text><text x="220" y="346" text-anchor="middle" font-size="18" fill="#24354b">Κλίση → οριζόντια</text><text x="220" y="375" text-anchor="middle" font-size="18" fill="#24354b">συνιστώσα ώσης</text><text x="220" y="427" text-anchor="middle" font-size="17" fill="#4a6073">Μεταβολή οριζόντιας ταχύτητας</text></g>
 <text x="720" y="628" text-anchor="middle" font-size="18" fill="#4a6073">Τα βέλη δείχνουν τη βασική ιδέα. Δεν απεικονίζονται όλες οι δυνάμεις ούτε οι διορθώσεις του ελεγκτή πτήσης.</text>
</g>
</svg>
