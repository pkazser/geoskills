<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Υποθετική περιοχή μελέτης αγροτικής αποτύπωσης</title>
<desc id="desc">Σχηματικός χάρτης για εκπαιδευτική αποστολή περίπου 25 εκταρίων. Δείχνει αγροτεμάχια, δρόμο πρόσβασης, κτίσμα, δενδροστοιχία, ρέμα και ενδεικτική περιοχή ενδιαφέροντος, χωρίς πραγματική κλίμακα ή συντεταγμένες.</desc>
