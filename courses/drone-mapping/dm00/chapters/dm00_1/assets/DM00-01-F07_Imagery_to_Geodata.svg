<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="tit desc">
<title id="tit">Από τις επικαλυπτόμενες φωτογραφίες σε χαρτογραφικά προϊόντα</title>
<desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα με τρία στάδια: συλλογή επικαλυπτόμενων εικόνων, επεξεργασία με έλεγχο γεωαναφοράς, παραγωγή ορθοφωτοχάρτη και δυνητικά τρισδιάστατου μοντέλου, έπειτα ανεξάρτητος έλεγχος καταλληλότητας. Δεν απεικονίζει πραγματικά δεδομένα πεδίου.</desc>
<rect width="1440" height="650" fill="#f5f8fc"/>
<text x="720" y="59" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="31" fill="#123552">Από τη λήψη στην αξιοποιήσιμη γεωχωρική πληροφορία</text>
<text x="720" y="92" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#476176">Σχηματική ροή — όχι πραγματικά δεδομένα του εικονιζόμενου ορθοφωτοχάρτη</text>
<!-- panels -->
<rect x="40" y="128" width="350" height="415" rx="22" fill="#ffffff" stroke="#c9d8e6" stroke-width="2"/>
