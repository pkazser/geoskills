<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
<title id="title">Σχήμα 1.3 — Βασικά μέρη τετρακόπτερου</title>
<desc id="desc">Στην αριστερή πλευρά ορατά μέρη 1 έως 6, στη δεξιά εννοιολογικό πλαίσιο εσωτερικών μονάδων 7 έως 9. Δεν απεικονίζονται πραγματικές θέσεις εγκατάστασης.</desc>
<rect x="0" y="0" width="1600" height="1150" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1"/>
<text x="72" y="75" font-family="DejaVu Sans,Arial,sans-serif" font-size="41" font-weight="700" text-anchor="start" fill="#19374f">Βασικά μέρη ενός τετρακόπτερου</text>
<text x="74" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52697b">Τι βλέπουμε εξωτερικά και ποιες μονάδες λειτουργούν εσωτερικά</text>
