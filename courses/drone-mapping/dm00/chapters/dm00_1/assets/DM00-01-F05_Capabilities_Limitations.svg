<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="790" viewBox="0 0 1300 790" role="img" aria-labelledby="t d"><title id="t">Δυνατότητες και περιορισμοί των drones</title><desc id="d">Τέσσερα ζεύγη δυνατοτήτων και ελέγχων. Η τελική επιλογή εξαρτάται από τον στόχο και τις συνθήκες.</desc><rect width="1300" height="790" fill="#f8fafc"/><text x="650" y="64" fill="#12324a" text-anchor="middle" font-size="34" font-weight="700" font-family="DejaVu Sans">Τι προσφέρει ένα drone — τι πρέπει να ελέγξουμε;</text><rect x="56" y="94" width="520" height="62" fill="#dcefe8" rx="14"/><rect x="724" y="94" width="520" height="62" fill="#fcebd9" rx="14"/><text x="316" y="135" text-anchor="middle" fill="#116149" font-size="25" font-family="DejaVu Sans" font-weight="700">ΔΥΝΑΤΟΤΗΤΑ</text><text x="984" y="135" text-anchor="middle" fill="#87501e" font-size="25" font-family="DejaVu Sans" font-weight="700">ΠΡΟΫΠΟΘΕΣΗ / ΠΕΡΙΟΡΙΣΜΟΣ</text><rect x="56" y="173" width="520" height="91" fill="white" stroke="#bcd9ce" stroke-width="2" rx="13"/><rect x="724" y="173" width="520" height="91" fill="white" stroke="#edd0af" stroke-width="2" rx="13"/><text x="81" y="224" fill="#143c32" font-family="DejaVu Sans" font-size="19">Πρόσφατη εικόνα</text><text x="749" y="224" fill="#643e23" font-family="DejaVu Sans" font-size="17">Χρειάζεται νόμιμη και ασφαλής πρόσβαση</text><path d="M598 219 H700" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><path d="M690 211 L700 219 L690 227" fill="none" stroke="#64748b" stroke-width="3"/><rect x="56" y="285" width="520" height="91" fill="white" stroke="#bcd9ce" stroke-width="2" rx="13"/><rect x="724" y="285" width="520" height="91" fill="white" stroke="#edd0af" stroke-width="2" rx="13"/><text x="81" y="336" fill="#143c32" font-family="DejaVu Sans" font-size="19">Λεπτομερής παρατήρηση</text><text x="749" y="336" fill="#643e23" font-family="DejaVu Sans" font-size="17">Η λεπτομέρεια δεν αποδεικνύει ακρίβεια θέσης</text><path d="M598 331 H700" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><path d="M690 323 L700 331 L690 339" fill="none" stroke="#64748b" stroke-width="3"/><rect x="56" y="397" width="520" height="91" fill="white" stroke="#bcd9ce" stroke-width="2" rx="13"/><rect x="724" y="397" width="520" height="91" fill="white" stroke="#edd0af" stroke-width="2" rx="13"/><text x="81" y="448" fill="#143c32" font-family="DejaVu Sans" font-size="19">Επαναλαμβανόμενες λήψεις</text><text x="749" y="448" fill="#643e23" font-family="DejaVu Sans" font-size="17">Απαιτούνται συγκρίσιμα δεδομένα</text><path d="M598 443 H700" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><path d="M690 435 L700 443 L690 451" fill="none" stroke="#64748b" stroke-width="3"/><rect x="56" y="509" width="520" height="91" fill="white" stroke="#bcd9ce" stroke-width="2" rx="13"/><rect x="724" y="509" width="520" height="91" fill="white" stroke="#edd0af" stroke-width="2" rx="13"/><text x="81" y="560" fill="#143c32" font-family="DejaVu Sans" font-size="19">Κάλυψη δύσκολων θέσεων</text><text x="749" y="560" fill="#643e23" font-family="DejaVu Sans" font-size="17">Άνεμος, εμπόδια, ενέργεια και εξοπλισμός</text><path d="M598 555 H700" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><path d="M690 547 L700 555 L690 563" fill="none" stroke="#64748b" stroke-width="3"/><path d="M650 626 V664" stroke="#346276" stroke-width="3"/><path d="M642 655 L650 666 L658 655" fill="none" stroke="#346276" stroke-width="3"/><rect x="195" y="672" width="910" height="78" rx="17" fill="#163b53"/><text x="650" y="704" text-anchor="middle" font-family="DejaVu Sans" fill="white" font-size="23" font-weight="700">Ελέγχω την καταλληλότητα για τον πραγματικό στόχο</text><text x="650" y="732" text-anchor="middle" font-family="DejaVu Sans" fill="#d4eaf3" font-size="18">Απαιτήσεις · συνθήκες · ασφάλεια · ποιότητα αποτελέσματος</text></svg>