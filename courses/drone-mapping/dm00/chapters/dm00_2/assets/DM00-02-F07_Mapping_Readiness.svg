<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d">
<title id="t">Πέντε έλεγχοι καταλληλότητας drone για χαρτογράφηση</title>
<desc id="d">Πέντε κάρτες: κάμερα, κάλυψη, θέση, πτήση, δεδομένα. Οι πέντε έλεγχοι οδηγούν σε ελέγξιμο χαρτογραφικό παραδοτέο.</desc>
<rect width="1400" height="820" fill="#f7fafc"/>
<text x="700" y="78" text-anchor="middle" fill="#153454" font-size="42" font-family="DejaVu Sans" font-weight="bold">Κατάλληλο drone για χαρτογράφηση;</text>
<text x="700" y="126" text-anchor="middle" fill="#42637c" font-size="24" font-family="DejaVu Sans">Δεν αρκούν η κάμερα ή η διαφημιζόμενη αυτονομία.</text>
<rect x="85" y="185" width="580" height="126" rx="18" fill="white" stroke="#adc6d8" stroke-width="2"/><circle cx="144" cy="247" r="36" fill="#e5f4f1" stroke="#31917e" stroke-width="2"/><text x="144" y="259" text-anchor="middle" fill="#125e53" font-size="31" font-family="DejaVu Sans" font-weight="bold">01</text><text x="197" y="233" fill="#153454" font-size="28" font-family="DejaVu Sans" font-weight="bold">ΚΑΜΕΡΑ</text><text x="197" y="271" fill="#304e66" font-size="20" font-family="DejaVu Sans">Καθαρές και κατάλληλες λήψεις</text><rect x="730" y="185" width="580" height="126" rx="18" fill="white" stroke="#adc6d8" stroke-width="2"/><circle cx="789" cy="247" r="36" fill="#e5f4f1" stroke="#31917e" stroke-width="2"/><text x="789" y="259" text-anchor="middle" fill="#125e53" font-size="31" font-family="DejaVu Sans" font-weight="bold">02</text><text x="842" y="233" fill="#153454" font-size="28" font-family="DejaVu Sans" font-weight="bold">ΚΑΛΥΨΗ</text><text x="842" y="271" fill="#304e66" font-size="20" font-family="DejaVu Sans">Σχέδιο και επικάλυψη εικόνων</text><rect x="85" y="345" width="580" height="126" rx="18" fill="white" stroke="#adc6d8" stroke-width="2"/><circle cx="144" cy="407" r="36" fill="#e5f4f1" stroke="#31917e" stroke-width="2"/><text x="144" y="419" text-anchor="middle" fill="#125e53" font-size="31" font-family="DejaVu Sans" font-weight="bold">03</text><text x="197" y="393" fill="#153454" font-size="28" font-family="DejaVu Sans" font-weight="bold">ΘΕΣΗ</text><text x="197" y="431" fill="#304e66" font-size="20" font-family="DejaVu Sans">GNSS και μεταδεδομένα</text><rect x="730" y="345" width="580" height="126" rx="18" fill="white" stroke="#adc6d8" stroke-width="2"/><circle cx="789" cy="407" r="36" fill="#e5f4f1" stroke="#31917e" stroke-width="2"/><text x="789" y="419" text-anchor="middle" fill="#125e53" font-size="31" font-family="DejaVu Sans" font-weight="bold">04</text><text x="842" y="393" fill="#153454" font-size="28" font-family="DejaVu Sans" font-weight="bold">ΠΤΗΣΗ</text><text x="842" y="431" fill="#304e66" font-size="20" font-family="DejaVu Sans">Χρόνος, συνθήκες, ασφάλεια</text><rect x="408" y="505" width="580" height="126" rx="18" fill="white" stroke="#adc6d8" stroke-width="2"/><circle cx="467" cy="567" r="36" fill="#e5f4f1" stroke="#31917e" stroke-width="2"/><text x="467" y="579" text-anchor="middle" fill="#125e53" font-size="31" font-family="DejaVu Sans" font-weight="bold">05</text><text x="520" y="553" fill="#153454" font-size="28" font-family="DejaVu Sans" font-weight="bold">ΔΕΔΟΜΕΝΑ</text><text x="520" y="591" fill="#304e66" font-size="20" font-family="DejaVu Sans">Συμβατότητα και έλεγχος</text><path d="M700 635 L700 672" stroke="#31917e" stroke-width="5" stroke-linecap="round"/>
<path d="M684 658 L700 676 L716 658" stroke="#31917e" stroke-width="5" stroke-linejoin="round" fill="none"/>
<rect x="290" y="694" width="820" height="84" rx="18" fill="#153454"/>
<text x="700" y="745" text-anchor="middle" fill="white" font-size="29" font-family="DejaVu Sans" font-weight="bold">Χρήσιμο παραδοτέο με ελέγξιμη ποιότητα</text>
</svg>