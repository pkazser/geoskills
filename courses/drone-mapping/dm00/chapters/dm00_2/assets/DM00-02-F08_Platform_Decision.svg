<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="t d"><title id="t">Τρία βήματα για τεκμηριωμένη επιλογή drone</title><desc id="d">Πρώτο βήμα: προσδιορισμός απαιτήσεων έργου. Δεύτερο: έλεγχος απαραίτητων προϋποθέσεων. Τρίτο: σύγκριση εφικτών επιλογών και διατύπωση προσωρινής απόφασης με άγνωστα στοιχεία.</desc><rect width="1100" height="550" fill="#f7fafc"/><text x="50" y="66" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="bold" fill="#17334b">Πώς επιλέγουμε κατάλληλη κατηγορία drone;</text><text x="50" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#526579">Από την ανάγκη της εργασίας στην τεκμηριωμένη, υπό όρους απόφαση</text>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="45" y="157" width="310" height="225" rx="18" fill="white" stroke="#9ac4d8" stroke-width="3"/><circle cx="86" cy="195" r="23" fill="#1479a6"/><text x="86" y="202" fill="white" text-anchor="middle" font-size="21" font-weight="bold">1</text><text x="119" y="203" font-size="22" font-weight="bold" fill="#17334b">Ορίζω ανάγκες</text><text x="72" y="254" font-size="18" fill="#354e5d">• Τελικό παραδοτέο</text><text x="72" y="290" font-size="18" fill="#354e5d">• Έκταση και πρόσβαση</text><text x="72" y="326" font-size="18" fill="#354e5d">• Είδος λήψεων</text>
<rect x="395" y="157" width="310" height="225" rx="18" fill="white" stroke="#d1aa64" stroke-width="3"/><circle cx="436" cy="195" r="23" fill="#b07420"/><text x="436" y="202" fill="white" text-anchor="middle" font-size="21" font-weight="bold">2</text><text x="469" y="203" font-size="21" font-weight="bold" fill="#17334b">Ελέγχω όρους</text><text x="421" y="254" font-size="18" fill="#354e5d">• Ασφάλεια / νομιμότητα</text><text x="421" y="290" font-size="18" fill="#354e5d">• Απογείωση / ανάκτηση</text><text x="421" y="326" font-size="18" fill="#354e5d">• Δεδομένα / συμβατότητα</text>
<rect x="745" y="157" width="310" height="225" rx="18" fill="white" stroke="#7db5a8" stroke-width="3"/><circle cx="786" cy="195" r="23" fill="#267f6a"/><text x="786" y="202" fill="white" text-anchor="middle" font-size="21" font-weight="bold">3</text><text x="819" y="203" font-size="21" font-weight="bold" fill="#17334b">Συγκρίνω λύσεις</text><text x="771" y="254" font-size="18" fill="#354e5d">• Πολυκόπτερο</text><text x="771" y="290" font-size="18" fill="#354e5d">• Σταθερή πτέρυγα</text><text x="771" y="326" font-size="18" fill="#354e5d">• Υβριδικό VTOL</text>
<path d="M361 268 L388 268" stroke="#5c7585" stroke-width="4"/><path d="M380 259 L390 268 L380 277" fill="none" stroke="#5c7585" stroke-width="4"/><path d="M711 268 L738 268" stroke="#5c7585" stroke-width="4"/><path d="M730 259 L740 268 L730 277" fill="none" stroke="#5c7585" stroke-width="4"/>
<rect x="140" y="424" width="820" height="79" rx="14" fill="#e5f1f0" stroke="#73a79c" stroke-width="2"/><text x="550" y="457" text-anchor="middle" font-size="22" font-weight="bold" fill="#215e55">Προσωρινή επιλογή + αιτιολόγηση + άγνωστα στοιχεία</text><text x="550" y="487" text-anchor="middle" font-size="16" fill="#3a625e">Δεν αποτελεί έγκριση πτήσης ή εγγύηση ακρίβειας του προϊόντος.</text>
</g></svg>