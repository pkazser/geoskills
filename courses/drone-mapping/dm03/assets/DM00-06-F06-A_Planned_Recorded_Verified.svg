<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" fill="#f8fafc"/><text x="600" y="55" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#13324b" text-anchor="middle">Από το σχέδιο στα ελεγμένα αρχεία</text><text x="600" y="86" font-family="DejaVu Sans" font-size="17" fill="#64748b" text-anchor="middle">Συνθετικό εκπαιδευτικό παράδειγμα — όχι πραγματική πτήση</text><rect x="31" y="135" width="211" height="145" rx="14" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="136" y="179" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">1 · ΣΧΕΔΙΟ</text><text x="136" y="221" font-family="DejaVu Sans" font-size="17" fill="#17324b" text-anchor="middle">936 θέσεις</text><path d="M246 207 l17 0 m-7 -7 l7 7 -7 7" stroke="#64748b" fill="none" stroke-width="3"/><rect x="270" y="135" width="211" height="145" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="375" y="179" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">2 · ΠΑΡΑΚΟΛΟΥΘΗΣΗ</text><text x="375" y="221" font-family="DejaVu Sans" font-size="17" fill="#17324b" text-anchor="middle">Logs: άγνωστα</text><path d="M485 207 l17 0 m-7 -7 l7 7 -7 7" stroke="#64748b" fill="none" stroke-width="3"/><rect x="509" y="135" width="211" height="145" rx="14" fill="#d1fae5" stroke="#94a3b8" stroke-width="2"/><text x="614" y="179" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">3 · ΑΡΧΕΙΑ</text><text x="614" y="221" font-family="DejaVu Sans" font-size="17" fill="#17324b" text-anchor="middle">932 εικόνες</text><path d="M724 207 l17 0 m-7 -7 l7 7 -7 7" stroke="#64748b" fill="none" stroke-width="3"/><rect x="748" y="135" width="211" height="145" rx="14" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="853" y="179" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">4 · ΕΛΕΓΧΟΣ</text><text x="853" y="221" font-family="DejaVu Sans" font-size="17" fill="#17324b" text-anchor="middle">4 ασυμφωνίες</text><path d="M963 207 l17 0 m-7 -7 l7 7 -7 7" stroke="#64748b" fill="none" stroke-width="3"/><rect x="987" y="135" width="211" height="145" rx="14" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="1092" y="179" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">5 · ΑΠΟΦΑΣΗ</text><text x="1092" y="221" font-family="DejaVu Sans" font-size="17" fill="#17324b" text-anchor="middle">Όχι ακόμη έτοιμο</text><rect x="70" y="322" width="1060" height="58" rx="12" fill="#e9eff6"/><text x="600" y="357" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#183c57">Το πλήθος αρχείων ≠ ο ποιοτικός έλεγχος ≠ η επάρκεια για ορθοφωτοχάρτη</text></svg>