<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660"><rect width="1160" height="660" fill="#f8fafc"/><text x="65" y="70" font-family="DejaVu Sans,sans-serif" font-size="35" font-weight="bold" fill="#17324d">F06-B · Παρακολούθηση αποστολής</text><text x="65" y="107" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#425569">Εκπαιδευτική προσομοίωση · όχι πραγματικά δεδομένα πτήσης</text><g font-family="DejaVu Sans,sans-serif"><rect x="65" y="145" width="295" height="155" rx="18" fill="#e0efff" stroke="#4585bd" stroke-width="3"/><text x="90" y="191" font-size="26" font-weight="bold" fill="#164b78">1 · Πρόοδος</text><text x="90" y="231" font-size="20" fill="#17324d">Τμήμα / ένδειξη</text><text x="90" y="264" font-size="18" fill="#425569">Δεν σημαίνει ποιοτικό έλεγχο</text><rect x="431" y="145" width="295" height="155" rx="18" fill="#fff0d9" stroke="#ce9140" stroke-width="3"/><text x="455" y="191" font-size="26" font-weight="bold" fill="#8c5416">2 · Συμβάν</text><text x="455" y="231" font-size="20" fill="#17324d">Παρατήρηση / απόκλιση</text><text x="455" y="264" font-size="18" fill="#425569">Δεν εικάζουμε την αιτία</text><rect x="798" y="145" width="295" height="155" rx="18" fill="#dcefe7" stroke="#409374" stroke-width="3"/><text x="822" y="191" font-size="26" font-weight="bold" fill="#17684c">3 · Απόφαση</text><text x="822" y="231" font-size="20" fill="#17324d">Έλεγχος και καταγραφή</text><text x="822" y="264" font-size="18" fill="#425569">Μόνο με διαθέσιμα στοιχεία</text><path d="M364 223 L421 223 M412 213 L423 223 L412 233 M729 223 L787 223 M778 213 L790 223 L778 233" fill="none" stroke="#657b90" stroke-width="4" stroke-linejoin="round"/><rect x="85" y="352" width="465" height="195" rx="18" fill="#fdebec" stroke="#bc6065" stroke-width="3"/><text x="112" y="402" font-size="28" font-weight="bold" fill="#922d39">Ασφάλεια πτήσης</text><text x="112" y="447" font-size="20" fill="#17324d">Κίνδυνος → προτεραιότητα</text><text x="112" y="480" font-size="20" fill="#17324d">στην ασφαλή λειτουργία</text><text x="112" y="514" font-size="18" fill="#485767">Κανόνες, διαδικασίες, χειριστής</text><rect x="610" y="352" width="465" height="195" rx="18" fill="#e7e8fa" stroke="#7179be" stroke-width="3"/><text x="637" y="402" font-size="28" font-weight="bold" fill="#444e9a">Ποιότητα δεδομένων</text><text x="637" y="447" font-size="20" fill="#17324d">Ένδειξη ≠ αρχείο ≠</text><text x="637" y="480" font-size="20" fill="#17324d">επαρκής επικάλυψη</text><text x="637" y="514" font-size="18" fill="#485767">Ελέγχεται μετά, με τεκμήρια</text><path d="M943 302 L943 345 M933 334 L943 345 L953 334 M217 302 L217 346 M207 335 L217 346 L227 335" fill="none" stroke="#657b90" stroke-width="4"/><text x="580" y="602" font-size="20" text-anchor="middle" fill="#405168">Η καταγραφή κρατά χωριστές τις δύο αποφάσεις.</text></g></svg>