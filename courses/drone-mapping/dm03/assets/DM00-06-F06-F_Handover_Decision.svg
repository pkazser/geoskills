 d="M758,279 V326" stroke="#6385a0" stroke-width="3"/><path d="M750,317 L758,328 L766,317" fill="none" stroke="#6385a0" stroke-width="3"/><rect x="917" y="156" width="268" height="121" rx="14" fill="#e2edf7" stroke="#779abb" stroke-width="2"/><circle cx="950" cy="188" r="22" fill="#1f5e90"/><text x="950" y="195" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="white">04</text><text x="1051" y="245" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173451">Ακεραιότητα</text><path d="M1051,279 V326" stroke="#6385a0" stroke-width="3"/><path d="M1043,317 L1051,328 L1059,317" fill="none" stroke="#6385a0" stroke-width="3"/><rect x="218" y="340" width="764" height="115" rx="18" fill="#eaf6ec" stroke="#5b9e73" stroke-width="2"/><text x="600" y="377" text-anchor="middle" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#205a3f">Απόφαση και εκκρεμότητες</text><text x="600" y="412" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#205a3f">Α: Δοκιμαστική επεξεργασία   •   Β: Διαγνωστικός έλεγχος   •   Γ: Μη έτοιμο</text><text x="600" y="498" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#536777">Οι ετικέτες είναι εκπαιδευτικές — όχι πιστοποίηση καταλληλότητας</text></svg>