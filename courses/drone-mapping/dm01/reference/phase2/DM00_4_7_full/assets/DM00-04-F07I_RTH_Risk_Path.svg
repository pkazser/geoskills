<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720"><rect width="1320" height="720" fill="#f7fafb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183246}.head{font-size:32px;font-weight:bold}.sub{font-size:19px}.lab{font-size:22px;font-weight:bold}.small{font-size:17px}.node{fill:#fff;stroke:#5381a1;stroke-width:3;rx:18}.danger{fill:#fff3e8;stroke:#d38c43;stroke-width:3;rx:18}.line{fill:none;stroke:#527c98;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 10}.risk{fill:none;stroke:#c56743;stroke-width:5;stroke-dasharray:12 9}</style><text x="48" y="60" class="head">F07-I · Η επιστροφή δεν είναι αυτόματη εγγύηση ασφάλειας</text><text x="48" y="92" class="sub">Σχηματικό παράδειγμα — οι αποστάσεις και οι διαδρομές δεν είναι πραγματικές</text><rect x="70" y="165" width="305" height="144" class="node"/><text x="93" y="205" class="lab">Drone στον αέρα</text><text x="93" y="240" class="small">Ζεύξη • GNSS • Ενέργεια</text><text x="93" y="271" class="small">Προβλεπόμενη συμπεριφορά</text><rect x="500" y="165" width="318" height="144" class="danger"/><text x="526" y="207" class="lab">Διαδρομή επιστροφής</text><text x="526" y="242" class="small">Ύψος • Καλώδια • Δέντρα</text><text x="526" y="273" class="small">Αποφυγή εμποδίων;</text><rect x="933" y="165" width="320" height="144" class="danger"/><text x="956" y="207" class="lab">Home Point</text><text x="956" y="242" class="small">Πεζοί • Οχήματα</text><text x="956" y="273" class="small">Ασφαλής ανάκτηση;</text><path d="M375 240 H494" class="line"/><path d="M818 240 H926" class="line"/><path d="M486 231 l16 9 -16 9" fill="none" stroke="#527c98" stroke-width="4"/><path d="M917 231 l16 9 -16 9" fill="none" stroke="#527c98" stroke-width="4"/><rect x="140" y="400" width="1040" height="215" rx="22" fill="#e7f0f4" stroke="#7a9aa9" stroke-width="2"/><text x="187" y="447" class="lab">Εκπαιδευτική απόφαση: αξιολογούμε όλα τα στοιχεία</text><text x="187" y="489" class="small">1. Τι γνωρίζουμε πραγματικά για την πτήση;</text><text x="187" y="522" class="small">2. Υπάρχει ανεξέλεγκτος κίνδυνος για άλλους;</text><text x="187" y="555" class="small">3. Τι προβλέπει το εγχειρίδιο του συγκεκριμένου drone;</text><text x="187" y="588" class="small">4. Ποια ασφαλής εφικτή αντιμετώπιση προκύπτει;</text><text x="70" y="682" class="small">Πηγή σχήματος: πρωτότυπη εκπαιδευτική σύνθεση GeoSkills · 2026</text></svg>