<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">F07-B — Τέσσερα πεδία παρακολούθησης</title><desc id="d">Κεντρική επίγνωση κατάστασης και τέσσερα συνδεδεμένα πεδία: drone, εναέριος χώρος, έδαφος, τηλεμετρία. Η επίγνωση συνδέεται με αναγνώριση αλλαγής και ασφαλή επανεκτίμηση.</desc><rect width="1200" height="650" rx="20" fill="#f7fafc"/><text x="600" y="54" text-anchor="middle" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#15324a">Πού στρέφεται η προσοχή κατά την πτήση;</text><g font-family="DejaVu Sans" text-anchor="middle"><rect x="60" y="105" width="480" height="170" rx="20" fill="#d9eaf6" stroke="#6b9cbd" stroke-width="2"/><text x="300" y="153" font-size="26" font-weight="bold" fill="#173f62">1. Το drone</text><text x="300" y="192" font-size="20" fill="#173f62">Θέση · πορεία · οπτική επαφή</text><text x="300" y="228" font-size="18" fill="#173f62">Μπορώ ακόμη να το διακρίνω;</text><rect x="660" y="105" width="480" height="170" rx="20" fill="#e7e3fa" stroke="#8e85c9" stroke-width="2"/><text x="900" y="153" font-size="26" font-weight="bold" fill="#3a316e">2. Εναέριος χώρος</text><text x="900" y="192" font-size="20" fill="#3a316e">Άλλα αεροσκάφη · συγκρούσεις</text><text x="900" y="228" font-size="18" fill="#3a316e">Έχει εμφανιστεί νέος κίνδυνος;</text><rect x="60" y="370" width="480" height="170" rx="20" fill="#e1f2e9" stroke="#78ad91" stroke-width="2"/><text x="300" y="418" font-size="26" font-weight="bold" fill="#225d46">3. Έδαφος / περιβάλλον</text><text x="300" y="457" font-size="20" fill="#225d46">Άνθρωποι · εμπόδια · καιρός</text><text x="300" y="493" font-size="18" fill="#225d46">Τι άλλαξε γύρω από την αποστολή;</text><rect x="660" y="370" width="480" height="170" rx="20" fill="#f7ead7" stroke="#d3a46d" stroke-width="2"/><text x="900" y="418" font-size="26" font-weight="bold" fill="#754c25">4. Τηλεμετρία</text><text x="900" y="457" font-size="20" fill="#754c25">Ενέργεια · σύνδεση · GNSS</text><text x="900" y="493" font-size="18" fill="#754c25">Ποια ένδειξη απαιτεί προσοχή;</text><rect x="442" y="274" width="316" height="110" rx="28" fill="#163f5a"/><text x="600" y="317" font-size="23" fill="white" font-weight="bold">Επίγνωση κατάστασης</text><text x="600" y="352" font-size="17" fill="#eef5ff">Παρατηρώ · κατανοώ · προβλέπω</text><g stroke="#536f7e" stroke-width="4" fill="none"><path d="M500 275 L460 248"/><path d="M700 275 L740 248"/><path d="M500 384 L460 412"/><path d="M700 384 L740 412"/></g><text x="600" y="605" font-size="18" fill="#43576a">Η παρατήρηση είναι συνεχής · σε κίνδυνο ενεργούμε χωρίς καθυστέρηση</text></g></svg>