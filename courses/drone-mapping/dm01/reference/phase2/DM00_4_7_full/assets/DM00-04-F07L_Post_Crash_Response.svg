</g><text x="600" y="721" fill="#5b7088" font-size="16" font-family="DejaVu Sans" text-anchor="middle">Μετά: τεχνικός έλεγχος, ανασκόπηση, διορθωτικές ενέργειες — όχι αυτόματη επαναπτήση</text></svg>