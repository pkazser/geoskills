<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="510" viewBox="0 0 1160 510">
<rect width="1160" height="510" fill="#f7fafb"/><text x="580" y="46" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#17344a" text-anchor="middle">F07-F — Όταν η ενέργεια δεν αρκεί για βέβαιη επιστροφή</text>
<text x="580" y="75" font-family="DejaVu Sans" font-size="15" fill="#3b5263" text-anchor="middle">Εκπαιδευτικό πλαίσιο αξιολόγησης — όχι διαδικασία χειρισμού συγκεκριμένου drone</text>
<rect x="40" y="123" width="222" height="128" rx="16" fill="#dfeef8" stroke="#8aa4b3" stroke-width="2"/><text x="151" y="158" font-size="18" font-weight="bold" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">1. Παρατηρώ</text><text x="151" y="195" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">Ποσοστό, μηνύματα, τάση</text><text x="151" y="217" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">και πραγματική συμπεριφορά</text><rect x="326" y="123" width="222" height="128" rx="16" fill="#deecfa" stroke="#8aa4b3" stroke-width="2"/><text x="437" y="158" font-size="18" font-weight="bold" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">2. Αξιολογώ</text><text x="437" y="195" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">Ενέργεια, άνεμο, απόσταση</text><text x="437" y="217" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">και διαθέσιμες επιλογές</text><rect x="612" y="123" width="222" height="128" rx="16" fill="#fff0d8" stroke="#8aa4b3" stroke-width="2"/><text x="723" y="158" font-size="18" font-weight="bold" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">3. Προστατεύω</text><text x="723" y="195" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">Άνθρωποι, εμπόδια</text><text x="723" y="217" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">και εναέρια κυκλοφορία</text><rect x="898" y="123" width="222" height="128" rx="16" fill="#e2f2e5" stroke="#8aa4b3" stroke-width="2"/><text x="1009" y="158" font-size="18" font-weight="bold" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">4. Ενεργώ</text><text x="1009" y="195" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">Κατάλληλες διαδικασίες</text><text x="1009" y="217" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#193c50">του συγκεκριμένου UAS</text><path d="M262 186 H315" stroke="#516d7e" stroke-width="3"/><path d="M306 177 L315 186 L306 195" fill="none" stroke="#516d7e" stroke-width="3"/><path d="M548 186 H601" stroke="#516d7e" stroke-width="3"/><path d="M592 177 L601 186 L592 195" fill="none" stroke="#516d7e" stroke-width="3"/><path d="M834 186 H887" stroke="#516d7e" stroke-width="3"/><path d="M878 177 L887 186 L878 195" fill="none" stroke="#516d7e" stroke-width="3"/><rect x="86" y="302" width="988" height="121" rx="16" fill="#fff" stroke="#b7c6d0" stroke-width="2"/><text x="580" y="344" font-size="21" font-weight="bold" font-family="DejaVu Sans" text-anchor="middle" fill="#9e472e">Προτεραιότητα: ασφαλής ανάκτηση, όχι οι τελευταίες φωτογραφίες</text><text x="580" y="379" font-size="16" font-family="DejaVu Sans" text-anchor="middle" fill="#294c5c">Αν υπάρχει άμεση απειλή, εφαρμόζονται χωρίς καθυστέρηση οι προβλεπόμενες διαδικασίες ανάγκης.</text><text x="580" y="466" font-size="14" font-family="DejaVu Sans" text-anchor="middle" fill="#526672">Οι τιμές μπαταρίας και οι αντιδράσεις αυτοματισμών εξαρτώνται από το μοντέλο και τις συνθήκες.</text></svg>