<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><rect width="1200" height="670" fill="#f5f8fa"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#203548}.ttl{font-size:26px;font-weight:bold}.h{font-size:24px;font-weight:bold}.m{font-size:19px}.s{font-size:17px}</style><text x="60" y="65" class="ttl">F07-E · Ο καιρός μεταβάλλεται — η απόφαση επανεξετάζεται</text><text x="60" y="101" class="m">Συνθετικό εκπαιδευτικό διάγραμμα · χωρίς πραγματικές τιμές ανέμου ή πορείες πτήσης</text><rect x="45" y="145" rx="20" width="335" height="365" fill="#e4f0eb" stroke="#4c9279" stroke-width="3"/><text x="75" y="192" class="h">ΠΡΙΝ ΑΠΟ ΤΗΝ ΠΤΗΣΗ</text><text x="75" y="247" class="m">✓ Επίκαιρη πρόγνωση</text><text x="75" y="302" class="m">✓ Όρια κατασκευαστή</text><text x="75" y="357" class="m">✓ Ενέργεια και εφεδρεία</text><text x="75" y="412" class="m">✓ Εναλλακτική ανάκτηση</text><rect x="432" y="145" rx="20" width="335" height="365" fill="#fff1d9" stroke="#c58b3c" stroke-width="3"/><text x="462" y="192" class="h">ΚΑΤΑ ΤΗΝ ΠΤΗΣΗ</text><text x="462" y="247" class="m">! Ισχυρότερες ριπές</text><text x="462" y="302" class="m">! Αργή επιστροφή</text><text x="462" y="357" class="m">! Πτώση ορατότητας</text><text x="462" y="412" class="m">! Περιορισμός εφεδρείας</text><rect x="819" y="145" rx="20" width="335" height="365" fill="#e6edf7" stroke="#5785b7" stroke-width="3"/><text x="849" y="192" class="h">ΕΚΤΙΜΗΣΗ &amp; ΕΝΕΡΓΕΙΑ</text><text x="849" y="247" class="m">1. Σταματώ την εργασία</text><text x="849" y="302" class="m">2. Εξετάζω ασφάλεια</text><text x="849" y="357" class="m">3. Επιλέγω ανάκτηση</text><text x="849" y="412" class="m">4. Επανεκτιμώ / καταγράφω</text><path d="M380 323 H430 M420 313 L430 323 L420 333 M767 323 H817 M807 313 L817 323 L807 333" fill="none" stroke="#5c6472" stroke-width="5"/><rect x="86" y="557" rx="14" width="1028" height="70" fill="#ffffff" stroke="#9eacba" stroke-width="2"/><text x="108" y="589" class="m">ΚΡΙΣΙΜΟ: Οι λήψεις είναι δευτερεύουσες όταν μειώνεται το περιθώριο ασφάλειας.</text><text x="108" y="615" class="s">Οι πραγματικοί χειρισμοί εξαρτώνται από το συγκεκριμένο drone και τις προβλεπόμενες διαδικασίες.</text></svg>