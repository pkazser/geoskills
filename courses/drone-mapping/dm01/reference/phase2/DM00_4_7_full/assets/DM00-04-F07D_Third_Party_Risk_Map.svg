<title id="t">F07-D — Χαρτογραφική αποστολή και κίνδυνοι από τρίτους</title><desc id="d">Συνθετικός αγρός, πεζός σε μονοπάτι, όχημα σε δρόμο, επανδρωμένο αεροσκάφος, θέση προσγείωσης και προγραμματισμένες γραμμές χαρτογράφησης.</desc>
