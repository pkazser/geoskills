<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Αλυσίδα κλιμάκωσης κινδύνου στην πτήση drone</title>
<desc id="desc">Πέντε στάδια από την πρώτη απόκλιση έως ενδεχόμενο ατύχημα, με τρεις ευκαιρίες πρόληψης. Εκπαιδευτικό μοντέλο, όχι επιχειρησιακός αλγόριθμος.</desc>
<rect width="1400" height="760" fill="#F8FAFC"/>
<text x="70" y="76" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="34" fill="#18334F">Πώς κλιμακώνεται ένα περιστατικό</text>
<text x="70" y="115" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#47627C">Αναγνωρίζουμε τις ενδείξεις πριν μειωθούν οι ασφαλείς επιλογές</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#4F6276" stroke-width="1.8"/></marker></defs>
<rect x="55" y="205" width="245" height="188" rx="17" fill="#DCECF8" stroke="#B8C5D3" stroke-width="2"/><text x="72" y="253" font-size="21" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#223F5B">1. Απόκλιση</text><text x="72" y="312" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">Βραδύτερη πορεία</text><text x="72" y="344" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">από την αναμενόμενη</text><path d="M304 295 H307" stroke="#4F6276" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="205" width="245" height="188" rx="17" fill="#FCE5C9" stroke="#B8C5D3" stroke-width="2"/><text x="337" y="253" font-size="21" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#223F5B">2. Προειδοποίηση</text><text x="337" y="312" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">Αυξημένη</text><text x="337" y="344" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">κατανάλωση ενέργειας</text><path d="M569 295 H572" stroke="#4F6276" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="205" width="245" height="188" rx="17" fill="#F8D9C9" stroke="#B8C5D3" stroke-width="2"/><text x="602" y="253" font-size="21" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#223F5B">3. Συσσώρευση</text><text x="602" y="312" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">Άνεμος, εμπόδια,</text><text x="602" y="344" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">καθυστέρηση απόφασης</text><path d="M834 295 H837" stroke="#4F6276" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="205" width="245" height="188" rx="17" fill="#F6C5C4" stroke="#B8C5D3" stroke-width="2"/><text x="867" y="253" font-size="21" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#223F5B">4. Μικρό περιθώριο</text><text x="867" y="312" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">Λιγότερος χρόνος</text><text x="867" y="344" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">για ασφαλή ανάκτηση</text><path d="M1099 295 H1102" stroke="#4F6276" stroke-width="3" marker-end="url(#arrow)"/><rect x="1115" y="205" width="245" height="188" rx="17" fill="#F2B0B3" stroke="#B8C5D3" stroke-width="2"/><text x="1132" y="253" font-size="21" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#223F5B">5. Συμβάν</text><text x="1132" y="312" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">Πιθανή ανεπιθύμητη</text><text x="1132" y="344" font-size="17" font-family="DejaVu Sans, sans-serif" fill="#213C53">προσγείωση / πρόσκρουση</text><path d="M177 399 V470" stroke="#13846D" stroke-width="3" stroke-dasharray="6 6"/><circle cx="177" cy="480" r="8" fill="#13846D"/><rect x="67" y="502" width="220" height="80" rx="12" fill="#DCF4EA" stroke="#72BBA1" stroke-width="2"/><text x="177" y="539" font-size="16" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#135A48">Ελέγχω την απόκλιση</text><path d="M442 399 V470" stroke="#13846D" stroke-width="3" stroke-dasharray="6 6"/><circle cx="442" cy="480" r="8" fill="#13846D"/><rect x="332" y="502" width="220" height="80" rx="12" fill="#DCF4EA" stroke="#72BBA1" stroke-width="2"/><text x="442" y="539" font-size="16" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#135A48">Διακόπτω έγκαιρα</text><text x="442" y="565" font-size="16" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#135A48">τις λήψεις</text><path d="M707 399 V470" stroke="#13846D" stroke-width="3" stroke-dasharray="6 6"/><circle cx="707" cy="480" r="8" fill="#13846D"/><rect x="597" y="502" width="220" height="80" rx="12" fill="#DCF4EA" stroke="#72BBA1" stroke-width="2"/><text x="707" y="539" font-size="16" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#135A48">Επανεκτιμώ την</text><text x="707" y="565" font-size="16" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#135A48">ασφαλή ανάκτηση</text><text x="70" y="667" font-size="20" font-family="DejaVu Sans, sans-serif" fill="#18334F" font-weight="bold">Προτεραιότητα: ανθρώπινη ασφάλεια, όχι ολοκλήρωση της χαρτογράφησης.</text>
<text x="70" y="703" font-size="16" font-family="DejaVu Sans, sans-serif" fill="#47627C">Σχηματικό εκπαιδευτικό παράδειγμα — όχι διαδικασία χειρισμού συγκεκριμένου drone.</text>
</svg>