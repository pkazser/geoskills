<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">F08-A1 Πέντε στάδια κλεισίματος αποστολής</title><desc id="desc">Μετά την προσγείωση υπάρχουν διαφορετικοί έλεγχοι: εξοπλισμός, καταγραφή, δεδομένα και παραδοτέο.</desc><rect width="1200" height="610" fill="#f8fafc"/><text x="600" y="62" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#172b43">F08-A1 · Πότε ολοκληρώνεται η αποστολή;</text><text x="600" y="100" text-anchor="middle" font-family="DejaVu Sans" font-size="19" fill="#485c70">Η προσγείωση δεν κλείνει αυτομάτως τις υπόλοιπες εργασίες</text><g font-family="DejaVu Sans" text-anchor="middle"><rect x="36" y="160" width="206" height="182" rx="17" fill="#d9f2e7" stroke="#29816b" stroke-width="3"/><text x="139" y="203" font-size="18" font-weight="bold" fill="#1b6955">Α. Πτήση</text><text x="139" y="244" font-size="17" fill="#1c4e43">Προσγείωση</text><text x="139" y="272" font-size="17" fill="#1c4e43">επιβεβαιώθηκε</text><text x="139" y="315" font-size="18" font-weight="bold" fill="#1b6955">ΝΑΙ</text><rect x="267" y="160" width="206" height="182" rx="17" fill="#fff1d4" stroke="#bc8125" stroke-width="3"/><text x="370" y="203" font-size="18" font-weight="bold" fill="#6d5015">Β. Εξοπλισμός</text><text x="370" y="244" font-size="17" fill="#67542e">Έλεγχος</text><text x="370" y="272" font-size="17" fill="#67542e">εκκρεμεί</text><text x="370" y="315" font-size="16" font-weight="bold" fill="#79551c">ΑΝΑΜΟΝΗ</text><rect x="498" y="160" width="206" height="182" rx="17" fill="#fff1d4" stroke="#bc8125" stroke-width="3"/><text x="601" y="203" font-size="18" font-weight="bold" fill="#6d5015">Γ. Καταγραφή</text><text x="601" y="244" font-size="17" fill="#67542e">Συμβάντα /</text><text x="601" y="272" font-size="17" fill="#67542e">ημερολόγιο</text><text x="601" y="315" font-size="16" font-weight="bold" fill="#79551c">ΑΝΑΜΟΝΗ</text><rect x="729" y="160" width="206" height="182" rx="17" fill="#fff1d4" stroke="#bc8125" stroke-width="3"/><text x="832" y="203" font-size="18" font-weight="bold" fill="#6d5015">Δ. Δεδομένα</text><text x="832" y="244" font-size="17" fill="#67542e">Ποιότητα και</text><text x="832" y="272" font-size="17" fill="#67542e">υπεύθυνη χρήση</text><text x="832" y="315" font-size="16" font-weight="bold" fill="#79551c">ΑΝΑΜΟΝΗ</text><rect x="960" y="160" width="206" height="182" rx="17" fill="#fce6e5" stroke="#be5050" stroke-width="3"/><text x="1063" y="203" font-size="18" font-weight="bold" fill="#803a3a">Ε. Παραδοτέο</text><text x="1063" y="244" font-size="17" fill="#774d4d">Έλεγχος</text><text x="1063" y="272" font-size="17" fill="#774d4d">δεν έγινε</text><text x="1063" y="315" font-size="17" font-weight="bold" fill="#803a3a">ΟΧΙ ΑΚΟΜΗ</text></g><path d="M242 251 H263 M473 251 H494 M704 251 H725 M935 251 H956" stroke="#62748a" stroke-width="4"/><rect x="119" y="400" width="961" height="106" rx="17" fill="#e4ecf7" stroke="#91a5bd" stroke-width="2"/><text x="600" y="440" text-anchor="middle" font-size="24" font-family="DejaVu Sans" font-weight="bold" fill="#233d5c">Συνολική απόφαση: η πτήση τελείωσε, η εργασία παραμένει ανοικτή</text><text x="600" y="478" text-anchor="middle" font-size="18" font-family="DejaVu Sans" fill="#365574">Ορίζουμε τεκμήριο, υπεύθυνο και επόμενο έλεγχο για κάθε εκκρεμότητα</text><text x="600" y="560" text-anchor="middle" font-size="17" font-family="DejaVu Sans" fill="#516277">Συνθετικό παράδειγμα 25 ha — όχι κανονιστική διαδικασία ή έγκριση πτήσης</text></svg>