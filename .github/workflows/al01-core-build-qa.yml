name: GeoSkills Core Build QA

on:
  push:
    branches:
      - qa/al01-core-v2-2

permissions:
  contents: read

env:
  BASE_URL: /geoskills
  CI: true

jobs:
  build-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned MyST Markdown
        run: npm install -g mystmd@1.11.0

      - name: Prepare pinned MyST Book Theme
        run: python scripts/prepare_myst_theme.py

      - name: Build static HTML
        shell: bash
        run: |
          set -o pipefail
          myst build --html --ci 2>&1 | tee myst-build.log

      - name: Verify AL01 Core outputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find _build/html -type f -path '*al01*' -name '*.html' -print -quit)"
          test -n "$(find _build/html -type f -iname '*al01_1_portfolio*.html' -print -quit)"
          test -n "$(find _build/html -type f -iname '*al01_2_portfolio*.html' -print -quit)"
          test -n "$(find _build/html -type f -iname '*al01_1_core_q1*.html' -print -quit)"
          test -n "$(find _build/html -type f -iname '*al01_1_core_q2*.html' -print -quit)"
          test -n "$(find _build/html -type f -iname '*al01_2_core_q1*.html' -print -quit)"
          test -n "$(find _build/html -type f -iname '*al01_2_core_q2*.html' -print -quit)"

      - name: Verify rendered AL01 Core links
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('_build/html').resolve()
          pages = {
              root / 'courses/ai-learning/al01/core/assignment-planning/index.html': {
                  '/geoskills/al01_1_portfolio.html',
                  '/geoskills/al01_1_core_q1.html',
                  '/geoskills/al01_1_core_q2.html',
              },
              root / 'courses/ai-learning/al01/core/literature-search/index.html': {
                  '/geoskills/al01_2_portfolio.html',
                  '/geoskills/al01_2_core_q1.html',
                  '/geoskills/al01_2_core_q2.html',
              },
          }

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href:
                          self.hrefs.append(href)

          failures = []
          for page, expected in pages.items():
              if not page.is_file():
                  failures.append(f'Missing rendered Core page: {page}')
                  continue
              parser = Links()
              parser.feed(page.read_text(encoding='utf-8'))
              found = set(parser.hrefs)
              for href in expected:
                  if href not in found:
                      failures.append(f'{page}: missing expected link {href}')
              # Validate only the six Core tool links. Theme-generated navigation
              # links such as /geoskills and /geoskills/index are intentionally
              # outside this targeted asset check.
              for href in expected:
                  parsed = urlsplit(href)
                  if not parsed.path.startswith('/geoskills/'):
                      failures.append(f'{page}: expected link lacks /geoskills/ base path: {href}')
                      continue
                  if '..' in parsed.path.split('/'):
                      failures.append(f'{page}: invalid parent traversal in {href}')
                      continue
                  target = root / parsed.path[len('/geoskills/'):]
                  if not target.is_file() and not (target / 'index.html').is_file():
                      failures.append(f'{page}: missing Core target for {href} -> {target}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('Rendered AL01 Core links: PASS')
          PY

      - name: Upload build QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al01-core-build-qa
          path: |
            _build/html
            myst-build.log
          if-no-files-found: warn
